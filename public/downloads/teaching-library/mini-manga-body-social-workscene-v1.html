<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ミニマンガ: からだか社会か、ではなく同じ仕事場面へ</title>
    <style>
      @page { size: A4 landscape; margin: 12mm; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; color: #07111f; margin: 0; background: #f8f3e8; }
      main { max-width: 1120px; margin: 0 auto; padding: 28px; }
      .sheet { background: #fffdf7; border: 1px solid #cbd5e1; padding: 24px; }
      .eyebrow { color: #0e7490; font-weight: 700; font-size: 13px; letter-spacing: .12em; }
      h1 { margin: 8px 0 10px; font-size: 34px; line-height: 1.18; }
      .lead { font-size: 16px; line-height: 1.9; color: #334155; max-width: 920px; }
      img { width: 100%; display: block; border: 1px solid #cbd5e1; background: #fff; margin-top: 18px; }
      .captions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
      .card { border: 1px solid #cbd5e1; background: #f8fafc; padding: 14px; }
      .card b { color: #0e7490; display: block; margin-bottom: 8px; }
      .card p { margin: 0; font-size: 14px; line-height: 1.8; }
      .note { border-left: 5px solid #0e7490; background: #ecfeff; padding: 12px 14px; margin-top: 16px; font-size: 13px; line-height: 1.8; }
      @media print { main { padding: 0; } body { background: white; } .sheet { border: 0; } }
    </style>
  </head>
  <body>
    <main>
      <section class="sheet">
        <div class="eyebrow">教材ライブラリ / ミニマンガ</div>
        <h1>からだか社会か、ではなく同じ仕事場面へ</h1>
        <p class="lead">医学モデルか社会モデルかを争う前に、同じ勤務場面で、体調、移動、資料、発言順、休憩がどう重なるかを見るための導入マンガです。</p>
        <img src="/resources/teaching-library/generated/body-social-workscene-mini-manga-v1.webp" alt="三つのコマで、体調側の見方、職場環境側の見方、同じ仕事場面での共同確認へ進む様子を示すマンガ" />
        <div class="captions">
          <div class="card">
            <b>1コマ目</b>
            <p>「体調の問題なら、どこまで会社が変える話ですか？」</p>
          </div>
          <div class="card">
            <b>2コマ目</b>
            <p>「環境の問題なら、本人の体調説明はいらないのでしょうか？」</p>
          </div>
          <div class="card">
            <b>3コマ目</b>
            <p>「同じ火曜午前の会議で、体調、移動、資料、発言順、休憩を一緒に見ましょう。」</p>
          </div>
        </div>
        <p class="note">使い方: これは個別判断ではなく、相互作用を見るための入口です。医学的説明と職場条件のどちらか一方に寄せず、同じ仕事場面に戻して話し合います。</p>
      </section>
    </main>
  </body>
</html>
