<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">発達障害と働く支援の第一原理モデル</title>
  <desc id="desc">本人を変える前に、仕事の仕様を処理できる形に変えるための16:9インフォグラフィック。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.5" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#fbf7ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.58" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .jp { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
      .title { font-size: 58px; font-weight: 800; letter-spacing: -1.6px; fill: #111827; }
      .subtitle { font-size: 29px; font-weight: 800; fill: #4338ca; }
      .badge { font-size: 21px; font-weight: 800; fill: #ffffff; }
      .formula-kicker { font-size: 21px; font-weight: 900; fill: #dbeafe; }
      .formula { font-size: 27px; font-weight: 900; fill: #ffffff; }
      .section { font-size: 32px; font-weight: 800; fill: #111827; }
      .item-title { font-size: 26px; font-weight: 800; fill: #111827; }
      .body { font-size: 20px; font-weight: 650; fill: #475569; }
      .bottom-title { font-size: 28px; font-weight: 800; fill: #111827; }
      .bottom-body { font-size: 22px; font-weight: 850; fill: #334155; }
      .chip { font-size: 21px; font-weight: 850; fill: #1e293b; }
      .footer { font-size: 18px; font-weight: 750; fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="110" r="240" fill="#7dd3fc" opacity="0.22"/>
  <circle cx="160" cy="940" r="280" fill="#c4b5fd" opacity="0.22"/>
  <circle cx="1500" cy="860" r="180" fill="#a7f3d0" opacity="0.18"/>

  <g class="jp">
    <rect x="62" y="44" width="1796" height="150" rx="34" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/>
    <text class="title" x="98" y="108">発達障害と働く支援の第一原理モデル</text>
    <text class="subtitle" x="100" y="158">本人を変える前に、仕事の仕様を「処理できる形」に変える。</text>
    <rect x="1488" y="72" width="326" height="94" rx="26" fill="url(#badge)"/>
    <text class="badge" x="1514" y="104">FCHMA / ICF中心</text>
    <text class="badge" x="1514" y="136">診断名ではなく構造を見る</text>
    <text class="badge" x="1514" y="164">AIは候補生成、人間が判断</text>

    <rect x="92" y="222" width="1736" height="154" rx="34" fill="#111827" filter="url(#shadow)"/>
    <rect x="124" y="250" width="806" height="98" rx="26" fill="#ffffff" opacity="0.10"/>
    <rect x="990" y="250" width="806" height="98" rx="26" fill="#ffffff" opacity="0.10"/>
    <text class="formula-kicker" x="154" y="282">困難の式</text>
    <text class="formula" x="154" y="312">認知・感覚・対人処理の特性 ×</text>
    <text class="formula" x="154" y="344">暗黙・即時・多重の仕事設計 = 詰まり</text>
    <text class="formula-kicker" x="1020" y="282">解決の式</text>
    <text class="formula" x="1020" y="312">暗黙を明示へ + 即時を非同期へ</text>
    <text class="formula" x="1020" y="344">多重を単線化へ + 記憶を外部化へ</text>

    <rect x="92" y="404" width="840" height="416" rx="34" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/>
    <rect x="124" y="430" width="776" height="62" rx="24" fill="#eff6ff"/>
    <text class="section" x="154" y="471">現実に起きる4つの詰まり</text>

    <g transform="translate(136 526)">
      <rect width="54" height="54" rx="19" fill="#1d4ed8"/>
      <text x="20" y="36" font-size="24" font-weight="900" fill="#ffffff">1</text>
      <text class="item-title" x="74" y="22">感覚過負荷</text>
      <text class="body" x="74" y="56">音・光・温度・におい・人の多さが、集中や回復を削る。</text>
    </g>
    <g transform="translate(136 610)">
      <rect width="54" height="54" rx="19" fill="#4338ca"/>
      <text x="20" y="36" font-size="24" font-weight="900" fill="#ffffff">2</text>
      <text class="item-title" x="74" y="22">情報処理の過負荷</text>
      <text class="body" x="74" y="56">会議、長い説明、同時処理で、理解・判断・発言が追いつかない。</text>
    </g>
    <g transform="translate(136 694)">
      <rect width="54" height="54" rx="19" fill="#d97706"/>
      <text x="20" y="36" font-size="24" font-weight="900" fill="#ffffff">3</text>
      <text class="item-title" x="74" y="22">暗黙指示と優先順位不明</text>
      <text class="body" x="74" y="56">「いい感じに」「なる早で」が、ミス・手戻り・自己否定に変わる。</text>
    </g>
    <g transform="translate(136 778)">
      <rect width="54" height="54" rx="19" fill="#be123c"/>
      <text x="20" y="36" font-size="24" font-weight="900" fill="#ffffff">4</text>
      <text class="item-title" x="74" y="22">割込み・切替・対人即応</text>
      <text class="body" x="74" y="56">予定外の声かけ、電話、接客、並行業務で、疲労と誤解が蓄積する。</text>
    </g>

    <rect x="988" y="404" width="840" height="416" rx="34" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/>
    <rect x="1020" y="430" width="776" height="62" rx="24" fill="#ecfdf5"/>
    <text class="section" x="1050" y="471">支援で行う5つの設計変更</text>

    <g transform="translate(1032 512)">
      <rect width="234" height="48" rx="20" fill="#ccfbf1"/>
      <text class="item-title" x="22" y="32">明示化</text>
      <text class="body" x="260" y="30">何を・いつまでに・どの品質で・誰へ、を4点セットで伝える。</text>
    </g>
    <g transform="translate(1032 582)">
      <rect width="234" height="48" rx="20" fill="#dbeafe"/>
      <text class="item-title" x="22" y="32">外部化</text>
      <text class="body" x="260" y="30">記憶や段取りを、メモ・チェックリスト・見本に出す。</text>
    </g>
    <g transform="translate(1032 652)">
      <rect width="234" height="48" rx="20" fill="#e0e7ff"/>
      <text class="item-title" x="22" y="32">単線化</text>
      <text class="body" x="260" y="30">同時進行を減らし、集中時間・割込み時間を分ける。</text>
    </g>
    <g transform="translate(1032 722)">
      <rect width="234" height="48" rx="20" fill="#fef3c7"/>
      <text class="item-title" x="22" y="32">非同期化</text>
      <text class="body" x="260" y="30">事前資料、チャット、議事録で、即答前提を下げる。</text>
    </g>
    <g transform="translate(1032 792)">
      <rect width="234" height="48" rx="20" fill="#dcfce7"/>
      <text class="item-title" x="22" y="32">環境調整</text>
      <text class="body" x="260" y="30">席、音、光、通知、休憩を、仕事品質を守る条件にする。</text>
    </g>

    <rect x="92" y="852" width="360" height="176" rx="34" fill="url(#loop)" filter="url(#shadow)"/>
    <text class="bottom-title" x="124" y="902">支援ループ</text>
    <text class="bottom-body" x="124" y="942">観察 → 仮説</text>
    <text class="bottom-body" x="124" y="978">→ 設計 → 試行</text>
    <text class="bottom-body" x="124" y="1014">→ 結果で更新</text>

    <rect x="480" y="852" width="920" height="176" rx="34" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/>
    <text class="bottom-title" x="512" y="902">共有すべき3つの合意</text>
    <rect x="512" y="926" width="258" height="76" rx="24" fill="#eff6ff"/>
    <rect x="794" y="926" width="276" height="76" rx="24" fill="#f5f3ff"/>
    <rect x="1094" y="926" width="274" height="76" rx="24" fill="#ecfdf5"/>
    <text class="chip" x="534" y="958">努力不足と</text>
    <text class="chip" x="534" y="986">決めつけない。</text>
    <text class="chip" x="816" y="958">配慮は特別扱いでなく</text>
    <text class="chip" x="816" y="986">仕事品質の設計。</text>
    <text class="chip" x="1116" y="958">一度決めて終わらず</text>
    <text class="chip" x="1116" y="986">運用データで更新。</text>

    <rect x="1428" y="852" width="400" height="176" rx="34" fill="#eef2ff" filter="url(#shadow)"/>
    <text class="bottom-title" x="1460" y="902">使う人</text>
    <text class="body" x="1460" y="938">本人・家族、上司・同僚、人事、</text>
    <text class="body" x="1460" y="970">支援者、医療・教育・地域支援が、</text>
    <text class="body" x="1460" y="1002">同じ地図で「何を変えるか」を話す。</text>

    <text class="footer" x="82" y="1060">目標は「普通に合わせること」ではなく、強みが出る仕事条件を一緒に作ること。</text>
    <text class="footer" x="1372" y="1060">NBL はたらく相談室 / 専門知識ネットワーク</text>
  </g>
</svg>
