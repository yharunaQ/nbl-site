<h1 align="center">求人の確保</h1>
<h2>概要（ポイント）</h2>
<p>所内や高齢・障害者協会等の情報により障害者雇用の見込み事業主の把握をした際には、事業所担当者へ連絡を取り支援制度の説明や登録者の状況等についての事前説明を十分に行う。
登録者への相談の際には、具体的な業務内容等を提示した上での相談を行うことが可能となる。</p>
<h2>この取組による効果</h2>
<p>事業主においては、支援制度や障害特性についての理解の促進となっていると思われる。
登録者においては、具体的な業務内容を踏まえた上での求人検討が可能となっていると思われる。</p>
<h2>実施ハローワーク</h2>
<p>青森労働局　ハローワーク十和田 三沢公共職業安定所十和田出張所</p>
