<h1 align="center">職業準備支援より得られた情報の共有</h1>
<h2>概要（ポイント）</h2>
<p>職業準備支援を通じて判明した事、特に面談だけではわからなかった問題・課題について情報を共有し、職業相談に生かす。</p>
<h2>この取組による効果</h2>
<p>職業経験の無い者、転職を繰り返す者などの中に、障害以外の課題・問題がある者がいる。職業準備支援の中で新しく判明した課題・問題も含めて情報を共有し、職業相談・職業紹介・ジョブコーチ支援などの定着指導に活用している。</p>
<h2>地域連携機関</h2>
<p>滋賀障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>草津公共職業安定所</p>
