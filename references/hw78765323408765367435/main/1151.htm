<h1 align="center">求職者情報の作成及び事業所への提供</h1>
<h2>概要（ポイント）</h2>
<p>人の意向」や「障害に関する状況」などを記載した求職者情報を作成し、一定規模以上の事業所などへ持参及び郵送を行っている。また、雇用率未達成企業への指導など事業所を訪問する際にも持参し障害者雇用への理解に役立てている。</p>
<h2>この取組による効果</h2>
<p>障害者雇用を検討している企業からの問い合わせにより、面接等へ進むケースもある。障害者雇用に消極的な事業所であっても障害者雇用について理解を得る契機になることも期待している。</p>
<h2>実施ハローワーク</h2>
<p>鳥取労働局　ハローワーク倉吉 ハローワーク倉吉</p>
