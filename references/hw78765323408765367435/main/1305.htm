<h1 align="center">障害者就職ミニ面接会の開催</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用率達成指導を実施し、早期の雇用率達成及び障害者の雇用促進を図るため、障害者を対象とした小規模（２～３社）の面接会（各社８名程度の面接）を開催している。</p>
<h2>この取組による効果</h2>
<p>多くの障害者と面接を希望する企業からは、面接会形式を希望され期待に応えられている。
迅速な対応がとれ、障害者雇用率達成及び障害者の雇用促進に効果が出た。
大規模な面接会ではなく、所の会議室にて開催ができ、時間や労力並びに費用がかからない。</p>
<h2>実施ハローワーク</h2>
<p>岐阜労働局　ハローワーク岐阜 岐阜公共職業安定所</p>
