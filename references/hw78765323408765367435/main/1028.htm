<h1 align="center">早期求人情報提供</h1>
<h2>概要（ポイント）</h2>
<p>・ 障害者用求人が出たら、登録者の中で該当する求職者にできるだけ早く求人情報を送付。
・ それに合わせて、しばらく来所してない求職者には近況調査を行う。</p>
<h2>この取組による効果</h2>
<p>・ 情報提供もすることにより、就職希望の状況を把握しやすい。
・ 企業にも早期に障害者雇用に取り組んでもらえる。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク飯能 ハローワーク飯能</p>
