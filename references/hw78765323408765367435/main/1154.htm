<h1 align="center">急募障害者求人の掲載（主な事項についてマーカーで強調）</h1>
<h2>概要（ポイント）</h2>
<p>障害者対象求人で早期に充足を図りたい事業所求人や多数の障害者が応募できると思われる求人を選定し障害者求人閲覧コーナー脇の壁に掲示</p>
<h2>この取組による効果</h2>
<p>障害者用求人はファイルに綴じてあるが、閲覧コーナー脇の壁に掲示することにより求職者の目線にすぐ入り、求人を探しやすくなり、当該求人に関する相談等が増えた。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク千葉南 千葉南所専門援助部</p>
