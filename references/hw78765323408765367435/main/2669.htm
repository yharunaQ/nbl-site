<h1 align="center">家族等に対する説明、相談</h1>
<h2>概要（ポイント）</h2>
<p>特別支援学校を訪問し、生徒、保護者等を対象に、就職に向けての準備、心構え等についての説明、相談等を行う。</p>
<h2>この取組による効果</h2>
<p>就職に対しての意識高揚を図ることができる。</p>
<h2>地域連携機関</h2>
<p>三国公共職業安定所</p>

<p>三国公共職業安定所</p>
