<h1 align="center">　職場適応指導における同行</h1>
<h2>概要（ポイント）</h2>
<p>
　障害者と事業主との間でコミュニケーションがうまくいっていない、障害者理解の不十分な事業所において実施する職場適応指導に、センターの支援員の同行をお願いしている。

</p>
<h2>この取組による効果</h2>
<p>　障害者の職業生活、日常生活における悩みなど気軽に相談できる場であることを紹介し、不安の解消に努めている。</p>
<h2>地域連携機関</h2>
<p>東総障害者就業・生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>銚子所求人・特別援助部門</p>
