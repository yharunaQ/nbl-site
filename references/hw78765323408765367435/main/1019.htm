<h1 align="center">事業主へ求職情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>本人の了解のもと職歴希望職種等を盛り込んだ求職情報を作成して求人開拓の際に事業所に提供する。
　一般求人から転用する場合には障害による制限を説明して応募可能性を拡大する。</p>
<h2>この取組による効果</h2>
<p>特に障害者雇用の実績のないまたは少ない事業所については職歴を提示することで雇用不安の解消になる。</p>
<h2>実施ハローワーク</h2>
<p>群馬労働局　ハローワーク伊勢崎 伊勢崎公共職業安定所</p>
