<h1 align="center">地域の教育、福祉、等の機関の連携</h1>
<h2>概要（ポイント）</h2>
<p>横須賀市の「子どもサポートシステム推進事業」の一環である「相談支援チーム」の「就労相談部会」に参加して、特別支援学校、就労援助センターと連携を図った。</p>
<h2>この取組による効果</h2>
<p>地域の教育、福祉、保健医療、労働の機関が連携して障害児（者）の就労へ向けた準備作業の一助とした。</p>
<h2>地域連携機関</h2>
<p>横須賀市役所</p>
<h2>実施ハローワーク</h2>
<p>横須賀公共職業安定所　専門援助部門</p>
