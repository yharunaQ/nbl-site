<h1 align="center">毎日の新規求人の回覧による求人求職の照合</h1>
<h2>概要（ポイント）</h2>
<p>新規求人の回覧を行うことにより、求人求職の照合を行い、求人情報の提供を行っている。</p>
<h2>この取組による効果</h2>
<p>雇用保険受給者や、緊急性を要する求職者に情報を提供することにより、軽作業求人等早期に充足が見込まれる求人への応募を図っている。</p>
<h2>実施ハローワーク</h2>
<p>長野労働局　ハローワーク伊那 伊那公共職業安定所</p>
