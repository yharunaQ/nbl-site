<h1 align="center">「障害者個別情報シート」の活用</h1>
<h2>概要（ポイント）</h2>
<p>精神障害者のセールスポイントや配慮点、症状への対応等を把握するため、障害者当事者と相談・確認しながら作成し、職業相談・紹介時、事業所への説明時に活用している。</p>
<h2>この取組による効果</h2>
<p>当事者の状況について、職員・事業所で理解を深めることができ、当事者本人も障害等について整理ができる。</p>
<h2>実施ハローワーク</h2>
<p>宮城労働局　ハローワーク仙台 ハローワーク仙台</p>
