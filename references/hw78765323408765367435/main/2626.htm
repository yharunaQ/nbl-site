<h1 align="center">　当該支援センター等から通勤圏の就業場所の障害者求人が提出された場合、情報提供している。
</h1>
<h2>概要（ポイント）</h2>
<p>　新規障害者求人を受理及び企業からの問合せ等があった場合、企業の了解を得たうえで就労支援センター及び就労移行支援事業者に連絡を入れている。</p>
<h2>この取組による効果</h2>
<p>当情報より実習を経て就職が決定したケースがあり、また就職に至らなくても事業所に地域の情報提供する機会となった。
　就労希望者がいる授産施設等が常に支援センターと連絡を取り合うなど連携促進につながる。</p>
<h2>地域連携機関</h2>
<p>桶川市就労支援センター　他</p>
<h2>実施ハローワーク</h2>
<p>大宮所　特別援助部門</p>
