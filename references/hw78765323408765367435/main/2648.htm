<h1 align="center">同行による職場定着指導</h1>
<h2>概要（ポイント）</h2>
<p>進路指導担当教諭が卒業生の追指導を行う際にできる限り同行し、職場定着指導を行った。</p>
<h2>この取組による効果</h2>
<p>　同行訪問することにより、障害者の就労状況等を共有できたこと。何か問題が発生した場合は、即連携をとっての対応が可能となったこと。
　他に、ハローワークの人となると、どこかよそよそしい感じがするが、先生と一緒に来たハローワークの人ということで、障害者も打ち解けて話ができたと思われる。</p>
<h2>地域連携機関</h2>
<p>秋田県立比内養護学校かづの分校</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク鹿角</p>
