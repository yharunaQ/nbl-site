<h1 align="center">福祉施設への定期的な求人情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>ハローワークでマッチングしたものの紹介出来なかった障害者専用求人を、顔が見える関係となっている福祉施設にFAXし、福祉施設利用者から応募してもらっている。</p>
<h2>この取組による効果</h2>
<p>福祉施設との連携により求人に紹介することができる。応募可能の場合は、福祉施設とハローワークの同行面接がスムーズにいく。結果、就職とその後の定着につながっている。</p>
<h2>地域連携機関</h2>
<p>西蒲原福祉事務組合ふれあいの家</p>
<h2>実施ハローワーク</h2>
<p>巻公共職業安定所</p>
