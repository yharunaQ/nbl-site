<h1 align="center">雇用率未達成企業に対して、求職者情報を提示し雇用を呼びかけている。</h1>
<h2>概要（ポイント）</h2>
<p>　情報誌に登録する数は少ないが、求職者の情報を限定して掲載している</p>
<h2>この取組による効果</h2>
<p>　登録されている求職者の情報を伝えることで、今後の従業員採用の目安となるものと思われる。</p>
<h2>実施ハローワーク</h2>
<p>長崎労働局　ハローワーク対馬 対馬所</p>
