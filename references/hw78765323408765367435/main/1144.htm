<h1 align="center">
事業主への支援ツールの効果的な提供
</h1>
<h2>概要（ポイント）</h2>
<p>支援策（職場適応訓練、トライアル雇用、ジョブコーチ制度、特定求職者雇用開発助成金等）の説明資料として、支援策活用の組み合わせ方について「就職支援プログラム」というタイトルの図表を作成し、事業主へ提供している。</p>
<h2>この取組による効果</h2>
<p>　表を見ながら具体的に説明することにより、事業主の理解も得られやすくその事が支援策の効果的な活用につながり、雇用へ結び付けやすくなっている。</p>
<h2>実施ハローワーク</h2>
<p>沖縄労働局　ハローワーク沖縄 沖縄所</p>
