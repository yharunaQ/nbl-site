<h1 align="center">正式紹介前の個別面談の実施</h1>
<h2>概要（ポイント）</h2>
<p>・精神障害者や知的障害者については、自分だけで面接ができない場合が少なからずある。
・安定所内にて一度面談して正式に紹介を行う。
・その都度と日時設定（障害者面談会など）の場合あり
・過去に求人の提出で現在未提出の企業対応も可能</p>
<h2>この取組による効果</h2>
<p>・求職者は、普段来ている場所ということで心理的プレッシャーが緩和される。
・事業主も安心感があることと一度会っているので正式面接に至れば採用の可能性が高い。</p>
<h2>実施ハローワーク</h2>
<p>愛知労働局　ハローワーク名古屋中 専門援助第三部門</p>
