<h1 align="center">民間の就労移行支援事業者との連携</h1>
<h2>概要（ポイント）</h2>
<p>就労移行支援事業者が行う就労セミナーにて、ハローワークの利用方法等について講習を実施。
　障害者専用求人を定期的に情報提供。</p>
<h2>この取組による効果</h2>
<p>就労移行支援事業者利用者の中には、就労経験がない者、ハローワークを利用したことがない者もおり、就労に対する意識向上、今後の職業相談・紹介につなげていく。
　定期的に障害者専用求人を提供することで、開拓につなげていく。</p>
<h2>地域連携機関</h2>
<p>株式会社 メディアベース スキルアップスクール SES
（就労移行支援事業者）
</p>
<h2>実施ハローワーク</h2>
<p>静岡公共職業安定所</p>
