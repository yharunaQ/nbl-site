<h1 align="center">障害者初回相談時における統一独自様式の活用による、相談内容の充実と相談時間の有効活用</h1>
<h2>概要（ポイント）</h2>
<p>統一した様式を利用することにより、相談内容の統一化、充実を図る。

　※別添様式あり</p>
<h2>この取組による効果</h2>
<p>障害者の職業相談を行う上で、ベースとなるものがあるため、２回目以降の相談において同じ事を繰り返し聞いてしまう等の無駄が無くなり、相談内容が充実し相談時間の有効活用が出来るようになった。</p>
