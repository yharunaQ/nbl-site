<h1 align="center">　精神障害者ジョブコンサルタントを利用した精神障害者関係の研修について

</h1>
<h2>概要（ポイント）</h2>
<p>　約月1回、来所する精神障害者ジョブコンサルタントの、求職者相談の合間を利用して「統合失調症」の特性等の研修を職員、相談員に行う。</p>
<h2>この取組による効果</h2>
<p>　職員、相談員の専門知識が向上され職務に活用されている。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク千葉 千葉所専門援助部門</p>
