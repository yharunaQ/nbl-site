<h1 align="center">訪問による説明会及び安定所見学会</h1>
<h2>概要（ポイント）</h2>
<p>施設利用中の就労移行希望者にたいして、求職登録、安定所の利用方法、各種援助制度について、施設に出向いて説明するとともに、施設及び利用者の状況把握を行っている。</p>
<h2>この取組による効果</h2>
<p>施設の状況及び利用者の状況を把握することができ、その後の相談や連携がスムーズに行える。</p>
<h2>地域連携機関</h2>
<p>スイーツ（就労移行支援事業者）
出石精和園（就労移行支援事業者）
</p>
<h2>実施ハローワーク</h2>
<p>職業相談第２部門</p>
