<h1 align="center">担当者制による予約相談</h1>
<h2>概要（ポイント）</h2>
<p>障害者の種類や程度によって、担当者を決めて予約相談を実施。</p>
<h2>この取組による効果</h2>
<p>担当者を決めることにより、一貫した職業相談を実施することができ、求職者の不安等を軽減できる。</p>
<h2>実施ハローワーク</h2>
<p>石川労働局　ハローワーク金沢 ハローワーク金沢</p>
