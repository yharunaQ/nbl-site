<h1 align="center">施設担当者を伴った事業所見学会の実施</h1>
<h2>概要（ポイント）</h2>
<p>　未達成企業に対し、福祉施設への情報提供と協力について了解を得た上で福祉施設担当者を伴い見学会をする。</p>
<h2>この取組による効果</h2>
<p>　福祉施設担当者が現場を把握することにより、施設利用者へ具体的提案が出来るようになり、紹介や実習につながると思われる。
　受け入れ先企業と各担当との連携により、相互理解が深まると考えられる。</p>
