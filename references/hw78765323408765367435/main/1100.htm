<h1 align="center">「障害者雇用の支援メニュー」の活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者を雇用する際の不安感解消などのため、実習・職業訓練・トライアル雇用などから常用雇用に至るまでの支援メニューを作成し、雇用率達成指導、求人開拓の際に活用している。</p>
<h2>この取組による効果</h2>
<p>説明の際にトライアル雇用についての質問が出るなど事業主の理解は得られやすいと思われる。</p>
