<h1 align="center">求職者本人が作成する自己PR票の活用</h1>
<h2>概要（ポイント）</h2>
<p>求職公開申込書（障害者用）を有効活用し、障害者本人に希望により提出いただき紹介時に職員、相談員の本人情報として活用し、事業主へのPRにしている。なお、公開を希望する障害者はインターネットへ公開をしている。
また、求職者情報を作成し、事業主への提供の際活用している。</p>
<h2>この取組による効果</h2>
<p>相談時に聞き取りしきれない部分も分かり、本人も作成することで、自分を振り返ることができる。事業主へのPRには有効であると考える。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク浜松 浜松</p>
