</h1>
<h2>概要（ポイント）</h2>
<p>A　学校（養護・聾）主催による職場実習懇談会に参加し、関係機関・関係企業との意見・情報交換を行う。
B　福祉施設のコーディネーターと個々による情報交換を行っている。福祉施設・作業所等の職員が該当者と来所し、ケース会議を行ったりしている。</p>
