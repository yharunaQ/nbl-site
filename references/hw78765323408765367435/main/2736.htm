<h1 align="center">「心身障害者職業自立地域推進協議会」委員</h1>
<h2>概要（ポイント）</h2>
<p>管内の福祉施設、行政機関が委員として参加し、養護学校の生徒の活動を知るとともに、生徒の卒業後の進路について、各機関が連携して、多種多様な支援を協議していく場としている。</p>
<h2>この取組による効果</h2>
<p>学校内での就業に向けた活動等を、関係機関が詳細に知ることができ、また、各施設、機関で行われている支援策について、どのような支援が行えるのか意見交換を行ったり、互いに情報を共有することにより、生徒たちへの卒業後の就職にスムーズにつなげていくことが出来る。</p>
<h2>地域連携機関</h2>
<p>宮古養護学校</p>
<h2>実施ハローワーク</h2>
<p>宮古公共職業安定所</p>
