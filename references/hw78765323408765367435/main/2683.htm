<h1 align="center">関係機関との連携による「障害者合同面接会」</h1>
<h2>概要（ポイント）</h2>
<p>枚方市役所・ハローワーク枚方・枚方市障害者就業・生活支援準備センターが中心となり、実行委員となっている各関係機関が一丸となって取り組むことにより、情報の共有化、連携の促進が図られている。</p>
<h2>この取組による効果</h2>
<p>事業主の障害者雇用への理解促進、福祉的就労から一般雇用への促進、並びに市民への障害者施策へのＰＲに効果がある。</p>
<h2>地域連携機関</h2>
<p>枚方市役所・枚方市障害者就業・生活支援準備センター</p>
<h2>実施ハローワーク</h2>
<p>枚方公共職業安定所</p>
