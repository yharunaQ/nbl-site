<h1 align="center">求人情報、訓練校等の情報提供</h1>
<h2>概要（ポイント）</h2>
<p>求職登録内容を参考に求人票などの情報を提供。応募締め切りがある場合や急募の場合は電話にて早急に連絡する。</p>
<h2>この取組による効果</h2>
<p>週間発行の求人情報のみでは、本人の希望に合う求人該当が少なくなるため。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク門司 門司所</p>
