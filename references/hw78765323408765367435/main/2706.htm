<h1 align="center">京都府南部就労支援ネットワーク会議への参加</h1>
<h2>概要（ポイント）</h2>
<p>障害者就業・生活支援センターはぴねすが中心となり、京都府南部地域の就業移行支援事業者、特別支援学校が集まり、就労支援のため勉強会を定期的に開催。HWも各機関の悩み等を確認する場として参加。</p>
<h2>この取組による効果</h2>
<p>各機関の悩みの解決や、就労に関する情報交換の場として活用されている。</p>
<h2>地域連携機関</h2>
<p>ジョブサポートセンターマキシマ、魁、あんびしゃ
（就労移行支援事業者）
障害者就業・生活支援センターはぴねす
桃山養護、城陽養護、南山城養護学校
</p>
<h2>実施ハローワーク</h2>
<p>宇治・専門相談部門</p>
