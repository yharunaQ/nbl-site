<h1 align="center">ジョブコーチの活用</h1>
<h2>概要（ポイント）</h2>
<p>初めて障害者（知的）を雇用した事業所より対応に苦慮しているとの相談を受けた際、解決の１つの方法として「ジョブコーチ」の利用を提案し、障害者本人及び保護者の同意を得て導入。</p>
<h2>この取組による効果</h2>
<p>「ジョブコーチ」が障害者及び事業所双方に適切に助言をすること等により、障害者の特性に合った業務を事業所側が設定し障害者本人も比較的スムーズに対応できたことで、支援期間終了後職場に定着している。</p>
<h2>実施ハローワーク</h2>
<p>愛媛労働局　ハローワーク新居浜 新居浜公共職業安定所</p>
