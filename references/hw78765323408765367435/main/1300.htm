<h1 align="center">障害者求職情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>障害の部位、職務経験、資格等を記載した障害者登録の名簿を活用し、雇用率未達成事業所へ訪問の際に、求人開拓に活用。</p>
<h2>この取組による効果</h2>
<p>求人開拓をし、すぐに面接までの流れにのることは困難であるものの、障害者雇用にあたっては、事業主側の意識を高めるとともに、職域開発の参考になるものと思われる。</p>
<h2>実施ハローワーク</h2>
<p>青森労働局　ハローワーク野辺地 職業紹介部門</p>
