<h1 align="center">就労移行支援セミナーの開催</h1>
<h2>概要（ポイント）</h2>
<p>就労移行支援事業者施設では独自に就労支援セミナーを実施しているが、マンネリになりがちなため、外部（ハローワーク）の講師が施設に出向き、セミナーを開催することによって、支援対象者のモチベーションを高める（施設側の要請による）。</p>
<h2>この取組による効果</h2>
<p>外部講師のセミナー受講で、支援対象者にはかなりの刺激があったように見受けられる。さらにハローワークにとっても、実地で多くの支援者対象者に接し、効率的にまとめて状況把握ができる効果がある。</p>
<h2>地域連携機関</h2>
<p>ハローワーク飯塚</p>
<h2>実施ハローワーク</h2>
<p>飯塚</p>
