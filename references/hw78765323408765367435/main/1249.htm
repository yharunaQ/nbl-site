<h1 align="center">求職者情報（３０名）の作成</h1>
<h2>概要（ポイント）</h2>
<p>毎月求職者情報を作成し、雇用指導官の未達成企業への求人開拓や障害者相談員の職場定着指導時に活用。</p>
<h2>この取組による効果</h2>
<p>求人開拓時に求職者情報を活用することにより、現在どういう障害者がいて、どういう仕事を求めているかなどのイメージがつかめる。</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク三鷹 三鷹公共職業安定所</p>
