<h1 align="center">求職情報の作成・活用</h1>
<h2>概要（ポイント）</h2>
<p>所独自の求職情報を作成し、未達成企業の訪問の際に持参し、情報提供・求人開拓を行っている。
又、定期的に未達成企業に郵送している</p>
<h2>この取組による効果</h2>
<p>企業からの求職者紹介のリクエストがあり、面接に至り採用になったケースもある。
ある程度具体的な求職者の情報を提示することで、企業の採用意欲の喚起につながり、紹介・面接に至る可能性が高まる。</p>
