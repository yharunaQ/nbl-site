<h1 align="center">障害者求人提出時に作業風景や現場の画像を撮り、DMや相談時の作業の解説に活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者求人を提出する際に作業風景・環境の画像の提供を受け（可能であれば見学して撮影する）DMや窓口相談時に活用する。</p>
<h2>この取組による効果</h2>
<p>・応募を検討している求職者がより具体的に求人を理解しやすくなる。（半年でまだ1件だけですが、事業所より求人提出の相談があった場合は積極的に依頼したいと思う）</p>
