<h1 align="center">障害者部門における障害者専用求人の再確認</h1>
<h2>概要（ポイント）</h2>
<p>障害者専用求人を求人部門にて受付した場合は、必ず企業の担当者を障害者部門に誘導し、求人内容等更なる聞き取りを行う。</p>
<h2>この取組による効果</h2>
<p>これにより、ミスマッチの回避にもつながる。
求職者への求人内容以外の情報提供ができ、求職者からは好評である。</p>
<h2>実施ハローワーク</h2>
<p>岐阜労働局　ハローワーク岐阜 岐阜公共職業安定所</p>
