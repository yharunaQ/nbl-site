<h1 align="center">トライアル求人を１冊のファイルにまとめ、求職者に情報提供している。</h1>
<h2>概要（ポイント）</h2>
<p>　トライアル求人を１冊のファイルにまとめ、求職者に分かりやすく情報提供する。</p>
<h2>この取組による効果</h2>
<p>　トライアル求人を１冊のファイルにまとめることにより、トライアル制度の利用促進が図られた。また、求職者サイドからみると、トライアル求人が分かりやすく見やすく、容易に探すことが可能となった。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク市川 市川所専門援助部門</p>
