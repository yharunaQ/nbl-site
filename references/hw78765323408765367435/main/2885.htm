<h1 align="center">巡回職業相談</h1>
<h2>概要（ポイント）</h2>
<p>就労移行支援を行っている施設を訪問し、支援対象者に対する職業相談を実施。</p>
<h2>この取組による効果</h2>
<p>施設内での本人の作業状況を見ることにより、本人の職業能力を把握することに役立つ。</p>
<h2>地域連携機関</h2>
<p>大淀授産所</p>
<h2>実施ハローワーク</h2>
<p>下市所</p>
