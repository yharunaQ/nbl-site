<h1 align="center">職場実習先の確保</h1>
<h2>概要（ポイント）</h2>
<p>　特別支援学校の生徒のために、職場実習先を確保</p>
<h2>この取組による効果</h2>
<p>　職場実習先の確保が難しい状況にある中、ハローワークが職場実習先の確保に努め、特別支援学校側へ情報提供することで、役割分担を明確にしている。</p>
<h2>地域連携機関</h2>
<p>特別支援教育機関</p>
<h2>実施ハローワーク</h2>
<p>市川所専門援助部門</p>
