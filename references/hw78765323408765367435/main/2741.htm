<h1 align="center">・福祉施設職員等との同行紹介</h1>
<h2>概要（ポイント）</h2>
<p>
・ハローワークで紹介した障害者が福祉施設利用者・障害者就業・生活支援センター利用者の場合には、事業所との面接に際し、原則として同行紹介を行うこととし、事業所に対し、本人の障害程度・雇用管理上の留意点等についてもきめ細かく説明している。
</p>
<h2>この取組による効果</h2>
<p>・長年支援をしてきた機関の職員から本人に関して、事業所に対していろいろな角度から具体的な話をすることができ、事業所の障害者に関する理解を得やすくなった。</p>
<h2>地域連携機関</h2>
<p>ハローワーク村上</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク村上</p>
