<h1 align="center">求職者ニーズ、詳細な状態の把握による確実な対応（独自に作成・活用しているものはない）</h1>
<h2>概要（ポイント）</h2>
<p>新規登録時等における求職者のニーズ・状態の詳細把握によるきめ細かな職業相談や担当者不在時の来所回避のための予約相談の実施等。</p>
<h2>この取組による効果</h2>
<p>紹介成功率の向上と目標数を上回る就職実績
〔平成19年度上半期の状況〕
紹介件数13件、就職件数11件（目標数7件）</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク網走 網走</p>
