<h1 align="center">求職者情報を載せた情報誌の活用</h1>
<h2>概要（ポイント）</h2>
<p>新規求職登録者を中心に「障害部位・程度」「希望職種」「職歴・免許・資格」等を盛り込んだ障害者求職情報を作成し、雇用指導官の雇用率未達成企業の求人開拓に活用している。</p>
<h2>この取組による効果</h2>
<p>雇用指導官の事業所訪問時に可能な限り同行し、事業主等との面談時に多種多様な求職登録者がいることを説明することにより、障害者に対する理解や認識を深めてもらい、求人の提出やリクエストの受付に効果を上げている。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク福岡南 福岡南所</p>
