<h1 align="center">障害者対象求人票を総合受付に用意</h1>
<h2>概要（ポイント）</h2>
<p>求職者より障害者相談窓口を介さず、求人票を見られるようにしてほしいとの要望をうけ、総合受付にも障害者対象求人票を用意し、申し出あれば自由に見てもらえるようにした。</p>
<h2>この取組による効果</h2>
<p>障害者との相談は長くなることも多いため、順番の待ち時間も長くなり、また来ますと帰る人もいる。求人情報を見に来ただけの人にとっては待たずに済むようになった。</p>
<h2>実施ハローワーク</h2>
<p>茨城労働局　ハローワーク古河 古河公共職業安定所</p>
