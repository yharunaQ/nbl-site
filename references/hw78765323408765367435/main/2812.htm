<h1 align="center">就業・生活支援センター利用者のハローワークガイダンス・見学</h1>
<h2>概要（ポイント）</h2>
<p>施設利用者のうち精神障害者については就労経験が少ない方や、就職に向けての
体験も少ないことから、安定所見学もかねてハローワークの利用方法や就労にむけての支援内容の講話を行った。求人検索機利用などの体験を通じて実際の求人状況について知る機会になった。
</p>
<h2>この取組による効果</h2>
<p>就業・生活支援センター利用の精神障害者にとっては、就労に向けてのハローワークの支援内容を理解することができたと思われる。</p>
<h2>地域連携機関</h2>
<p>就業・生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>池袋　公共職業安定所</p>
