<h1 align="center">学校協議会への出席</h1>
<h2>概要（ポイント）</h2>
<p>学校協議会の委員として会議に出席。
他の委員との情報交換を行うとともに、学校における就労に向けた取り組みについて提案。</p>
<h2>この取組による効果</h2>
<p>「個別の教育支援計画」の様式作成段階から、ハローワークとしての意見を出すことができ、卒業後の進路も見据えたものとすることができた。
これの活用については、今後の課題であるが、学校協議会の場で論議が深められると思われる。
また、学校および協議会委員間での連携体制も充実。
</p>
<h2>地域連携機関</h2>
<p>特別支援教育機関（府立岸和田養護学校）</p>
<h2>実施ハローワーク</h2>
<p>専門援助部門</p>
