<h1 align="center">職場定着指導の実施</h1>
<h2>概要（ポイント）</h2>
<p>障害者に対して各所で取り組んでいるのと同じことであるが、聴覚障害者の職場定着指導として会社訪問をして、状況を聞いてきたところ、仕事が楽しいとのことであった。その後数ヶ月して突然辞めたいと言葉にし、何度か職業相談や、ＦＡＸでやりとりをした。担当が変わり初対面でも職場に行って本人と会話をすれば相手もいろいろと相談にきてアドバイス等を求められる。</p>
<h2>この取組による効果</h2>
<p>今現在も継続して勤務しています。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク秩父 秩父</p>
