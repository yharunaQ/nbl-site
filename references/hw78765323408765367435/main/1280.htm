<h1 align="center">求職情報作成時の工夫</h1>
<h2>概要（ポイント）</h2>
<p>従来からハローワークシステムにより求職情報を作成しているが、データの並べ替え等に制限があるので、データを加工。居住する地域の情報（市町村、地区）を加え、並べかえ、データの抽出を行いやすいようにした。</p>
<h2>この取組による効果</h2>
<p>事業所訪問時、事業所から登録者の状況（部位別、地域別等）の問合せがあった際、即座に答えることができる。事業所が求人条件等を検討する際の材料をすばやく提供することができる。</p>
<h2>実施ハローワーク</h2>
<p>大分労働局　ハローワーク日田 ハローワーク日田</p>
