<h1 align="center">福祉施設との連絡体制、役割分担の構築</h1>
<h2>概要（ポイント）</h2>
<p>職業相談において、生活面（主に金銭面）について問題ある障害者に対して、生活支援センターへ強力を依頼。就労面はハローワーク、障害者職業センター、生活面は生活支援センターにて相談し、その内容については本人の了承のもと、各機関にて情報を共有している（主に電話による相談内容の報告）。</p>
<h2>この取組による効果</h2>
<p>雇用サイドは生活面での状況、指導内容、福祉サイドでは雇用面の状況、指導内容がわかり、一体となって障害者の定着に向け支援することが出来る。</p>
<h2>地域連携機関</h2>
<p>中津川市障害者生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>中津川公共職業安定所</p>
