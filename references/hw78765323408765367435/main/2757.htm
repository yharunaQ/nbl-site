<h1 align="center">就職準備講習会の開催</h1>
<h2>概要（ポイント）</h2>
<p>飯山養護学校と連携し、高等部生徒の進路選択及び教職員の進路指導等の参考とするため、事業所見学２社と講演を実施する。</p>
<h2>この取組による効果</h2>
<p>養護学校生徒・教職員に、見学を行うことにより働く現場の確認を、講話を行うことにより働くことへの意識付けを行うことができる。
また、見学先事業所には、障害を持つ生徒と触れ合う機会を得ることにより、障害者への理解と雇用の促進を図ることができる。
</p>
<h2>地域連携機関</h2>
<p>飯山養護学校</p>
<h2>実施ハローワーク</h2>
<p>飯山公共職業安定所</p>
