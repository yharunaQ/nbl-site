<h1 align="center">介時における精神保健福祉士との連携</h1>
<h2>概要（ポイント）</h2>
<p>　求職者（当該医療センターの患者）を求人者へ紹介する際、担当の精神保健福祉士から紹介先事業所に対して、求職者の障害特性等説明してもらう（求職者及び求人者に同意済）</p>
<h2>この取組による効果</h2>
<p>①　障害特性等によっては、担当の精神保健福祉士から求人者へ直接説明してもらう方が説得力があり、求人者の理解を得やすい。
②　ハローワークとしては、応募動機が説明しやすくなり、配慮事項を踏まえたうえで、労働条件の緩和等について求人者に要請できた。</p>
<h2>地域連携機関</h2>
<p>国立病院機構　賀茂精神医療センター</p>
<h2>実施ハローワーク</h2>
<p>広島西条公共職業安定所</p>
