<h1 align="center">障害者の求職情報を作成</h1>
<h2>概要（ポイント）</h2>
<p>　求職者の同意を得て、求職条件等を一覧表に掲載して、雇用率未達成企業の求人開拓に活用している。
　また、窓口において求人者に対して、障害者求人の開拓等に活用している。</p>
<h2>この取組による効果</h2>
<p>　求人者よりのリクエスト等に結びついている。
　また、障害者の個々の障害に配慮した、求人開拓にも結び付いている。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク茂原 茂原所求人・特別援助部門</p>
