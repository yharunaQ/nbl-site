<h1 align="center">雇用支援月間中の所内パネル展</h1>
<h2>概要（ポイント）</h2>
<p>特別支援学校卒業生・授産施設・小規模作業所など働く障害者の写真パネルやトライアル雇用・ジョブコーチ・特定求職者雇用開発助成金等の説明パネルを、事業主に一番目が入る適用コーナー前の窓際にボードを設置し展示。</p>
<h2>この取組による効果</h2>
<p>事務処理の待ち時間に事業主がパネルにしばしば目を通してくれ、障害者の働く姿や各種支援制度の知識を得ることにより、一定の障害者雇用への理解が促進されたと思われる。</p>
<h2>実施ハローワーク</h2>
<p>兵庫労働局　ハローワーク柏原 事業所相談・学卒部門</p>
