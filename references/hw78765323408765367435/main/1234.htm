<title>家族や障害者職業センター等とのケース会議により、職業相談、同行面接及び就職後の職場定着の状況を共有する</title>
</head><body>
<h1 align="center">家族や障害者職業センター等とのケース会議により、職業相談、同行面接及び就職後の職場定着の状況を共有する</h1>
<h2>概要（ポイント）</h2>
<p>求職者について、的確な職業紹介を実施するため、家族や障害者職業センター等とケース会議を実施する。</p>
<h2>この取組による効果</h2>
<p>職業相談、同行面接及び就職後の職場定着の状況を共有することにより、障害者の就労支援の効果が高まっている。</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク上野 上野　公共職業安定所</p>
