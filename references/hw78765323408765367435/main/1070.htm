<h1 align="center">同行紹介</h1>
<h2>概要（ポイント）</h2>
<p>聴覚障害者や知的障害者など必要に応じて同行紹介</p>
<h2>この取組による効果</h2>
<p>同行することによって障害者を援助し、求人者に対しては職場改善の依頼や様々な支援について説明し、雇入れに際しての障害を減ずるよう配慮することができる。</p>
<h2>実施ハローワーク</h2>
<p>福井労働局　ハローワーク小浜 小浜公共職業安定所</p>
