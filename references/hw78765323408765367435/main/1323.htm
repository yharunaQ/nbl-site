<h1 align="center">北海道障害者職業能力開発校入校生を対象とした応募書類（履歴書・職務経歴書）の作成指導</h1>
<h2>概要（ポイント）</h2>
<p>全道各所（今年度は7箇所）において、例年9月に開催される「障がい者雇用促進フェア２００７（障害者就職面接会）」に備えて、希望者に対して個別に説明・指導を行う。</p>
<h2>この取組による効果</h2>
<p>企業側から見た作成のポイントを含めて、基本的な事柄から障害の程度・特性を踏まえた説明指導を個別に行うことにより、より具体的に作成できる。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク滝川 職業相談部門</p>
