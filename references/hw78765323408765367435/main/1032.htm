<h1 align="center">求職者情報の活用</h1>
<h2>概要（ポイント）</h2>
<p>雇用指導官等が未達成企業の求人開拓時に持参して、求人者の意向を把握し所に戻り次第、紹介担当に情報を提供、紹介担当は速やかにマッチングを行い、求職者、障害者就業･生活支援センターに連絡をとり紹介するようにしている。</p>
<h2>この取組による効果</h2>
<p>採用意欲のある事業主のハロ－ワークに対する期待に応えることにより、次回の採用にもつながっている。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク草加 草加所</p>
