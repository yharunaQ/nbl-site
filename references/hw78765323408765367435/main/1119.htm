<h1 align="center">ハローワークサービスデーの実施</h1>
<h2>概要（ポイント）</h2>
<p>　当所の管内面積は広大であり、安定所所在地を中心とする庄原地域の他に、東城地域において一つの労働市場圏を形成している。
　上記理由により、地域住民へのサービス向上のため、月１回、市役所支所に職員が出張し、相談、紹介業務を行っている。</p>
<h2>この取組による効果</h2>
<p>交通手段が不便な求職者にとって、定期的な相談の場を設けやすくなっている。
求職者の生活の根拠に近いところで面接することから、求職者の生活面、地域性を把握しやすく、求職者と職員の相互理解、信頼を深める効果がある。</p>
<h2>実施ハローワーク</h2>
<p>広島労働局　ハローワーク庄原 庄原公共職業安定所</p>
