<h1 align="center">上記部会に参加</h1>
<h2>概要（ポイント）</h2>
<p>佐伯市の障害者福祉計画の障害者就労目標数達成に向けた情報交換・共有の会合。年数回実施予定。</p>
<h2>この取組による効果</h2>
<p>佐伯市の取り組みではあるが、構成員は障害者施設をほぼすべて網羅しており就労に向けた個別の問題点等の情報交換ができ、安定所と施設の連携が図られると思う。（11月8日現在準備会1回のみ開催）</p>
<h2>地域連携機関</h2>
<p>自立支援協議会　就労部会（仮称）</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク佐伯</p>
