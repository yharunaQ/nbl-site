<h1 align="center">障害者雇用未達成事業所指導時の事前求人・求職者分析</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用率未達成事業所に対する訪問指導を行う際、指導に併せて、事前に当該事業所の過去の求人状況を分析し、その職種に応募可能な求職者を把握したうえで、事業所に対して具体的な受け入れ要請を行っている。</p>
<h2>この取組による効果</h2>
<p>過去の提出求人等の事前の分析により、当該事業所の応募可能職種、その職種に応募を希望している障害者の求職条件等、単なる雇用率達成のみ指導で終わらず、具体的な障害者専用求人提出を促す等、指導に併せ具体的受け入れ要請が可能となる。</p>
<h2>実施ハローワーク</h2>
<p>沖縄労働局　ハローワーク八重山 職業紹介部門</p>
