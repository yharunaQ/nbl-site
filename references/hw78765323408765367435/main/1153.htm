<h1 align="center">求職者情報の定期的作成・配布</h1>
<h2>概要（ポイント）</h2>
<p>障害者求職者の求職者情報を１ヶ月に１回程度作成し、関係ハローワークに配布するとともに、事業所訪問時にも配布し障害者の職域開発に利用してもらっている。</p>
<h2>この取組による効果</h2>
<p>事業所からのリクエスト求人もあり、また、具体的に事業所の職域開発にあたっての資料として活用されており、マッチングにも資している。</p>
<h2>実施ハローワーク</h2>
<p>新潟労働局　ハローワーク村上 村上所</p>
