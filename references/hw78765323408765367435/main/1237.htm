<h1 align="center">同行紹介の目標件数を設定した取り組み</h1>
<h2>概要（ポイント）</h2>
<p>通常の面接同行、面接会での同行紹介を目標件数の設定により積極的に行う。</p>
<h2>この取組による効果</h2>
<p>同行紹介を行い企業に障害特性の説明ができること、個別障害者の障害理解の促進</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク渋谷 渋谷公共職業安定所</p>
