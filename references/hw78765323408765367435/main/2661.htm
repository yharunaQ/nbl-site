<h1 align="center">定期的に安定所求人情報をＦＡＸにて提供</h1>
<h2>概要（ポイント）</h2>
<p>事業所見学（支援者及び利用者）の設定。
　面接練習の実施。</p>
<h2>この取組による効果</h2>
<p>施設内での日常の指示、支援だけでなく事業所見学やハローワーク会議室を利用しての面接練習が出来、実際の面接時の緊張が少し和らいだ。</p>
<h2>地域連携機関</h2>
<p>アガペセンター、貴志園　他</p>
<h2>実施ハローワーク</h2>
<p>大和公共職業安定所　　就職促進指導官</p>
