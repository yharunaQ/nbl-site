<h1 align="center">求人情報の提供による就労支援</h1>
<h2>概要（ポイント）</h2>
<p>就労移行支援事業者が支援する障害者に適合した求人を受理した場合、仕事内容、条件などを確認し、FAXにより情報提供を行っている。
応募の際には、本人、求人者の状況により、障害者職業センターとの連携による職務施工法・ジョブコーチ支援の活用を図っている。</p>
<h2>この取組による効果</h2>
<p>求人情報が効率よく就労移行支援事業者等に提供されることで、面接希望者が機会を逃すことなく応募ができている。求人情報の提供で、関係機関と日常的な連携が図られている。</p>
<h2>地域連携機関</h2>
<p>就労移行支援事業者、特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>専門援助第二部門</p>
