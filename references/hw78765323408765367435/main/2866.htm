<h1 align="center">自立支援の為の講習や面接の受け方についてアドバイスの実施</h1>
<h2>概要（ポイント）</h2>
<p>精神障害者施設での就労移行支援としての一助として、実施している。</p>
<h2>この取組による効果</h2>
<p>施設独自で就労移行者への自立支援準備の方法として、面接の受け方を実施しているが、安定所側からもロールプレイングを行って効果的な成果をあげている。
なお、講習についても年に数回実施している。</p>
<h2>地域連携機関</h2>
<p>（医）社団あずま会　精神障害者地域生活支援センター　ヒエダ</p>
<h2>実施ハローワーク</h2>
<p>下関公共職業安定所</p>
