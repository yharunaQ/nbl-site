<h2>概要（ポイント）</h2>
<p>手順が煩雑なので、分かり易く図解してみたものです。</p>
<h2>この取組による効果</h2>
<p>手順が煩雑なので、とかくブラックボックス化して担当以外は分からない。担当不在の時には対応出来なかった。フローチャート化することにより担当者以外でも対応可能となった。また、事務引き継ぎにも有効と思われる。</p>
