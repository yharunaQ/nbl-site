<h1 align="center">事業所へ福祉施設の活動の紹介
利用者の一般就労に向けての適性把握・事業所へ職業紹介
</h1>
<h2>概要（ポイント）</h2>
<p>　事業所に福祉施設の活動・訓練内容を紹介する。一般就労希望する利用者の適性把握・障害者職業センターに取り次ぎを行ったうえで職業紹介を行う。</p>
<h2>この取組による効果</h2>
<p>事業主に福祉施設の活動を紹介することにより、障害者への理解促進する。</p>
<h2>地域連携機関</h2>
<p>（社）明清会（社）愛のはぐるま会</p>
<h2>実施ハローワーク</h2>
