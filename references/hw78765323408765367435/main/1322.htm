<h1 align="center">雇用率達成指導</h1>
<h2>概要（ポイント）</h2>
<p>未達成企業を訪問する際は、北海道保健福祉部で作成した障害者雇用の事例と支援のDVD等を活用し、事業主の障害者に対する理解を図り、所独自で作成したリーフレットにより障害者雇用に関する各種援護制度について説明することにより、雇用促進についての指導を行っている。</p>
<h2>この取組による効果</h2>
<p>障害者雇用に対する理解が深まっていくことにより、今後、再訪問等を行うことで雇用に結びついていくと思われる。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク小樽 小樽公共職業安定所</p>
