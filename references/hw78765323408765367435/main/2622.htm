<h1 align="center">事業所への訪問看護</h1>
<h2>概要（ポイント）</h2>
<p>毎週金曜日、通院しているソーシャルワーカーが事業所に訪問して服薬ついてやコミュニケーションについて指導方法について事業主・本人・ソーシャルワーカー・（必要に応じてハローワーク）がケース会議を開催する。</p>
<h2>この取組による効果</h2>
<p>精神疾患について事業主の理解促進をはかる。勤務状況についての把握</p>
<h2>地域連携機関</h2>
<p>群馬県立精神医療センター</p>
<h2>実施ハローワーク</h2>
<p>伊勢崎職業安定所</p>
