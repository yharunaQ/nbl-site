<h1 align="center">求職者登録台帳（所独自パソコン）の作成、活用。</h1>
<h2>概要（ポイント）</h2>
<p>求職者の総合的雇用情報システムへの記載以外の対象者の就職への考え方、特性、関係機関からの情報を所独自パソコンに作成し、相談時等の参考としている。</p>
<h2>この取組による効果</h2>
<p>パソコン台帳の活用により、求職者の特性を認識し、希望求人のマッチング、希望条件の緩和指導に役立たせている。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク島田 ハローワーク島田</p>
