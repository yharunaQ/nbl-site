<title>　障害者職業センターと同じ建物、にあることを、活かし就労の前の段階の職業評価、就職後のジョブコーチの活用、等頻繁に行っている。</title>

<h1 align="center">　障害者職業センターと同じ建物、にあることを、活かし就労の前の段階の職業評価、就職後のジョブコーチの活用、等頻繁に行っている。</h1>
<h2>概要（ポイント）</h2>
<p>障害者職業センターとは、地の利を活かし、何かあることに、頻繁に行き来しお互いに、就労、就職に向け協力している。</p>
<h2>この取組による効果</h2>
<p>　お互いに、緊密な関係を保ち、就労支援、就職に効果を上げている。</p>
<h2>地域連携機関</h2>
<p>千葉障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>千葉南所専門援助部門</p>
