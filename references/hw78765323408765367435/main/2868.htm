<h1 align="center">孤立している障害者を支援機関につなぐ</h1>
<h2>概要（ポイント）</h2>
<p>各支援機関等のパンフレット等をファイルし、特に支援者がついていないが今後支援が必要と思われる障害者に、支援機関のパンフ等のコピーを渡し利用の検討を促進し、利用が必要な場合、連絡を取り合う。</p>
<h2>この取組による効果</h2>
<p>それぞれの支援機関の特色を生かした支援を得て、就労届及び生活面を支えることが出来た。</p>
<h2>地域連携機関</h2>
<p></p>
<h2>実施ハローワーク</h2>
<p>小野田公共職業安定所</p>
