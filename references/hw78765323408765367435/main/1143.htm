<h1 align="center">雇用率未達成企業への働きかけ</h1>
<h2>概要（ポイント）</h2>
<p>企画調整部門職員が、雇用率未達成企業を訪問する際に、専門援助職員も同行し、各種支援制度や、求人開拓の実施、障害者求職情報も提供している。
　（求職者情報は年２回作成している。）</p>
<h2>この取組による効果</h2>
<p>事業所へ求職者情報を提供することにより、求人の提出につながる場合がある。（障害者の雇用に一歩踏み出せない事業所が求職者情報を見ることにより、今まで、一般求人でのみ対応していた求人を障害者求人で出したり、条件緩和して併用求人になる場合がある。）</p>
<h2>実施ハローワーク</h2>
<p>沖縄労働局　ハローワーク那覇 那覇職安</p>
