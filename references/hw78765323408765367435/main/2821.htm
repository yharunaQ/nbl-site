<h1 align="center">ジョブコーチ制度を利用した定着支援</h1>
<h2>概要（ポイント）</h2>
<p>職場内でパニックを起こしてしまう問題（知的・精神重複障害者）を職業センターのジョブコーチ制度活用により早期に解決した。</p>
<h2>この取組による効果</h2>
<p>本人の障害特性の観察、改善を事業所とともに行うことで周囲への障害に対する理解を促した。</p>
<h2>地域連携機関</h2>
<p>職業センター</p>
<h2>実施ハローワーク</h2>
<p>立川公共職業安定所</p>
