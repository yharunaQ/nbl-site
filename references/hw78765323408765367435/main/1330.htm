<h1 align="center">選任担当者制による職業相談の実施</h1>
<h2>概要（ポイント）</h2>
<p>職業相談担当者を固定化して、職業理解や自己分析の支援、履歴書・職務経歴書の記入方法の指導、きめ細かなマッチングや求人の掘り起しなどを行っている。</p>
<h2>この取組による効果</h2>
<p>選任担当者制により、求職者の信頼を得、求職者の隠れたニーズを引き出している。履歴書・職務経歴書の記入方法の指導により求職者自身の能力のたな卸しを行い、並行してマッチングと求人内容の詳細な説明をすることにより、自己理解や職業理解が深まるという効果が認められる。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク浦河 浦河公共職業安定所</p>
