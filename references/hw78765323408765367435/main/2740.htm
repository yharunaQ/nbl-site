<h1 align="center">地域障害者就労支援連絡会議の活用</h1>
<h2>概要（ポイント）</h2>
<p>　年数回開催される連絡会議への参加により、各福祉施設等の実態把握、障害者就業・生活支援センターの視点からみた支援、各特別支援教育機関の抱える問題点等の情報交換をしている。障害者雇用実績のある事業所担当者のほか、保護者も参加していることから、今後のチーム支援への基盤が構築できる。</p>
<h2>この取組による効果</h2>
<p>
　各方面から安定所への情報提供により、求人受理・紹介・就職となったケースあり。
</p>
<h2>地域連携機関</h2>
<p>津軽障害者就業・生活支援センター、
地域各特別支援教育機関、
地域各福祉施設及び就労移行支援事業者
</p>
<h2>実施ハローワーク</h2>
<p>弘前所専門援助部門</p>
