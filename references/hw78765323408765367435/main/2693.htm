<h1 align="center">就労準備ミーティング</h1>
<h2>概要（ポイント）</h2>
<p>ほおずきが主催する就労準備ミーティングに講師として参加し、就労希望者に、求職登録、安定所の利用方法、各種援助制度について説明。</p>
<h2>この取組による効果</h2>
<p>施設の状況及び利用者の状況を把握することができ、その後の相談や連携がスムーズに行える。</p>
<h2>地域連携機関</h2>
<p>精神障害者社会復帰施設　ほおずき</p>
<h2>実施ハローワーク</h2>
<p>職業相談第２部門</p>
