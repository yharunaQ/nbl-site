<h1 align="center">障害者雇用実態アンケートの実施</h1>
<h2>概要（ポイント）</h2>
<p>管内事業所に対して今後の障害者雇用や職場実習の受入れについてのアンケートを実施し、障害者求人や学校生徒の実習受入れ先の確保に努めている。（年1回実施）</p>
<h2>この取組による効果</h2>
<p>障害者求人開拓に利用している。
実習受入れ事業所情報を学校に送付することから生徒の実習先開拓に役立てている。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク千葉南 千葉南所専門援助部</p>
