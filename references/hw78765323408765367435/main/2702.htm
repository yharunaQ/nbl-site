<h1 align="center">職場見学等への同行</h1>
<h2>概要（ポイント）</h2>
<p>担当において求人開拓等を行い、事業所見学をする際に、福祉施設の担当者にも同行の案内を行う。</p>
<h2>この取組による効果</h2>
<p>実際に職場見学することで、施設利用者の就労移行を進めるうえで、効果的である。
また、就労移行支援の経験が少ない福祉施設担当者にはよい意識啓発となっている。</p>
<h2>地域連携機関</h2>
<p>福祉施設</p>
<h2>実施ハローワーク</h2>
<p>西条公共職業安定所</p>
