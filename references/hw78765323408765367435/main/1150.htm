<h1 align="center">障害者合同面接会の開催</h1>
<h2>概要（ポイント）</h2>
<p>就職を希望する障害者と障害者の雇用を考えている事業所が一同に会し、個別面接を実施する。
面接会実施にあたっては、事前に参加者の情報も提供し、事業主側からのリクエストも可能としている。</p>
<h2>この取組による効果</h2>
<p>面接会を実施すること周知することにより、障害者に対しては就職意欲の喚起が可能。また、実際に複数事業所の面接がその場で受けられるため就職機会を創出できる。一方、事業所側には多くの人の中から適格者を採用できる。</p>
<h2>実施ハローワーク</h2>
<p>鳥取労働局　ハローワーク倉吉 ハローワーク倉吉</p>
