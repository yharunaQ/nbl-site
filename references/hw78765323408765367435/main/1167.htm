<h1 align="center">・担当者による継続相談

</h1>
<h2>概要（ポイント）</h2>
<p>・自己判断が難しい求職者に対し、同一人による継続相談を行う。</p>
<h2>この取組による効果</h2>
<p>・一貫した相談の実施により就労希望の事業所の選択が出来た。また、履歴書の書き方も指導し、面接が成功した。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク松戸 松戸所専門援助部門</p>
