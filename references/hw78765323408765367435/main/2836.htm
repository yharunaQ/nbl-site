<title>昨年度より「紀南地域障害福祉計画策定委員会」の協議を踏まえ、今年度から「紀南地域自立支援協議会」が設置され、協議会委員として会議出席</title>

<h1 align="center">昨年度より「紀南地域障害福祉計画策定委員会」の協議を踏まえ、今年度から「紀南地域自立支援協議会」が設置され、協議会委員として会議出席</h1>
<h2>概要（ポイント）</h2>
<p>熊野市、御浜町、紀宝町を始め、福祉施設、保健・医療機関、相談事業者、教育（特別支援学校）、雇用関係者（ハローワーク）、障害者関係団体等が委員として組織し、地域の障害福祉に関するシステム作りに関し、中核的な役割を果たすため定期的な協議会を行う。
ハローワークにおいては、一般就労に向けた就労支援についてサポートを行う。</p>
<h2>この取組による効果</h2>
<p></p>
<h2>地域連携機関</h2>
<p>紀南地域自立支援協議会</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク熊野</p>
