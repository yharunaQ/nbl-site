<h1 align="center">
継続的な求職相談を行うため、一部窓口相談を担当者制にしている。
</h1>
<h2>概要（ポイント）</h2>
<p>　一部の求職者に対し、相談する担当者を１名決め、その担当者が求職申込から就職まで一貫して対応する。</p>
<h2>この取組による効果</h2>
<p>　求職者の相談を１名の担当者が行うことで、求職者に関する情報を一貫して把握することができ、担当者が代わることによる同じ話しを繰り返すことが無くなり、また、求職者もいつも同じ人が対応してくれることで安心感が生まれ、その結果、効果的な相談や、相談し易い環境を確保することができるようになった。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク市川 市川所専門援助部門</p>
