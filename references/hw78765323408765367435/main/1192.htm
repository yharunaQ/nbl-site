<h1 align="center">障害を持った方が応募しやすい求人の収集</h1>
<h2>概要（ポイント）</h2>
<p>知的・精神障害を持った方の働きやすい職種は、単純作業・軽作業とされる場合が多いです。障害者専用求人は数が限られています。そこで、一般求人の中から単純作業、軽作業の求人を予め、拾い出しておいて職業相談に活用する。</p>
<h2>この取組による効果</h2>
<p>総合的雇用情報システムの端末は事業所・専門援助部門に１台しかなく、待って使用することもあります。予め、拾い出しておいた求人で紹介相談する。また、求人・求職のマッチングにも活用できる。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク清水 事業所・専門援助部門</p>
