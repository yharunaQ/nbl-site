<h1 align="center">職員・相談員が地域の福祉施設関係機関を訪問</h1>
<h2>概要（ポイント）</h2>
<p>地域の福祉施設関係機関には地域支援担当者と統括（上席）で訪問し状況把握を行っている。その中で、一般就労に移行できる利用者がいる施設については、職員・相談員が作業・昼食等を共にし、施設・障害者についての理解を深める。</p>
<h2>この取組による効果</h2>
<p>一般就労に移行する人を含めた利用者と作業等を共にすることにより、障害者を少しでも理解し、今後の職業相談・紹介に役立てる。</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク渋谷 渋谷公共職業安定所</p>
