<h1 align="center">　
毎月1回「三機関会議」をハローワークにて行っている。
</h1>
<h2>概要（ポイント）</h2>
<p>　三機関（ハローワーク、中部地区就業・生活支援センター、障害者職業センター）連絡会議を原則月1回開催し、情報交換や必要に応じ個別の求職者に関する就労支援についての協議等を行っている。</p>
<h2>この取組による効果</h2>
<p>　
・ 問題の共有化を図ることができ、早めの対応が可能である。（就労中に不適合をおこした場合等）
・ 個々の障害者の支援を図る為の緊密な連携体制ができる。
</p>
<h2>地域連携機関</h2>
<p>・中部地区障害者就業・生活支援センター
・沖縄障害者職業センター
</p>
<h2>実施ハローワーク</h2>
<p>沖縄所</p>
