<h1 align="center">地域の医療機関との連携</h1>
<h2>概要（ポイント）</h2>
<p>・本人同意のうえで、医療期間をはじめとした関係機関との情報交換
・面接時、クリニック担当カウンセラーの同行</p>
<h2>この取組による効果</h2>
<p>・求職者の状態を的確に把握できる
・求人者の不安材料を、担当カウンセラーの説明により解消
・求職者本人が緊張せず、面接を受けることができる</p>
<h2>地域連携機関</h2>
<p>西尾市内のクリニック</p>
<h2>実施ハローワーク</h2>
<p>西尾公共職業安定所</p>
