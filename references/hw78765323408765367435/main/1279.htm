<h1 align="center">障害者雇用率達成指導に係る企業への情報提供について</h1>
<h2>概要（ポイント）</h2>
<p>企業訪問には数種類のパンフレット及び求職者情報を持参している。
この全部を企業に渡すことはなく、障害者雇用について聞き取る中で、必要な情報のみを抽出し、内容の説明を加え、渡すようにしている。
求職者情報についてもマッチングが難しいと思われる情報はあえて提供していない。</p>
<h2>この取組による効果</h2>
<p>企業にとって必要となる情報を即座に提供することにより、課題の解決を図り、以降の取り組みをより円滑に進めることができると思う。</p>
<h2>実施ハローワーク</h2>
<p>愛知労働局　ハローワーク豊川 </p>
