<h1 align="center">懇談会
直接、求職者に会って頂き、新たな就業の場を創出。
一つの事業を行うときに、その機会を生かし、障害者の方々の実習見学・就労支援・助成金制度など障害者雇用をトータル的に推進。
</h1>
<h2>概要（ポイント）</h2>
<p>求人に応募して面接する場合、求人の仕事ができる方しか面接できない、求職者本人を見て頂き、障害者の方が活躍できる職域を企業の努力により捻出していただく。
事業主には求職者のニーズにあった仕事の創出。
求職者には自己ＰＲ。
</p>
<h2>この取組による効果</h2>
<p>求職者　意識の向上
事業主　障害者のイメージの改善
結果は別紙
</p>
<h2>実施ハローワーク</h2>
<p>兵庫労働局　ハローワーク姫路 姫路公共職業安定所</p>
</body><html>
