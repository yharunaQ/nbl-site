<h1 align="center">障害者雇用にかかる各種支援制度をまとめたリーフレットの作成</h1>
<h2>概要（ポイント）</h2>
<p>　障害者本人や事業主が各種支援制度を体系的に理解できるようリーフレットを作成している。内容は各支援制度の概要とその活用順序や組み合わせが分かるフローチャート形式としている。求職受理時の本人への説明、事業所へ障害者雇用を依頼する際等に活用している。</p>
<h2>この取組による効果</h2>
<p>　各種支援制度の内容とそのメリットが容易に理解してもらえることによって、支援制度の効率的な活用が図れる。</p>
<h2>実施ハローワーク</h2>
<p>島根労働局　ハローワーク雲南 雲南公共職業安定所</p>
