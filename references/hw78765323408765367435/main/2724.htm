<h1 align="center">福祉施設が実施する研修会へ講師として出席</h1>
<h2>概要（ポイント）</h2>
<p>　福祉施設が実施する研修会に講師として出席し、管内状況、安定所の利用方法、各種援助制度、就職について（企業が求めている人、職場見学・実習、面接、就職、困ったときの相談、障害者の就職状況）、履歴書の書き方、面接の受け方、マナー・言葉遣い等について説明を行った。</p>
<h2>この取組による効果</h2>
<p>　一般就労に向けて、具体的な準備について説明することにより、就職に対する心構えを促すことができた。
　研修会の後、求職登録された方もいた。</p>
<h2>地域連携機関</h2>
<p>ゆうハート安芸、安芸市ワークセンター（各福祉施設）</p>
<h2>実施ハローワーク</h2>
<p>安芸所</p>
