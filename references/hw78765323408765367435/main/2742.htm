<h1 align="center">障害者求人情報の定期的な送付</h1>
<h2>概要（ポイント）</h2>
<p>障害者求人や一般求人（障害者が応募できるであろうと思われる求人）を定期的に送付している</p>
<h2>この取組による効果</h2>
<p>就労移行支援事業者や学校に求人情報の提供を行うことにより、利用者や生徒の就労支援の１つとして役に立っている</p>
<h2>地域連携機関</h2>
<p>就労移行支援事業者及び特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>千葉南所専門援助部門</p>
