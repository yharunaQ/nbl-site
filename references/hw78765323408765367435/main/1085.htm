<h1 align="center">精神障害者の職場適応指導</h1>
<h2>概要（ポイント）</h2>
<p>精神障害者を紹介就職により複数雇用している事業所について、雇用主の要望もあり、障害者専門支援員に月１回定期的に訪問してもらい、障害者との個別定着指導や、雇用主との雇用管理相談を受けている。</p>
<h2>この取組による効果</h2>
<p>定期的に訪問することで、問題が生じる前に解決でき、定着につながっている。また、雇用主との信頼関係もできると同時に精神障害者の理解がすすみ、欠員補充等の際には声をかけてもらえるなど、精神障害者の複数雇用につながった。</p>
<h2>実施ハローワーク</h2>
<p>大阪労働局　ハローワーク門真 専門援助部門</p>
