<h1 align="center">福祉施設のハローワーク見学及び講習。</h1>
<h2>概要（ポイント）</h2>
<p>施設へ通所しているが、将来就職を考えている者に、ハローワークの見学と、就労するにあたっての注意事項等の講習をする。</p>
<h2>この取組による効果</h2>
<p>就職を希望しているが、どのように活動したらよいか、今一歩踏み出せない、あるいは、障害等いろいろ不安がある者に、アドバイス・励まし等を与えることによって、就労にちかづける効果がある。</p>
