<h1 align="center">生徒、保護者を含めた職業相談の実施</h1>
<h2>概要（ポイント）</h2>
<p>管外の特別支援学校卒業者で、当所管内事業所への就職希望者等について、高校3年の夏休みに本人、保護者、先生、ハローワーク職員とで四者面談を行っている。
卒業後の希望等についての情報を共有し、四者面談以降の情報交換等へ活用している。</p>
<h2>この取組による効果</h2>
<p>特別支援学校卒業予定者の情報について、関係機関で共有できていると思われる。</p>
<h2>地域連携機関</h2>
<p>青森県立第二高等養護学校</p>
<h2>実施ハローワーク</h2>
<p>三沢公共職業安定所十和田出張所</p>
