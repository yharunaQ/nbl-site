<h1 align="center">障害別の特徴・雇用上の注意点をまとめた資料の作成・配付</h1>
<h2>概要（ポイント）</h2>
<p>上記内容の資料「障害別にみた特徴・雇用上の注意点等」（別添参照）を作成し、（社）北海道高齢・障害者雇用促進協会と共催した「障害者雇用実践講習」にて参加企業に配付、内容説明。
また、職員研修（所内）等に活用</p>
<h2>この取組による効果</h2>
<p>過去に障害者の雇用実績がない事業主や、障害種を限定する傾向の事業主に対して、より幅広く採用を検討するための足がかかりとして活用。（同種のパンフレットがなかったため自作）</p>
