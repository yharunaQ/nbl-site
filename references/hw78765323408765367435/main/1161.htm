<h1 align="center">面接会におけるマッチング</h1>
<h2>概要（ポイント）</h2>
<p>　参加求人一覧表を送付後、参加予定者全員に電話をし、求人内容の詳しい説明とともに来所しての事前相談を実施　</p>
<h2>この取組による効果</h2>
<p>　求人者の意向や勤務時間等の相談の可否などの情報提供により、求職者の不安の解消と積極的な応募の喚起につながった。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク銚子 銚子所求人・特別援助部門</p>
