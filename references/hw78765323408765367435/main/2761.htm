<h1 align="center">地域自立支援協議会への参加</h1>
<h2>概要（ポイント）</h2>
<p>管内の市町村の呼びかけで「地域自立支援協議会」が設立。障害者の一般就労支援を目的とする「しごと部会」に参加。</p>
<h2>この取組による効果</h2>
<p>　「しごと部会」には、「就業・生活支援センター」地域の「就労移行支援事業者」「特別支援学校」「市町村役場・福祉課」が参加しており、相互で情報を交換し共有できるようになった。</p>
<h2>地域連携機関</h2>
<p>管内の福祉施設
　　長野圏域障害者就業・生活支援センター
　　地方自治体、特別支援学校
</p>
<h2>実施ハローワーク</h2>
<p>須坂所　職業相談部門</p>
