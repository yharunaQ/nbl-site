<h1 align="center">ネットワーク会議の開催</h1>
<h2>概要（ポイント）</h2>
<p>管内の各福祉施設、特別支援学校と連携を図るため、月1回開催をしている。
顔が見える関係作りを目的として、直接の担当者との話し合いを行っている。現在起こっている問題等を話し合い、様々な視点から検討していく。</p>
<h2>この取組による効果</h2>
<p>何かあれば、直ぐに連携が取れるようになっており問題点について共有ができ、問題解決の一助となっている。</p>
<h2>地域連携機関</h2>
<p>ハローワーク浜松</p>
