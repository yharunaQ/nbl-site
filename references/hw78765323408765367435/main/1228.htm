<h1 align="center">毎朝の前日受理求人のチェック</h1>
<h2>概要（ポイント）</h2>
<p>毎朝、前日受理した分の求人票を紹介窓口職員で回覧しているので、その中で適格と思われる求人については、ＤＭ送付、呼び出し相談を実施している。</p>
<h2>この取組による効果</h2>
<p>求人を受理してから早い時期に情報提供することで、検討する時間的余裕ができる。
募集人数の少ない求人等の場合は、応募のタイミングを逃さないためにも有効と思われる。
</p>
<h2>実施ハローワーク</h2>
<p>宮城労働局　ハローワーク迫 求人専門援助部門</p>
