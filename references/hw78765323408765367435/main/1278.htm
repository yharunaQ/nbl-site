<h1 align="center">・面接時のハローワーク職員、障害者職業センター職員の同行
・事業所に対する支援メニューの情報共有</h1>
<h2>概要（ポイント）</h2>
<p>・安定所職員同行による面接の実施
・他機関を含めた支援メニューの情報提供</p>
<h2>この取組による効果</h2>
<p>・求職者のフォロー
・求人者の不安材料に対し、情報提供をすることで、検討への後押しを図る</p>
<h2>実施ハローワーク</h2>
<p>愛知労働局　ハローワーク西尾 西尾公共職業安定所</p>
