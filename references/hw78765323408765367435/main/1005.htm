<h1 align="center">聴覚障害者の就職後の定着指導について</h1>
<h2>概要（ポイント）</h2>
<p>トラブルが起きた場合に、会社から連絡をもらい、手話協力員（安定所・振興局配置）の協力のもと、障害者職業センターのジョブコーチとも連携を図りながら、就職後も相談を行っている。</p>
<h2>この取組による効果</h2>
<p>聴覚障害の方は、コミュニケーションの面で不安があるため、お互いの意思を正確に伝えるのには効果的であると思う。
　定期的に訪問することにより、本人も仕事上の不安等を話す場ができて精神的にも楽になると思われる。</p>
<h2>実施ハローワーク</h2>
<p>岩手労働局　ハローワーク釜石 釜石公共職業安定所</p>
