<h1 align="center">就職が特に困難な求職者に対する個別求人開拓</h1>
<h2>概要（ポイント）</h2>
<p>特に就職が困難な求職者は、応募をしてもマッチングが困難な場合が多い。その為そういった求職者の状況について事前に充分障害の特徴や希望等を把握し個別に求人開拓を実施している。</p>
<h2>この取組による効果</h2>
<p>事前に本人の特徴を充分把握しているのでマッチングしやすく、また本人にとっても効果的な活動が期待できる。ただし求人探しはなかなかすぐにはうまくいかず、ある程度長期的な活動を余儀なくされる。</p>
<h2>実施ハローワーク</h2>
<p>大阪労働局　ハローワーク梅田 専門援助部門</p>
