<h1 align="center">特別支援教育機関との連絡会議への参加等</h1>
<h2>概要（ポイント）</h2>
<p>福岡高等学園については、「特別支援学校就業促進地域ネットワーク会議」「特別支援教育フェア」等への参加や、「学校評議員」として職業安定機関の意見等を伝えている。</p>
<h2>この取組による効果</h2>
<p>卒業予定者について、卒業前から就職支援を行なえるよう連携を図ることができる。</p>
<h2>地域連携機関</h2>
<p>福岡高等学園・福岡高等盲学校</p>
<h2>実施ハローワーク</h2>
<p>福岡南所</p>
