<h1 align="center">求職者本人に対する支援及び情報提供</h1>
<h2>概要（ポイント）</h2>
<p>求人部門から、毎日回覧される求人票の中から、保険受給者及び、一般の求職者でハローワークに来所の頻度の高い求職者（顔と名前が一致する範囲で）に対してマッチングしそうな求人票のコピーをとり、各人のファイルに入れておいて、認定日等の来所時に情報を提供する</p>
<h2>この取組による効果</h2>
<p>来所時にマッチングする求人票を見つけ易くし、また、求職者とハローワークとの信頼関係も構築できる。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク函館 ハローワーク函館</p>
