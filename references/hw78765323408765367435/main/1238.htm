<h1 align="center">雇用研究会、バス見学会</h1>
<h2>概要（ポイント）</h2>
<p>雇用率未達成企業を対象にした雇用研究会（障害者施設を見学、関係者から講義）、バス見学会（特例子会社、養護学校を見学）の開催。</p>
<h2>この取組による効果</h2>
<p>雇用研究会、バス見学会に参加することにより、働いている、作業している障害者、また養護学校生と会い一緒に給食をとること、障害者と接している方からの話を聞くことで、障害についての理解が深まり、職域の開拓から雇用促進に役立つ。</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク渋谷 渋谷公共職業安定所</p>
