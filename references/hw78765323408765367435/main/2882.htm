<h1 align="center">地域の福祉施設との確実な連絡体制による短期委託訓練の実施</h1>
<h2>概要（ポイント）</h2>
<p>対象者の能力に応じ、段階的に福祉作業所での訓練を行う場合において、福祉施設法人にジョブコーチが配置されていることから、課題の認識や今後の指導方針を明確にする事ができる。</p>
<h2>この取組による効果</h2>
<p>短期課程訓練（3ヶ月）→職場実習（5日間）→トライアル雇用（3ヶ月）→常用雇用へ移行した。
短期課程の訓練開始時点において、一人のジョブコーチが支援することにより早く雇用に結びつける事ができた。</p>
<h2>地域連携機関</h2>
<p>奈良障害者職業センター
社会福祉法人　せせらぎ会　御所園</p>
<h2>実施ハローワーク</h2>
<p>大和高田公共職業安定所</p>
