<h1 align="center">職場実習・職場見学にかかる企業情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>　特別支援学校等打合せ会議において、職場実習等の受け入れに係る事業所一覧を配布し、学校（生徒）と企業のマッチングに努めるとともに、学校等に対して、必要な支援を行っている。
　船橋市特別支援・特別支援学級進路対策委員会に出席し、就労支援策にかかる情報提供を行っている。</p>
<h2>この取組による効果</h2>
<p>受け入れ事業所数が少なく、今のところ、効果的な活用までには至っていない。
各種会議における情報交換等により、生徒の進路指導には役立っている。</p>
<h2>地域連携機関</h2>
<p>特別支援学校・特別支援学級</p>
<h2>実施ハローワーク</h2>
<p>船橋所専門援助部門</p>
