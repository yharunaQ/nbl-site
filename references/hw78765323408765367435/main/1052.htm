<h1 align="center">一般求人への障害者の紹介</h1>
<h2>概要（ポイント）</h2>
<p>障害者の希望する職種において、一般求人も含め検索し、対象求職者の障害の特性、本人の持つスキル等を事業主に説明し、場合により、事前の職場見学を行い、紹介を行う。　</p>
<h2>この取組による効果</h2>
<p>障害者専用求人では、該当職種が少ない場合が多く、事業主の理解が得られれば、幅広く就職に結びつく効果がある。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク平塚 平塚公共職業安定所　　専門援助部門</p>
