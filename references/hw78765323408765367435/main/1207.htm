<h1 align="center">雇用率達成指導との連携による求職者選定、紹介</h1>
<h2>概要（ポイント）</h2>
<p>雇用率未達成事業所を雇用指導官等により事業所訪問をした結果作成された「企業情報一覧」を基に１障害者就職相談会参加勧奨及び求人票提出依頼（雇用指導官）２相談会後未充足求人に対し求職者の選定、紹介を行う（障害者担当）</p>
<h2>この取組による効果</h2>
<p>所独様式の「企業情報一覧」を作成することにより、障害者雇用の期待度（接触した時の感触）が明確になり、効率的なマッチング、紹介ができている。</p>
<h2>実施ハローワーク</h2>
<p>佐賀労働局　ハローワーク鳥栖 鳥栖公共職業安定所</p>
