<h1 align="center">面接の際の連携について</h1>
<h2>概要（ポイント）</h2>
<p>求人事業所側の希望により、本人が面接に行く前に、事前に求職者の障がい登録状況などを把握し面接の際には同行し、求人事業所に対しスムーズな面接を行えるような体制をとる。</p>
<h2>この取組による効果</h2>
<p>同行することにより、求職者の不安も和らげる。</p>
<h2>地域連携機関</h2>
<p>北海道障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>苫小牧公共職業安定所</p>
