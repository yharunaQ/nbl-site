<h1 align="center">障害者就業・生活支援センターとの障害者並びに事業主への支援についての連携</h1>
<h2>概要（ポイント）</h2>
<p>求職未登録障害者の障害者登録における連携。
障害者就業・生活支援センターと障害者と同行面接。
事業主支援における障害者就業・生活支援センターとの同行訪問。
職場定着への相互努力。</p>
<h2>この取組による効果</h2>
<p>障害者の適性等の情報を共有化。
障害特性に対する企業の理解。
企業に対する職域開発並びに各種助成金の周知・理解。
ジョブコーチ支援等の職場定着にむけての連携。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク小田原 小田原公共職業安定所　専門援助部門</p>
