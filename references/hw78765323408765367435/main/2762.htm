<h1 align="center">ハローワーク見学</h1>
<h2>概要（ポイント）</h2>
<p>諏訪養護学校が行う「２年生校外学習」の日程の中でハローワーク見学が組み込まれており、ハローワークの業務内容・利用方法、良くある相談事例、自己検索パソコンの使用方法等の説明を行う。</p>
<h2>この取組による効果</h2>
<p>養護学校生に進路学習の一環として、将来就職で困ったことがあったときに相談できる場所であることを理解していただくとともに、一度ハローワークを訪問することにより、なにか仕事で問題があったときにハローワークが解決のお手伝いをできることを理解してもらえていると思われる</p>
<h2>地域連携機関</h2>
<p>諏訪養護学校</p>
<h2>実施ハローワーク</h2>
<p>諏訪公共職業安定所</p>
