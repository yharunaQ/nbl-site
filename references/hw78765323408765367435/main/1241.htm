<h1 align="center">① 求人情報の提供
③ 障害者のための窓口利用ガイド作成
</h1>
<h2>概要（ポイント）</h2>
<p>①・　各区の就労支援機関へミニ面接会等の求人情報の提供
・ 窓口の待合いコーナーに「車イス可」や「電話応対考慮」が明記された求人について別綴ファイルを作成し情報提供している。
③　障害者のための利用ガイド作成中。
</p>
<h2>この取組による効果</h2>
<p>① 各区の支援機関を通じてのミニ面接会への参加や紹介につながっている。


③　福祉施設との連携を進めていくうえでも有効と考えている。
</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク池袋 池袋公共職業安定所</p>
