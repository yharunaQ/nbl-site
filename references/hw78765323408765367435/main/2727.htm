<h1 align="center">養護学校との連携によるハローワークの見学会</h1>
<h2>概要（ポイント）</h2>
<p>中等部の生徒を対象としたハローワークの見学会を行い、求人票の見方（検索機使用）、ハローワークの仕事を理解してもらう。</p>
<h2>この取組による効果</h2>
<p>「就職する」ということを、早期に意識させる効果がある。</p>
<h2>地域連携機関</h2>
<p>県立平塚養護学校</p>
<h2>実施ハローワーク</h2>
<p>平塚公共職業安定所　　専門援助部門</p>
