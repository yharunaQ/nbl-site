<h1 align="center">専門相談窓口によるサービス内容の説明用リーフレットの活用</h1>
<h2>概要（ポイント）</h2>
<p>専門相談窓口を始めて利用する求職者に仕事の探し方や支援制度などの説明に活用する。また、一般窓口から専門窓口に誘導する場合に、専門相談のメリット等を説明するために活用する。</p>
<h2>この取組による効果</h2>
<p>　リーフレットによる説明で、説明漏れがなくなる。異なる職員の説明でも均一的な説明ができる。</p>
