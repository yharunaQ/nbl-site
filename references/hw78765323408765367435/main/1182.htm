<h1 align="center">障害者雇用推進セミナーの実施</h1>
<h2>概要（ポイント）</h2>
<p>雇用指導官が中心となり雇用率未達成企業に対し、飯山養護学校高等部職場実習の見学、飯山養護学校進路指導主事の講演及び地域で就労支援を行っているジョブコーチの講演を行った。</p>
<h2>この取組による効果</h2>
<p>未達成企業の採用担当者に養護学校の生徒の状況を実際に見てもらい、また、ジョブコーチの存在を知っていただくことにより、障害者雇用に対する理解が深まり、その後の障害者専用求人提出につながった。</p>
<h2>実施ハローワーク</h2>
<p>長野労働局　ハローワーク飯山 飯山公共職業安定所</p>
