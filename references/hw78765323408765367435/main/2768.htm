<h1 align="center">求人情報のFAXでの提供</h1>
<h2>概要（ポイント）</h2>
<p>管内の各福祉施設、特別支援学校と連携及び就職促進を図るため、毎日受理した一般求人の中で就労が可能そうである軽作業をピックアップし一覧表にて、随時情報を提供している。</p>
<h2>この取組による効果</h2>
<p>その情報を基に就労支援施設経由で、そこの利用者に提供しハローワーク経由で紹介就職につなげている。障害者の掘り起こしの一助にもなっている。</p>
<h2>地域連携機関</h2>
<p>ハローワーク浜松</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク浜松</p>
