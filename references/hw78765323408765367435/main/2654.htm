<h1 align="center">茅ヶ崎障害者出張相談</h1>
<h2>概要（ポイント）</h2>
<p>月１回、出張し、茅ヶ崎市勤労市民会館において障害者の職業相談・職業紹介業務を行っている。</p>
<h2>この取組による効果</h2>
<p>あまり藤沢まで足を運ばない茅ヶ崎市の障害者の求職又は支援のニーズの把握が出来た。安定所（専門援助部門）の利用の説明が出来た。</p>
<h2>地域連携機関</h2>
<p>茅ヶ崎市障害福祉課</p>
<h2>実施ハローワーク</h2>
<p>藤沢公共職業安定所　専門援助部門　</p>
