<h1 align="center">「チャレンジコース」対象者への職業講和（説明と質疑）</h1>
<h2>概要（ポイント）</h2>
<p>名古屋市精神保健福祉センターで行っている「チャレンジコース」対象者に安定所に来てもらって安定所での利用する際の留意事項を説明し質疑をしている（2時間）</p>
<h2>この取組による効果</h2>
<p>ハローワークが行っている「精神障害者ジョブガイダンス事業」と同じ効果。（すぐに就職でなく安定所で利用するときに心の準備ができる）</p>
<h2>地域連携機関</h2>
<p>名古屋市精神保健福祉センター</p>
<h2>実施ハローワーク</h2>
<p>専門援助第三部門</p>
