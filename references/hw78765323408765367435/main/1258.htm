<h1 align="center">面接に対する事前準備</h1>
<h2>概要（ポイント）</h2>
<p>知的・精神障害者を対象として、面接同行を希望しない者等に面接前に必要な確認事項を説明する資料として作成。（ひな型有）</p>
<h2>この取組による効果</h2>
<p>面接時におけるすべての状況に対応できるわけではないが、面接に向けた対策を行うことで、面接に望む緊張感の緩和が期待できる。</p>
