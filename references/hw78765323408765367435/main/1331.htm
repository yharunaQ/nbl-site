<h1 align="center">職員及び相談員への、障害者の求職登録・職業相談・職業紹介のポイント、好事例、制度等に関する研修</h1>
<h2>概要（ポイント）</h2>
<p>障害者の求職登録・職業相談・職業紹介における進め方・ポイントについて説明。また就職につながった事例について説明。
障害者の雇用に関わる助成金制度・訓練について説明。</p>
<h2>この取組による効果</h2>
<p>障害者雇用に向けた職業相談・紹介技法、助成金制度について意識を統一できたこと。
また、一般の職業相談・紹介の参考となったこと。</p>
