<h1 align="center">
雇用指導部門と紹介部門の連携による求職者情報の提供
</h1>
<h2>概要（ポイント）</h2>
<p>雇用指導官等が、雇用率未達成企業の雇用指導の時に障害者担当官がシステムを活用し、求職者情報（最近2～3ヶ月前の求職申込のもの）を作成し事業所に情報提供している。</p>
<h2>この取組による効果</h2>
<p>事業主に対し、障害者の多様性の具体的な事例として求職者情報を紹介することで、事業主の障害者雇用への理解への一助となっている。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク木更津 木更津所求人・特別援助部門</p>
