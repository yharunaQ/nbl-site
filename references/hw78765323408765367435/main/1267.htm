<h1 align="center">リクエスト求人（雇用率未達成事業所分）の作成</h1>
<h2>概要（ポイント）</h2>
<p>雇用率未達成事業所へ、雇用指導官等が指導した際、後日求人の提出がある
その際、リクエスト求人を作成する</p>
<h2>この取組による効果</h2>
<p>応募者が少ない場合は、会社に状況（求職者）を説明し、求人条件の緩和や、職域開発の提案をし、よりマッチングしやすい状況をつくる</p>
<h2>実施ハローワーク</h2>
<p>三重労働局　ハローワーク津 津公共職業安定所</p>
