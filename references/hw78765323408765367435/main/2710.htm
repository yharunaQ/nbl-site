<title>事業所に対して「東広島市障害者雇用奨励金制度」(パンフレット）を周知させて、障害者雇用を促進している。</title>
</head><body>
<h1 align="center">事業所に対して「東広島市障害者雇用奨励金制度」(パンフレット）を周知させて、障害者雇用を促進している。</h1>
<h2>概要（ポイント）</h2>
<p>東広島市の事業所が東広島市民である障害者を雇用した場合に支給される制度。</p>
<h2>この取組による効果</h2>
<p>①　特定求職者京開発助成金と併せて、事業主には財政的な支援が可能となっている。
②　特定求職者京開発助成金の支給対象とならない場合（安定所紹介以外の採用）でも、当該奨励金が支給対象となれば、事業主に対する負担軽減が図られている。
</p>
<h2>地域連携機関</h2>
<p>東広島市（産業振興課）</p>
<h2>実施ハローワーク</h2>
<p>広島西条公共職業安定所</p>
</body><html>
