<title>障害者紹介担当者と雇用指導官とが連携し、雇用率達成指導と同行紹介
を同時に実施。
</title>

<h1 align="center">障害者紹介担当者と雇用指導官とが連携し、雇用率達成指導と同行紹介
を同時に実施。
</h1>
<h2>概要（ポイント）</h2>
<p>求職者情報やハローワーク職員の説明等の指導では障害者雇用の取り組みが進まない企業に対し、雇用率達成指導の際に障害者を同行する。
（ポイント）
障害者と面談することにより、職域開発の具体化に向けて事業主への意識付けを図る。</p>
<h2>この取組による効果</h2>
<p>障害者自身から障害の状況、職務経験等を伝えることにより、事業主の持つ障害者に対する固定観念や先入観を無くし、当該障害者を念頭においての職域開発が可能になる。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク焼津 求人専門援助部門</p>
