<h1 align="center">地域障害者職業センターとの連携</h1>
<h2>概要（ポイント）</h2>
<p>紹介職種等に合わせた、職業準備支援の依頼。</p>
<h2>この取組による効果</h2>
<p>知的障害者の職業紹介にあたり、本人の障害特性に合わせた未経験職種への適応を踏まえた準備支援の実施。
　ジョブコーチ支援への移行。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク静岡 静岡公共職業安定所</p>
