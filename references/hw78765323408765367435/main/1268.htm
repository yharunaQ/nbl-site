<h1 align="center">障害者求職情報の積極的活用</h1>
<h2>概要（ポイント）</h2>
<p>月1回作成している情報を、障害者セミナー、雇用指導官の高齢者指導並びに学卒係の事業所訪問時や、求人受理の際の労働市場説明時に渡し、また毎月管内官公庁や未達成事業所に郵送している。</p>
<h2>この取組による効果</h2>
<p>情報には障害者名以外、可能な限りの内容（希望職種・免許・職務経歴等）を記入することにより、会社側に対して本人の能力・経験に応じた職種を幅広く検討してもらうことができるなだ、マッチングの増加につながっている。</p>
<h2>実施ハローワーク</h2>
<p>三重労働局　ハローワーク松阪 ハローワーク松阪</p>
