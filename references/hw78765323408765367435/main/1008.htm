<h1 align="center">相談に適した来所時間の周知</h1>
<h2>概要（ポイント）</h2>
<p>相談の中で失業認定や説明会の日時を説明し、次回以降来所した際、相談に適した時間帯に来所するようにお願いする。</p>
<h2>この取組による効果</h2>
<p>忙しい時間を避けることで、互いに気持ちにゆとりを持ちながら、相談できると思っている。</p>
<h2>実施ハローワーク</h2>
<p>岩手労働局　ハローワーク千　厩 千厩出張所</p>
