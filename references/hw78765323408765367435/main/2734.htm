<h1 align="center">　
職業自立地域推進協議会の委員となっている。
</h1>
<h2>概要（ポイント）</h2>
<p>　管内特別支援学校のうちの2校（沖縄高等養護学校・美咲養護学校）の障害児職業自立推進協議会の委員として学校の開催する会議へ参加。</p>
<h2>この取組による効果</h2>
<p>　特別支援学校との連携を強化し、職業自立に向けての体制作りを図る。</p>
<h2>地域連携機関</h2>
<p>特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>沖縄所</p>
