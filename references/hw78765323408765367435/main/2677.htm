<h1 align="center">年に３回　「中河内ブロック別進路指導関係機関連絡会」の開催</h1>
<h2>概要（ポイント）</h2>
<p>前年度及び今年度の教育（進路状況）・労働（管内の障害者雇用と職業訓練校の状況）・福祉について検討し、各機関における支援内容等の情報交換を図っている。</p>
<h2>この取組による効果</h2>
<p>関係機関との連携が密になるので、今後の相談・支援等がスムーズに行われるようになった。
　また、機関間の連絡等もスムーズに行われるようになった。
</p>
<h2>地域連携機関</h2>
<p>大阪府立八尾養護学校・大阪府立東大阪養護学校
東大阪市障害者就業・生活（準備）支援センター　
東大阪市福祉事務所　等
</p>
<h2>実施ハローワーク</h2>
<p>布施公共職業安定所</p>
