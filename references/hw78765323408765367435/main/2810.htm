<h1 align="center">職員・相談員が地域の福祉施設関係機関を訪問</h1>
<h2>概要（ポイント）</h2>
<p>地域の福祉施設関係機関には地域支援担当者と統括（上席）で訪問し状況把握を行っている。一般就労への移行支援は最終目的で、利用者にハローワークがサポートすること、支援事業者にはハローワークの支援内容（職業ガイダンス、同行紹介、定着指導）の説明を行っている。</p>
<h2>この取組による効果</h2>
<p>本人・家族とも一般就労への移行希望がある利用者はもちろん、本人・家族が今後の就労移行を意識するために役立つ。</p>
<h2>地域連携機関</h2>
<p>ハローワーク渋谷管内就労移行支援事業者</p>
<h2>実施ハローワーク</h2>
<p>渋谷公共職業安定所</p>
