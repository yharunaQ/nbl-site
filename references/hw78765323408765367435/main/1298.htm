<h1 align="center">障害者求職情報一覧表の作成活用</h1>
<h2>概要（ポイント）</h2>
<p>就職の可能性の高い障害者をピックアップし、一覧表形式にまとめ、特に幹部職員の事業所訪問の際に携帯し求人開拓を行う。
なお、個人を特定できる情報は含まれていないものの、本人の了解を得て作成したものではないため、職員の手持資料としてのみ活用し、事業所への配布は行っていない。</p>
<h2>この取組による効果</h2>
<p>本年10月からの取り組みであるので、まだ目立った効果が現れるまでには至っていないが、事業所訪問時、事業主と相談を進めるうえでの一助にはなっている。</p>
<h2>実施ハローワーク</h2>
<p>和歌山労働局　ハローワーク湯浅 和歌山労働局職業対策課</p>
