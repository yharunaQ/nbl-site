<h1 align="center">求職者キャリアシートを活用した就労支援</h1>
<h2>概要（ポイント）</h2>
<p>窓口において新規求職登録時に「障害者キャリアシート」について説明し、希望条件、職歴、アピールポイント、留意事項等を記入いただき、障害者求職情報として作成し、事業主へ情報提供しマッチングを行っている。</p>
<h2>この取組による効果</h2>
<p>企業が求めている経験等を事前に知らせることにより、書類選考だけではなく、同行紹介等を行い、本人がＰＲできない内容を同行者が補足することにより、企業に対する障害者の理解を促し、就職の効果が得られている。</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク品川 品川　公共職業安定所</p>
