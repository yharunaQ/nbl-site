<h1 align="center">キャリアコンサルティング技法を用いた担当者制による障害者支援</h1>
<h2>概要（ポイント）</h2>
<p>・来談者中心療法を心がけ、求職者が自らの意志で応募先を決定できるよう支援している。
・原則、担当者制で職員と求職者の信頼関係がスムーズに構築できるように取り組んでいる</p>
<h2>この取組による効果</h2>
<p>・求職者の意志を尊重することで、求職者が納得し応募先にチャレンジできる。
・職業相談時に信頼関係を構築しているので、就職後の職場適応支援等がスムーズに行える。</p>
<h2>実施ハローワーク</h2>
<p>大阪労働局　ハローワーク泉佐野 専門援助部門</p>
