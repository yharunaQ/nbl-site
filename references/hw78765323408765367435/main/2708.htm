<h1 align="center">就職希望の生徒に対する、職場見学及び職場実習先事業所の開拓、紹介</h1>
<h2>概要（ポイント）</h2>
<p>　高等部２年生から３年生の生徒で、卒業後に一般企業に就職を希望している生徒について、個別面談や担任教諭から状況把握して、職場見学や職場実習の受入れ事業所を開拓、紹介している。</p>
<h2>この取組による効果</h2>
<p>生徒本人はもとより、保護者や教諭の一般就労に対する意識醸成の可能性が図られた。</p>
<h2>地域連携機関</h2>
<p>広島県立黒瀬特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>広島西条公共職業安定所</p>
