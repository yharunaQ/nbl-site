<h1 align="center">近隣の安定所間で申し合わせて、求人・求職者情報を共有している。</h1>
<h2>概要（ポイント）</h2>
<p>下越地区業務連絡会議において、通勤可能な事業所からの求人や該当する求職者の情報を共有することを申し合わせている。雇用率未達成企業等からの求人の情報があった時等、すぐマッチングに活用できるようにしている。</p>
<h2>この取組による効果</h2>
<p>該当する障害者の求職登録があった時などに、該当求人と、すぐ紹介に結びつけるようにしている。</p>
<h2>実施ハローワーク</h2>
<p>新潟労働局　ハローワーク新発田 新発田公共職業安定所</p>
