<h1 align="center">呼び出し紹介の積極的実施</h1>
<h2>概要（ポイント）</h2>
<p>管内の地域が広く交通不便の人が多いので、新規求人が提出されたら案内する。</p>
<h2>この取組による効果</h2>
<p>連絡をすることにより、検討をしての来所者が多くなった。（１０月末現在、５１件送付、２４件紹介、4件採用。）　</p>
<h2>実施ハローワーク</h2>
<p>東京労働局　ハローワーク青梅 青梅公共職業安定所</p>
