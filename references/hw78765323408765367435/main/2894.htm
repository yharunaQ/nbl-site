<h1 align="center">ハローワークへの出張相談</h1>
<h2>概要（ポイント）</h2>
<p>ハローワーク職員とぷれん職員が、予約制で毎週火曜日の午前10時～午後3時までハローワークとぷれんに登録している求職者の職業相談を、ハローワークで一緒に行っている。</p>
<h2>この取組による効果</h2>
<p>ハローワーク職員とぷれん職員が一緒に相談を行っているため情報の共有を確実に行える。また、ハローワーク職員とぷれん職員が今後の支援についてその場で話し合えるので、迅速に支援方法を決めることができる。</p>
<h2>地域連携機関</h2>
<p>くしろ・ねむろ障がい者就業・生活支援センター　ぷれん</p>
<h2>実施ハローワーク</h2>
<p>釧路</p>
