<h1 align="center">諏訪養護学校職場実習先企業見学</h1>
<h2>概要（ポイント）</h2>
<p>諏訪養護学校が主となり、養護学校生の実習先を前期・後期の２回４日間で、養護学校・自立支援センター・地方事務所の担当者と一緒に見学を行う。</p>
<h2>この取組による効果</h2>
<p>実際の実習作業の状況を確認することにより、生徒の作業能力等を個別に確認できるため、卒業時の進路決定や企業への依頼時に具体的な説明が可能となる。</p>
<h2>地域連携機関</h2>
<p>諏訪養護学校</p>
<h2>実施ハローワーク</h2>
<p>諏訪公共職業安定所</p>
