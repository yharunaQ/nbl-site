<h1 align="center">デイケアにおける就労支援の説明について</h1>
<h2>概要（ポイント）</h2>
<p>精神障害者に対し、医療機関の行うデイケアに協力し、雇用情勢の説明や、ハローワークの見学を行っている。</p>
<h2>この取組による効果</h2>
<p>ハローワークの利用を促進し、求職申し込みにつなげている。</p>
<h2>地域連携機関</h2>
<p>駒ヶ根病院
南信病院
</p>
<h2>実施ハローワーク</h2>
<p>伊那公共職業安定所</p>
