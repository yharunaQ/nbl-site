<h1 align="center">障害者職業センターと合同で実施しているワンストップ窓口</h1>
<h2>概要（ポイント）</h2>
<p>月１回職業センターカウンセラーとハローワーク職員による職業相談業務。</p>
<h2>この取組による効果</h2>
<p>本人のみならず保護者、支援者（作業所所長）が、職業センターカウンセラーとハローワーク職員による個別（個室）面談での相談を実施することで、安心感を抱き、今後のリハビリ計画が効果的に進められる。また、センターの支援メニューで効果的なもののスタートが早期になった。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク大和 大和公共職業安定所　　就職促進指導官</p>
