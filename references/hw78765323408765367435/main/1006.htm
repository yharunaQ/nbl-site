<h1 align="center">職場実習・雇用受入可否アンケートの実施</h1>
<h2>概要（ポイント）</h2>
<p>特殊教育学校、福祉施設ともに就職へ向けて職場実習をさせてもらいたいという欲求が高く、実際に毎年担当者が頭を悩ます問題である。
　それに対応すべく職場実習・雇用受入可アンケートを実施。蓄積した情報を利用しながら、特殊教育学校、福祉施設みに情報を提供。</p>
<h2>この取組による効果</h2>
<p>遠野では実施したばかりなので、アンケート結果は未集計。集計結果を、利用しながら今後の事業所・求人開拓に利用してゆきたい。</p>
<h2>実施ハローワーク</h2>
<p>岩手労働局　ハローワーク遠野 ハローワーク遠野</p>
