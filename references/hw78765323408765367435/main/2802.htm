<h1 align="center">障害者就業相談（巡回相談）における情報の共有</h1>
<h2>概要（ポイント）</h2>
<p>登米市で実施している巡回相談（障害者就業・生活サポートセンターに委託）における相談内容に応じ本人の了解のもと、情報を提供してもらうことでその後の就職支援に活用。</p>
<h2>この取組による効果</h2>
<p>求職登録前、来所相談前に少しでも本人の状況を知っておくことにより、求職者に対するある程度の対応の事前準備が可能。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活サポートセンター「ゆい」</p>
<h2>実施ハローワーク</h2>
<p>宮城・迫所</p>
