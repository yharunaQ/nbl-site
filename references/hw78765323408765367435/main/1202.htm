<h1 align="center">最新の職業相談・面接状況の（紹介担当者）情報共有</h1>
<h2>概要（ポイント）</h2>
<p>求職者管理情報（最新の相談内容を入力後プリントアウト）を「障害者職業相談状況」に綴り、担当不在時及び他の担当者へ即時引き出せるよう準備しマッチング及び、事業所からの求職者情報収集の問い合わせに対応する。
参考：「障害者職業相談状況」表紙</p>
<h2>この取組による効果</h2>
<p>相談を受けた職員が不在であっても、他の担当者は最新の情報をすぐ確認でき、健康状態・就職に対する希望の変更や採用後の支援状況など日々確認でき、マッチング時の無駄な紹介を避ける事が出来ている。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク富士 富士所</p>
