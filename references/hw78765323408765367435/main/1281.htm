<h1 align="center">面接時に求職者と同行</h1>
<h2>概要（ポイント）</h2>
<p>知的障害者の面接にハローワーク職員が同行し、求職者の特性や作業能力等の説明をフォローしたり、各種の支援制度（トライアル雇用、ジョブコーチ等）についての説明を行っている。</p>
<h2>この取組による効果</h2>
<p>障害者の雇い入れに不安を持つ事業主に対して、支援制度の説明を行うことで受入れを前向きに検討してもらえる。</p>
<h2>実施ハローワーク</h2>
<p>大分労働局　ハローワーク臼杵 ハローワーク臼杵</p>
