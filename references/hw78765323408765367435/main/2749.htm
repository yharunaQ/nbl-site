<h1 align="center">チーム支援を効果的に実施するための打合せ会議の開催</h1>
<h2>概要（ポイント）</h2>
<p>地域の関係機関（自治体、保健所、中核地域支援センター、障害者就業・生活支援センター、特別支援学校、医療機関、福祉施設）すべてに集まって頂き、「地域障害者就労支援事業」についての説明を行い、連携を深めるとともに、当該事業の活用促進に努めた。</p>
<h2>この取組による効果</h2>
<p>これまで、それぞれ個別に連携をとっていたが、安定所が地域の中心となり広く連携を図ることにより、より効果的な就労支援を行うことが出来るようになった。</p>
<h2>地域連携機関</h2>
<p>地域就労支援機関</p>
<h2>実施ハローワーク</h2>
<p>佐原所求人特別援助部門</p>
