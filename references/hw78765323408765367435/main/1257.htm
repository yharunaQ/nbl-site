<h1 align="center">予約相談の周知と予約相談日の連絡</h1>
<h2>概要（ポイント）</h2>
<p>予約相談の促進及び予約相談日を通知する為に作成。（ひな型有）</p>
<h2>この取組による効果</h2>
<p>特に、精神障害者は求職活動に対する不安からか、次回相談の確定を希望するものが多く、新規職業相談者を含め、予約相談の促進と次回の予約相談日を通知することにより、安心して来所あるいは職業相談の終了が出来る。</p>
