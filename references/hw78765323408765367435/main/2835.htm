<h1 align="center">福祉施設及び生活支援センターと連携した就職支援の実施</h1>
<h2>概要（ポイント）</h2>
<p>求職登録時から、福祉施設及び生活支援センターと適宜情報交換を行い、就労支援を進めている。
障害者が抱える諸問題は、単に就労斡旋のみで解決することが少ない。このため、就職後も就業場面及び日常生活両面からのサポートが欠かせない。</p>
<h2>この取組による効果</h2>
<p>求職開始時点から関係機関と連携を取ることで、就労後の情報が入りやすくなり、フォローが容易になった。職場で問題が発生した場合、ケース会議を持つなど適宜対応できる為、早期離職の防止に役立っている。</p>
<h2>地域連携機関</h2>
<p>ハローワーク伊賀</p>
