<h1 align="center">利用者に対する情報発信</h1>
<h2>概要（ポイント）</h2>
<p>障害者の職業相談を担当する職員・相談員が一定の求職者を担当し、障害者専用求人だけに留まらず、一般求人も含めて障害がある求職者が応募できる求人を求職者へ電話・FAX・郵便などで情報提供している。</p>
<h2>この取組による効果</h2>
<p>障害がある求職者に情報提供することによって、障害者が応募の機会を逃すことが少なくなっている。
また、求職者が就職意欲を無くすことがないような効果もうかがえる。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク釧路 釧路</p>
