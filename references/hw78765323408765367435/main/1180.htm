<h1 align="center">障害者求職台帳の管理フォーマットの作成</h1>
<h2>概要（ポイント）</h2>
<p>・求職者全体の登録状況の管理
・事業所訪問時に管内求職障害者の状況説明及び求職者情報として活用</p>
<h2>この取組による効果</h2>
<p>・今年度雇用指導官により作成。事業所訪問時に活用を始めたところである。</p>
