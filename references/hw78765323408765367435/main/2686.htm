<h1 align="center">精神科クリニックとの連携で、相談の際、ケースワーカーより生育歴などの情報提供を求めている。</h1>
<h2>概要（ポイント）</h2>
<p>クリニックのケースワーカーが同行しての相談の際（予約相談）、本人の了解を得た上で、「主治医の意見書」を提出してもらう以外に、生育歴などが書かれた「ケースプロファイル」ももらっている。</p>
<h2>この取組による効果</h2>
<p>意見書では病状についての情報に限定されるが、生育歴など（家庭環境、発病時の職場・職種など）を把握することで、より的確な対応ができる。</p>
<h2>地域連携機関</h2>
<p>医療法人　三家クリニック</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク門真</p>
