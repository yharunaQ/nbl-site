<h1 align="center">
・ 求人情報の提供
・ 求人票の活用
</h1>
<h2>概要（ポイント）</h2>
<p>・ 職場実習やトライアル雇用、ジョブコーチなど、支援ツールを活用し、就労支援をスムーズに行うために求人（事業所）情報を提供する。
・ 医師の意見書等から判断して、本人の希望求人条件に係る医師との相談が必要と思われる場合には、医師機関に求人票を持たせ、就労等にかかる具体的助言をいただくこととしている。</p>
<h2>この取組による効果</h2>
<p>・ 職域の拡大が図られた。
・ 医療機関より求職者に対し的確なアドバイスが与えられ就職に結びついた。</p>
<h2>地域連携機関</h2>
<p>福祉施設、障害者就業・生活支援センター、病院</p>
<h2>実施ハローワーク</h2>
<p>松戸所専門援助部門</p>
