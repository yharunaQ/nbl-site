<h1 align="center">障害者求職者情報の発行</h1>
<h2>概要（ポイント）</h2>
<p>求職者情報に障害部位、程度、資格、職歴、希望条件、本人のPRを掲載し、窓口で配布、各種会議時の資料配布、障害者雇用率未達成事業主の指導時に手渡している。</p>
<h2>この取組による効果</h2>
<p>事業主指導時に具体的な情報を提供することにより、雇い入れ時に対するイメージがつかみやすく、実際に指名されるケースもある。</p>
