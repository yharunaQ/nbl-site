<h1 align="center">障害者職業センターカウンセラーと同行して職場見学</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用について相談があった事業所に対し、求人申込み前にハローワーク担当者と障害者職業センターのカウンセラーが同行し、雇用しようとする職場を見学させてもらっている。</p>
<h2>この取組による効果</h2>
<p>職場を実際に見ることで、事業主の意向や職場の雰囲気・職種内容を把握でき、適格者の紹介が行える。
また、障害者職業センターのカウンセラーと同行することで、以降の連携が円滑に行える。</p>
<h2>地域連携機関</h2>
<p>山口障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>山口公共職業安定所</p>
