<title>「障害者事前相談票」によって、学卒障害者及び知的障害者の学校生活、障害特性、作業能力を記録し、職業相談に活用する</title>

<h1 align="center">「障害者事前相談票」によって、学卒障害者及び知的障害者の学校生活、障害特性、作業能力を記録し、職業相談に活用する</h1>
<h2>概要（ポイント）</h2>
<p>障害者求職登録票では把握または記録しにくい学校生活、障害特性、作業能力を記録し、職業相談、職業紹介に役立てている。</p>
<h2>この取組による効果</h2>
<p>特別支援学校、障害者訓練校での職業相談が円滑に進み、実習先開拓、求人開拓の際に本人の特性を説明しやすい。</p>
