<h1 align="center">受入体制の事前準備に係るカウンセラー派遣要請</h1>
<h2>概要（ポイント）</h2>
<p>障害者 (実例では精神) の受入に不安を抱く事業所に対し、就職前の段階で受入予定職域はもとより当該障害者が関係すると思われる職域を広く対象として障害の特性理解や受入時の配慮について講習会を実施。</p>
<h2>この取組による効果</h2>
<p>過去に受入体制の未熟さから障害者が早期離職したことの反省から実施。障害者の理解と受入意識が高まり、その後の就労がスムーズに進んだ。なお、就労開始後はジョブ・コーチ支援も実施。</p>
<h2>地域連携機関</h2>
<p>新潟障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>妙高所　職業紹介部門</p>
