<h1 align="center">ハローワークにおける職場実習</h1>
<h2>概要（ポイント）</h2>
<p>　管内の特別支援教育機関と連携し、職場実習を実施した。
　行田養護学校３年生１名２週間、羽生ふじ高等学園１年生１名１週間で実施。
　今後も１１月２６日からの２週間で予定している。</p>
<h2>この取組による効果</h2>
<p>　ハローワークで実施することにより、実習前の業務の洗い出しや実習を通じて職員の研修になった。
また、ハローワークを利用する企業に対して、障害者雇用をアピールすることができた。</p>
<h2>地域連携機関</h2>
<p>　埼玉県立行田養護学校
　埼玉県養護学校羽生ふじ高等学園
</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク行田</p>
