<h1 align="center">窓口求職者を中心に求人の情報を提供</h1>
<h2>概要（ポイント）</h2>
<p>3ヶ月に数社、所長と事業所訪問を行い、障害者求人の確保に努めている。
その結果、訪問効果も働き、事業所側も柔軟性を示す場合があり、事業所との関係がスムーズになり、求人確保につながる場合がある。</p>
<h2>この取組による効果</h2>
<p>障害者が応募可能な求人を常時保管し、その都度本人にあった情報を提供している。</p>
<h2>実施ハローワーク</h2>
<p>山口労働局　ハローワーク下関 下関公共職業安定所</p>
