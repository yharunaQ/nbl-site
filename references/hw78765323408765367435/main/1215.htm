<h1 align="center">精神障害者の通院前の定期的来所指示</h1>
<h2>概要（ポイント）</h2>
<p>休日（毎週金曜日）デイケアに行く途中、安定所へ寄るよう指示をし、病状観察を常時行い、状況に即応した職場定着指導を行う。</p>
<h2>この取組による効果</h2>
<p>１週間という定期で、本人の精神状態を確認できるため、いい状態あるいは悪い状態を的確に判断でき、それをジョブコーチと情報を共有することによってタイムリーな定着指導ができる。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク飯塚 飯塚</p>
