<h1 align="center">面接同行の依頼</h1>
<h2>概要（ポイント）</h2>
<p>本人の情報を共有することで内容の濃い面接が実施できる</p>
<h2>この取組による効果</h2>
<p>面接時、サポートすることにより、本人の不安を解消することと、初めて障害者を雇用する事業所にも、細かい情報を伝える事が出来る。また面接後の支援についても、具体的な方策がたてられる。</p>
<h2>地域連携機関</h2>
<p>いなば園（就労移行支援事業）</p>
<h2>実施ハローワーク</h2>
<p>津公共職業安定所</p>
