<h1 align="center">障害者委託訓練受講者に対する再就職援助</h1>
<h2>概要（ポイント）</h2>
<p>当所管内の静岡県立沼津技術専門校で実施される障害者を対象とした委託訓練（平成１９年度はパソコン実務科・商品物流科）受講者に対し、再就職に関するガイダンスを実施している。</p>
<h2>この取組による効果</h2>
<p>ガイダンスの内容は、求人の受理状況・各種援護措置・ハローワーク利用の周知等で、技術専門校と連携して訓練生の就職促進を図ることを目標とする。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク沼津 沼津公共職業安定所</p>
