<h1 align="center">事業主の障害理解の促進</h1>
<h2>概要（ポイント）</h2>
<p>未達成企業への訪問や、あらゆる訪問の機会を利用して職場実習の依頼や事業主に対する支援についてのパンフレットを配布。</p>
<h2>この取組による効果</h2>
<p>職場実習や、トライアル雇用、ジョブコーチ支援等を活用した成功例について説明することで、事業主の理解が促進される。</p>
<h2>実施ハローワーク</h2>
<p>福井労働局　ハローワーク小浜 小浜公共職業安定所</p>
