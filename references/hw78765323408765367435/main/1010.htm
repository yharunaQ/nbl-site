<h1 align="center">雇い入れに伴う各種援助の活用例の作成（Ｈ１７～）</h1>
<h2>概要（ポイント）</h2>
<p>自社における訓練生としての受入を経て雇い入れる場合やトライアル雇用を経て常用雇用に移行する場合など、幾つかの雇入れまでのパターンや、ジョブコーチ制度を簡潔に紹介したリーフを作成し、求人開拓や雇用率達成指導に活用している。</p>
<h2>この取組による効果</h2>
<p>特に雇用実績のない事業主など、障害者雇用を前向きに検討するきっかとなっている。</p>
<h2>実施ハローワーク</h2>
<p>岩手労働局　ハローワーク北　　　上 北上所</p>
