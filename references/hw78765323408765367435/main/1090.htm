<title>障害者雇用に対する支援を簡単に説明できる「障害者雇用に向けた事業所への支援について」というリーフレットを作成し、実習先の開拓、求人開拓に活用している。</title>

<h1 align="center">障害者雇用に対する支援を簡単に説明できる「障害者雇用に向けた事業所への支援について」というリーフレットを作成し、実習先の開拓、求人開拓に活用している。</h1>
<h2>概要（ポイント）</h2>
<p>労働局作成のリーフレットを簡素化し、職場適応訓練と委託訓練を外したものを作成して活用している。</p>
<h2>この取組による効果</h2>
<p>職場実習の開拓や求人開拓に活用し、障害者雇用の説明に利用している。雇用率の未達成指導の際にも雇用指導官に配付をお願いしている。ジョブコーチ支援はこのリーフレットを見て依頼があることが多い。</p>
