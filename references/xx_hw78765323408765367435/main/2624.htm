<h1 align="center">障害者福祉施設への求人情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>管内の福祉施設に対して、求人情報を配付し施設内に掲示している。</p>
<h2>この取組による効果</h2>
<p>施設利用者が、求人票を閲覧することによって就業意欲を高める効果がある。</p>
<h2>地域連携機関</h2>
