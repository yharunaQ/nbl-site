<h1 align="center">就業準備講習会</h1>
<h2>概要（ポイント）</h2>
<p>諏訪養護学校の高等部の１～３年生を対象に工場見学と障害者就労支援アドバイザーによる講演を行う。</p>
<h2>この取組による効果</h2>
<p>職場見学・講演を通して、①働くことの意義を自覚する②学校と会社の違いを理解する③働くための心構えを身につける④働くことの厳しさ、現状を取り巻く環境について認識する等を、学習できる。</p>
<h2>地域連携機関</h2>
<p>諏訪養護学校</p>
<h2>実施ハローワーク</h2>
<p>諏訪公共職業安定所</p>
