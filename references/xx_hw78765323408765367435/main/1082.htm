<h1 align="center">「障害者求職相談用アンケート」の活用</h1>
<h2>概要（ポイント）</h2>
<p>窓口での相談及び関係機関との連携を図る上で、有効なツールと思われる。</p>
<h2>この取組による効果</h2>
<p>求職者と職員との相互理解、信頼が深まり、障害の特性に応じたきめ細かな職業相談を実施する上で効果がある。</p>
