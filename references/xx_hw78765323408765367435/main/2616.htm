<h1 align="center">精神障害者ジョブガイダンス</h1>
<h2>概要（ポイント）</h2>
<p>授産施設において、就職希望者に対し精神障害者ジョブガイダンスをおこなう。
茨城障害者職業センターを講師に招き、就職の意義、仕事が長続きする為に等を講義していただく。
管内の障害者就労状況、就職に向けて等の説明をしている。</p>
<h2>この取組による効果</h2>
<p>現在進行中の為未定</p>
<h2>地域連携機関</h2>
<p>精神障害者通所授産施設　恵和社会復帰センター</p>
<h2>実施ハローワーク</h2>
<p>土浦</p>
