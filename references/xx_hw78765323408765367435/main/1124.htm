<h1 align="center">一般求人から転用による就職</h1>
<h2>概要（ポイント）</h2>
<p>以前から障害者雇用の意向を示していた建設会社から土木技術者の求人の提出があり、また、土木施行管理技師の有資格者である障害者に求人を連絡し、応募希望となった事。</p>
<h2>この取組による効果</h2>
<p>事業所が、障害者の特性（下肢障害、斜面での業務不可）を考慮のうえ、面接し、採用となった。</p>
<h2>実施ハローワーク</h2>
<p>高知労働局　ハローワーク香美 ハローワーク香美</p>
