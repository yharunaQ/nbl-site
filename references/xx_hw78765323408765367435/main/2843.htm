<h1 align="center">特別支援学校の生徒のうち就職を希望する者に対し、職業意識形成のためハローワークに来所し、安定所の利用方法の説明や職業講話を実施している。</h1>
<h2>概要（ポイント）</h2>
<p>今年度は平成19年12月6日に実施予定（生徒19名・引率教員3名）</p>
<h2>この取組による効果</h2>
<p>学校に籍があるうちにハローワークの利用方法や仕事の現状を知ることにより、将来職業生活を営むうえで困難なことが起こった時の相談や仕事の厳しさを知っておくことは有効である。</p>
<h2>地域連携機関</h2>
<p>愛知県立安城養護学校</p>
