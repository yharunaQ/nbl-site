<h1 align="center">障害者用求人の公開カードの所内掲示</h1>
<h2>概要（ポイント）</h2>
<p>障害者用求人の公開カードを所内ロビーの掲示板へ掲示</p>
<h2>この取組による効果</h2>
<p>障害者用求人だけを掲示することで、自己検を操作して、一般求人の中から障害者用求人を見つけ出す手間を省ける。</p>
<h2>実施ハローワーク</h2>
<p>奈良労働局　ハローワーク下市 下市</p>
