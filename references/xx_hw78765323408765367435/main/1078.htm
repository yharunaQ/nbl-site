<h1 align="center">障害者にマッチングしそうな求人ファイルの作成</h1>
<h2>概要（ポイント）</h2>
<p>仕事内容や経験・資格欄からみて障害者にマッチングしそうな求人を、毎日回覧される自所受理求人及び自己検索パソコンより抽出してファイリングし、相談時に活用。</p>
<h2>この取組による効果</h2>
<p>自分での求人検索・選択が難しい知的障害者や、中途の障害によりどんな仕事ができるかわからない障害者等との相談時に、比較的受け入れ幅が広そうな具体的な求人情報を提供することで、スムーズに相談ができるようになった。</p>
<h2>実施ハローワーク</h2>
<p>大阪労働局　ハローワーク岸和田 専門援助部門</p>
