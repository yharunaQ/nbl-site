<h1 align="center">相談来所時に、支援者の同行。情報の共有</h1>
<h2>概要（ポイント）</h2>
<p>来所時（特に初回）に支援者に同行いただく。今後の相談状況等の情報を双方で共有し、支援する事を、説明し、障害者本人の了承を得る。</p>
<h2>この取組による効果</h2>
<p>障害者本人の障害特性や、職業能力、生活基盤等の情報を広く、深く短時間（短期間）で得ることが可能。本人からの申告のみでなく、第3者からの情報により客観的でより正確にそれらの情報が得られる。よって、紹介時のミスマッチを防ぐ。的確紹介により、事業所からの信頼も得ることが可能。</p>
<h2>地域連携機関</h2>
<p>泉州北障害者就業・生活支援準備センター</p>
<h2>実施ハローワーク</h2>
<p>泉大津公共職業安定所</p>
