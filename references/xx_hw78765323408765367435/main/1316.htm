<h1 align="center">履歴書、職務経歴書送付時にハローワーク作成の照会文の添付</h1>
<h2>概要（ポイント）</h2>
<p>発達障害を持たれる求職者を紹介するにあたり、本人の特性（まじめで、温厚、コミュニケーションが苦手）を付記し、障害者職業センターの活用を促進する照会文を添付した。</p>
<h2>この取組による効果</h2>
<p>事前に障害者職業センターカウンセラーと共に訪問し、再度本人の特性を伝え、制度の説明を行うことが出来、事業主の理解が促進され、面接もスムーズに行われ、雇用前就労、トライアル雇用につながった</p>
<h2>実施ハローワーク</h2>
<p>奈良労働局　ハローワーク大和郡山 </p>
