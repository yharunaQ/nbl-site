<h1 align="center">事業主向けの、関係支援機関の業務内容等の説明パンフレットの作成</h1>
<h2>概要（ポイント）</h2>
<p>M市地域自立支援協議会関係機関の業務内容等の説明パンフレットを作成し、障害者雇用について相談したい事業主への周知等に活用している。</p>
<h2>この取組による効果</h2>
<p>障害者雇用について困っている事・相談したい事のある事業主に、相談機関の案内ができる。また、支援機関が多数あることがわかることによって、安心感が生まれる。</p>
<h2>実施ハローワーク</h2>
<p>群馬労働局　ハローワーク前橋 専門援助部門</p>
