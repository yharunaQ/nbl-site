<h1 align="center">求人情報の積極的な提供</h1>
<h2>概要（ポイント）</h2>
<p>管内・管外の障害者対象求人の中から、応募可能な求人について積極的にスワン工舎へ提供し応募を促している。</p>
<h2>この取組による効果</h2>
<p>提供した求人情報から職場実習へつながって、就職した事例が２件あった。</p>
<h2>地域連携機関</h2>
<p>スワン工舎（就労移行支援事業者）</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク朝霞</p>
