<h1 align="center">障害者雇用に関する情報の交換と共有について</h1>
<h2>概要（ポイント）</h2>
<p>日常的に自由に話し合える関係を構築し、対象となる障害者や、具体的な案件だけでなく、広く意見交換を行う。
明確な情報だけにとらわれず、不確定な情報でも共有することによって、具体的な情報へと変化することが期待できる</p>
<h2>この取組による効果</h2>
<p>新たな求人の開拓で、それに伴う障害者雇用の増加
簡単な情報の提供から、安定所や支援者が積極的に働きかけてくることに対して事業所側の信頼度・満足感の増加につながる</p>
<h2>地域連携機関</h2>
<p>県中地域障害者就業･生活センター</p>
<h2>実施ハローワーク</h2>
<p>郡山所</p>
