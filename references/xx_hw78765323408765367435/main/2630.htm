<h1 align="center">タイムリーな情報提供</h1>
<h2>概要（ポイント）</h2>
<p>福祉施設（就労移行・就労継続事業者）台帳整備のために訪問した施設に対して、ハローワークで収集した情報をタイムリーに提供している。</p>
<h2>この取組による効果</h2>
<p>求人情報や訓練情報を提供する事によって、各施設利用者のハローワークの利用の促進にもつながり、各情報に対し応募することが出来る。</p>
<h2>地域連携機関</h2>
<p>管内就労支援移行事業者</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク所沢</p>
