<h1 align="center">施設担当者との密接な連絡、情報交換</h1>
<h2>概要（ポイント）</h2>
<p>施設を利用しながら求職活動を行っている求職者について、現在の状況、体調等の情報の確認を行いながら求人開拓、同行面接を実施。</p>
<h2>この取組による効果</h2>
<p>本人の状態を把握しながら、求人開拓の適切なタイミングを見極めることが出来、効果的なマッチングを図ることが出来る。　</p>
<h2>地域連携機関</h2>
<p>ワークサポートやまなみ</p>
<h2>実施ハローワーク</h2>
<p>三好公共職業安定所</p>
