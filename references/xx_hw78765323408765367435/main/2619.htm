<h1 align="center">茨城県南部障害者雇用支援センターと連携した求人開拓</h1>
<h2>概要（ポイント）</h2>
<p>センター利用者の実習先、就職先を探すにあたり、ハローワークの求人情報、センターの実習先開拓の情報やケース会議での利用者の情報を相互に利用し、連絡を取り合って求人開拓をしている。</p>
<h2>この取組による効果</h2>
<p>センター利用者になるべく適合するような求人を開拓して就職の斡旋をおこなえる。</p>
<h2>地域連携機関</h2>
<p>茨城県南部障害者雇用支援センター</p>
<h2>実施ハローワーク</h2>
<p>龍ヶ崎公共職業安定所</p>
