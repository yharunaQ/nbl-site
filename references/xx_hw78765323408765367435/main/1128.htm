<h1 align="center">求職者情報の作成</h1>
<h2>概要（ポイント）</h2>
<p>　定期的に新規求職者および緊要度が高い求職者の求職者情報を作成し、求人窓口にて事業所へ配布、未達成企業の求人開拓に活用している。</p>
<h2>この取組による効果</h2>
<p>　情報誌には、動作の制限、アピールポイント等記載し、事業所側も具体的にこの部署であれば受け入れが可能であるとのイメージがしやすい。実際にリクエストをもらい求人受理したケースもある。</p>
<h2>実施ハローワーク</h2>
<p>島根労働局　ハローワーク益田 益田公共職業安定所</p>
