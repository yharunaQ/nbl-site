<h1 align="center">障害者就業・生活支援センターとの連携</h1>
<h2>概要（ポイント）</h2>
<p>当センターは、幸いにして安定所から至近距離にあるため、センター利用者のうち、重度の知的障害者が雇用保険受給手続き、失業認定で安定所にらい書する必要の場合、センター職員が同行してくれている。
また、就職活動の折も同様にセンター職員が同行により来所している。</p>
<h2>この取組による効果</h2>
<p>本人の求職条件等を、センター職員が明確に把握しており、職業紹介好意がスムーズに行われる。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活支援センター大分プラザ</p>
<h2>実施ハローワーク</h2>
<p>大分公共職業安定所</p>
