<h1 align="center">障害者職業センターの活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用率未達成事業主の相談時に、障害者をどのような仕事についていただくか思案しているケースが多々あるため、障害者職業センターとの連携及び活用について説明し、センター職員の事業所見学による障害者雇用及び職域開発等についてのアドバイスを受けるように助言している</p>
<h2>この取組による効果</h2>
<p>センター職員による事業所見学したうえでの、障害者雇用及び職域開発等の助言により、障害者雇用の理解の促進及び障害者雇用の不安の緩和がされ、的確な求人開拓に繋がる。</p>
<h2>実施ハローワーク</h2>
<p>愛知労働局　ハローワーク豊橋 専門援助部門</p>
