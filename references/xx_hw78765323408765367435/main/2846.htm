<h1 align="center">福祉施設担当者や就労支援センター担当者との連携</h1>
<h2>概要（ポイント）</h2>
<p>福祉施設担当者と連絡をとり、求人情報の提供、助成金等のハローワークで行っている事業の説明を行う</p>
<h2>この取組による効果</h2>
<p>・ハローワークと福祉施設担当者が、連絡を密にして活動することで求人と求職のマッチングを図ることが出来る
・トライアル雇用、助成金制度を有効的に活用できる</p>
<h2>地域連携機関</h2>
<p>西尾市内福祉就労施設・就労支援センター</p>
<h2>実施ハローワーク</h2>
<p>西尾公共職業安定所</p>
