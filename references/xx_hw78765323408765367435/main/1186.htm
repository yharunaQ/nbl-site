<h1 align="center">殆ど来所しない登録障害者に対する定期的アンケートによる現況確認</h1>
<h2>概要（ポイント）</h2>
<p>障害登録している者に対して年に1～2回アンケート調査を実施している。
　1回は障害者就職面接会の実施案内に併せて行っており、面接会の出欠回答に併せて現況(就職・福祉就労の有無)及び障害登録継続の確認。
（アンケート様式2種類参照）</p>
<h2>この取組による効果</h2>
<p>当所窓口に殆ど来所しない登録障害者の現況が確認できる。</p>
