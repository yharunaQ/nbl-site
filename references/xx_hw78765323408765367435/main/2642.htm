<h1 align="center">生活支援により就労の安定を目指す</h1>
<h2>概要（ポイント）</h2>
<p>○精神障害者の場合、家族との関わりが精神状態の浮沈に大きく関係していることから、家族の老人介護・児童相談等の援助が必要と思われる対象者については該当事項により市役所の各課と連携し、問題解決に努める。</p>
<h2>この取組による効果</h2>
<p>○家庭での諸問題が改善されることでストレスが軽減され、就労の安定が見込める。
　また、悩み事があっても関係行政が相談に乗ってくれる、との安心感が大きくなることで信頼関係が構築され、問題発生時に初期段階から本人の相談の意思表示が期待される。</p>
<h2>地域連携機関</h2>
<p>能代市役所</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク能代</p>
