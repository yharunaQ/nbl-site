<h1 align="center">データベースソフト「アクセス」を利用した障害者求職登録台帳の作成。</h1>
<h2>概要（ポイント）</h2>
<p>求職登録されている障害者の情報をデータベース化し、様々な条件で抽出加工し、多方面での求職者情報提供に利用している。</p>
<h2>この取組による効果</h2>
<p>障害部位別の求職者リストを作成し、事業主に情報提供をしたり、就職者リストから過去に障害者の雇用実績のある事業所リストを作成し、特別支援学校等からの実習先開拓の相談に対しての情報提供に活用している。</p>
<h2>実施ハローワーク</h2>
<p>長野労働局　ハローワーク須坂 職業相談部門</p>
