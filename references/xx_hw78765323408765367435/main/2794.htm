<h1 align="center">しごとサポートセンターへの同行相談</h1>
<h2>概要（ポイント）</h2>
<p>ハローワーク登録のみの利用者にセンターでの支援の概要を説明し、本人の了解が得られれば同行し、センターでの相談もあわせて行う。（本人と家族のみでセンター相談のケースも多い）</p>
<h2>この取組による効果</h2>
<p>障害の特性から福祉関係機関での基礎訓練や職場実習体験が望ましいと思われる利用者の、障害に対する受容と「できること」「できないこと」の認識が深まる。</p>
<h2>地域連携機関</h2>
<p>北九州障害者しごとサポートセンター</p>
<h2>実施ハローワーク</h2>
<p>門司所</p>
