<h1 align="center">個別求人開拓</h1>
<h2>概要（ポイント）</h2>
<p>雇用指導官との連携により、雇用率達成指導に併せて、就職意欲の高い障害者を事業主に紹介し職域の拡大を含め、その障害者にあった職種の求人開拓を行う。</p>
<h2>この取組による効果</h2>
<p>特に就職意欲の高い障害者については、既存の求人でマッチング出来ない場合には、効果的である。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク平塚 平塚公共職業安定所　　専門援助部門</p>
