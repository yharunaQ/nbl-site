<h1 align="center">雇用率未達成事業所からの新着求人を全てチェックし、
マッチングを心掛け、障害者の紹介につなげている。　
</h1>
<h2>概要（ポイント）</h2>
<p> 毎日　新着求人のうち　未達成事業所分については専門援助部門内でチェックの上、部門内回覧し、マッチングを心掛ける。</p>
<h2>この取組による効果</h2>
<p>　マッチングについては、一応担当を決めているが、マンパワー不足のため、マッチングのための求職者把握作業は滞りがちとなっている。それでも、着実に未達成事業所の雇用率向上につながっていると思う。</p>
<h2>実施ハローワーク</h2>
<p>佐賀労働局　ハローワーク佐賀 佐賀公共職業安定所</p>
