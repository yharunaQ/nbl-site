<h1 align="center">３　障害者求職情報の活用</h1>
<h2>概要（ポイント）</h2>
<p>　就職面接会参加呼び掛けや雇用率達成指導のために事業所訪問するときに障害者求職情報を携帯して、求職者の態様や現状の説明、リクエストの依頼に活用した。
　「障害者求職情報」様式あり。</p>
<h2>この取組による効果</h2>
<p>　事業所に障害者雇用の意識を持っていただき障害者雇用を検討していくための好い材料になっていると思われる。</p>
