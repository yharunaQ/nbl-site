<h1 align="center">採用意欲の高い求人者の情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>事例は少ないが、障害者就業支援センターの支援員が求職者を同行して職業相談に来所した際には、当該求職者向け以外にも採用意欲の高い求人者の求人情報を提供し、支援センターの利用者向けに広く活用してもらっている。</p>
<h2>この取組による効果</h2>
<p>支援センターの支援員が利用者の意思確認した上で、職業相談を行うため、
スムーズな相談が可能である。</p>
<h2>地域連携機関</h2>
<p>春日部市及び久喜市の各障害者就労支援センター</p>
<h2>実施ハローワーク</h2>
<p>春日部公共職業安定所</p>
