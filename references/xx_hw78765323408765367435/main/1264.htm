<h1 align="center">求職者のスキルアップ</h1>
<h2>概要（ポイント）</h2>
<p>セミナー・職業訓練（パソコン）を積極的に案内指示。
面接対応、履歴書作成、職務経歴書の作成のポイントについてセミナー参加によりしっかりした事前準備とパソコンスキルを持つことにより、本人の就職への意識高揚をはかる。</p>
<h2>この取組による効果</h2>
<p>特に、職歴のある障害者の場合、面接時の事前準備をしっかりすることで自信を持って応募面接に臨むことができる。また、事務系以外の職種でも報告書等パソコン必須も多いことから、パソコンもできますと紹介できると面接及び就職可能性が高まる。</p>
<h2>実施ハローワーク</h2>
<p>福島労働局　ハローワーク喜多方 求人専門援助部門</p>
