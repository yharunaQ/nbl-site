<h1 align="center">養護学校からの訪問見学に対応したハローワークの業務案内パンフレットの作成</h1>
<h2>概要（ポイント）</h2>
<p>養護学校在学中の当所見学に際し、安定所の業務を知的障害者向けに分かり易くイラスト化したものです。</p>
<h2>この取組による効果</h2>
<p>養護学校在学者や既卒者の安定所への来所と積極的な相談を促進している。（安定所の利用を意外と保護者も本人も知らない例が多い。）</p>
