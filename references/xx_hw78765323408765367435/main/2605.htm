<h1 align="center">主として知的障害者を対象にした「履歴書の書き方・面接の受け方等のガイダンス」の実施</h1>
<h2>概要（ポイント）</h2>
<p>当所主催の「障害者就職面接会」の開催前に、参加希望の知的障害者を主に障害者就業・生活支援センター　アシストと連携し４日程度の「職業講座」というガイダンスを実施し、新潟障害者センター、関係福祉施設とともに講師等をしている。</p>
<h2>この取組による効果</h2>
<p>障害者就職促進会に参加する意欲を高め、面接等に対する不安を和らげ、他人とのコミュニケーションを取る練習の場となっている。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活支援センター　アシスト</p>
<h2>実施ハローワーク</h2>
<p>新発田公共職業安定所</p>
