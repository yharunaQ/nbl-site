<h1 align="center">進路連絡協議会への参加</h1>
<h2>概要（ポイント）</h2>
<p>直接学校を訪問し先生をはじめ授業参観・施設見学・保護者等との意見交換・相談･情報交換を行いできるだけ、新しい情報の蓄積を行っている。</p>
<h2>この取組による効果</h2>
<p>蓄積された情報に基づいた事業主への雇用指導に役立っている。</p>
<h2>地域連携機関</h2>
<p>埼玉県立三郷養護学校</p>
<h2>実施ハローワーク</h2>
<p>草加所</p>
