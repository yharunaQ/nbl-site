<h1 align="center">朝のミーティング時期におけるマッチング会議</h1>
<h2>概要（ポイント）</h2>
<p>朝のミーティング時に、前日求人を回覧し、障害者に応募可能な求人をチェックし、当該障害者へ連絡している。</p>
<h2>この取組による効果</h2>
<p>朝のミーティング時にチェックをしているので、他の職員からの求人情報も得やすく、情報が早めに提供でき、より効果的な紹介につながる。また、情報提供したことにより、本人が来所され、その求人の紹介に至らない場合でも、別の求人への紹介につながるケースもみられる。</p>
<h2>実施ハローワーク</h2>
<p>滋賀労働局　ハローワーク長浜 長浜公共職業安定所</p>
