<h1 align="center">事業主への求職者情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>久留米所と合同で「希望職種」「職歴」「免許・資格」等を盛り込んだ求職者情報紙を作成し、マッチング時や雇用指導官等が未達成企業の求人開拓に活用している。
「障害者求職情報紙有り」</p>
<h2>この取組による効果</h2>
<p>マッチング時に本人の「希望職種」「職歴」「免許・資格」等を示しながら説明することにより、事業主が求める人材がより把握しやすくなり、面接成功率が高まっていると思われる。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク久留米（大川） 久留米（大川）</p>
