<h1 align="center">模擬面接等実施によるスキルアップを図っての就労支援</h1>
<h2>概要（ポイント）</h2>
<p>　求職者に対して就労講座を開催し、模擬面接や履歴書、職務経歴書の書き方の訓練を行なった。その後、事業主に対しての求職者の情報提供を行い、同伴紹介を行う。</p>
<h2>この取組による効果</h2>
<p>模擬面接を行うことにより、周囲の意見を参考にしたり、自らの反省に基づき的確な受け答えが出来るようになった。また、就労講座により服装や身なりがきちんとなり、履歴書や職務経歴書の記入も正しく出来ているため、第一印象が良くなった。</p>
<h2>実施ハローワーク</h2>
<p>長崎労働局　ハローワーク佐世保 長崎労働局</p>
