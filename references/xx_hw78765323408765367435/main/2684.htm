<h1 align="center">養護学校との綿密な連携</h1>
<h2>概要（ポイント）</h2>
<p>・職員、教師、生徒、保護者の四者面談を年二回実施。
　（高校３年生対象、７月・１２月に実施）
・職員と教師の連携による卒業生に対する職場適応指導の実施。
　（新卒者対象）</p>
<h2>この取組による効果</h2>
<p>・高校３年時に年２回面談することにより、生徒及び保護者の考え、特性等を把握できる。（未就職時の職業相談がスムーズに行える）
・職員、教師が連携して職場適応を実施することで、卒業生及び事業主に対して適切なアドバイスができる。</p>
<h2>地域連携機関</h2>
<p>大阪府立佐野養護学校</p>
<h2>実施ハローワーク</h2>
<p>泉佐野公共職業安定所</p>
