<h1 align="center">障害者就労支援セミナーを特別支援教育機関で実施</h1>
<h2>概要（ポイント）</h2>
<p>　県北地域（熊谷・本庄・秩父・行田）の雇用率未達成企業等を対象とした
障害者就労支援セミナーを特別支援教育機関で実施した。
　学校側の説明、授業見学のほか、特例子会社の社長からの講演で知的障害者の雇用に理解を深めた。</p>
<h2>この取組による効果</h2>
<p>　参加企業に学校見学は好評であった。
　知的障害者が実際に実習（授業）しているところを見学したので、知的障害者のことを知るうえで効果的であった。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク行田 ハローワーク行田</p>
