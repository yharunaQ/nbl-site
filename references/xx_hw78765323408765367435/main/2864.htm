<h1 align="center">ハローワーク見学会</h1>
<h2>概要（ポイント）</h2>
<p>山口養護学校高等部の産業科2年生（就職希望者）に対して、ハローワークの施設内見学及び職業講話を実施している。</p>
<h2>この取組による効果</h2>
<p>早い段階から就職について意識することで、その後の職場実習の取り組む意欲を高めることが出来る。</p>
<h2>地域連携機関</h2>
<p>山口養護学校</p>
<h2>実施ハローワーク</h2>
<p>山口公共職業安定所</p>
