<h1 align="center">求職活動の分析</h1>
<h2>概要（ポイント）</h2>
<p>過去の相談記録を分析し、紹介に至った記録のみならず、本人に応募の意志があった事業所名、職種、不調理由、離職理由の詳細を時系列に沿ってまとめてみる。</p>
<h2>この取組による効果</h2>
<p>転職を繰り返すケースや、面接までたどり着かず、面接が決定したとしても採用されないケースなど、求職期間が長期化する者には過去を分析し支援策の効率化を図ることで、少ない機会を最大限に生かすことができる。求職期間が短縮されるか否かは、管内の求人事情による。</p>
<h2>実施ハローワーク</h2>
<p>三重労働局　ハローワーク尾鷲 尾鷲</p>
