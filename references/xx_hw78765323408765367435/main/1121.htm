<h1 align="center">障害者雇用実態アンケートの実施</h1>
<h2>概要（ポイント）</h2>
<p>　管内の障害者の雇用状況は、毎年６－１報告により５６人以上の企業については把握しているところである。しかし、安定所での紹介対象事業所の大半はそれ以下の規模の事業所のため、１０人以上５６人未満の事業所の障害者雇用状況、課題及び採用意向を把握し、今後の雇用の場を広げて行くことに結び付ける。</p>
<h2>この取組による効果</h2>
<p>　アンケート結果により、今後の障害者雇用についての見通し、課題を把握することで、事業所訪問・求人開拓等を実施する際に活用が可能と思われる。</p>
<h2>実施ハローワーク</h2>
<p>徳島労働局　ハローワーク美馬 美馬公共職業安定所</p>
