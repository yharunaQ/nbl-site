<h1 align="center">・病気による中途受障となった方への支援について、就職をあせらないように、本人の障害特性を踏まえ、懇切・丁寧な相談を重ねた。

</h1>
<h2>概要（ポイント）</h2>
<p>・ 脳梗塞により左上下肢障害で来所。
・ 前職が運送関係だったが、病気のため今後は事務系を希望。
・ パソコンの委託訓練を薦め、２ヶ月受講。
・ 複数の事業所に問い合わせを重ね就職が決定した。
・ 新規登録から就職まで、１年６ヶ月。</p>
<h2>この取組による効果</h2>
<p>・ 定期的な相談来所が、リハビリとなった。
・ 委託訓練に２ヶ月休まずに通ったことで、通勤に対する自信がついた。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク館山 館山所求人・特別援助部門</p>
