<h1 align="center">障害者就労支援機関との求職者情報の共有</h1>
<h2>概要（ポイント）</h2>
<p>障害者就労支援機関との連携を密にし、求職者情報の共有、必要によりケース会議を実施するなど、的確な職業紹介に努める。また、ハローワーク利用者で就労支援が必要な者には支援機関登録を積極的に行っている。</p>
<h2>この取組による効果</h2>
<p>求職者の情報を共有することにより、委託訓練や職場実習も採り入れ、的確な職業紹介が図られている。また、支援機関登録者の就職後の職場定着指導には、支援機関職員が同行し効率的な職場適応指導が図られている。</p>
<h2>地域連携機関</h2>
<p>ハローワーク上野</p>
<h2>実施ハローワーク</h2>
<p>上野　公共職業安定所</p>
