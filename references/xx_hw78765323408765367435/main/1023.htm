<h1 align="center">障害者雇用事例リファレンスサービスの活用</h1>
<h2>概要（ポイント）</h2>
<p>　雇用率達成指導の際に、その企業と同じ業種である他企業の雇用事例を持参し紹介し、雇用を促している。</p>
<h2>この取組による効果</h2>
<p>　企業は他企業の動向を気にしているようであるので、特に大企業には効果があると思われる。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク大宮 求人企画部門</p>
