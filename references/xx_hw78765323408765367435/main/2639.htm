<h1 align="center">越谷市内在住の求職者に対し、越谷市就労支援センターを案内する。</h1>
<h2>概要（ポイント）</h2>
<p>希望者に対して面接同行やジョブサポートをつけることが出来る。
支援センターとの情報交換が出来る。</p>
<h2>この取組による効果</h2>
<p>ハローワークだけでは出来ない部分を支援してもらえるため、利用者の就職率、離職をふせぐことに大変効果がある。</p>
<h2>地域連携機関</h2>
<p>越谷就労支援センター</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク越谷</p>
