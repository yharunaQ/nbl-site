<title>特別支援教育機関 (雨竜高等養護学校) での生徒及び保護者に対するガイダンスの効果的な実施</title>

<h1 align="center">特別支援教育機関 (雨竜高等養護学校) での生徒及び保護者に対するガイダンスの効果的な実施</h1>
<h2>概要（ポイント）</h2>
<p>特別支援教育機関 (雨竜高等養護学校) での生徒及び保護者に対するガイダンスを実施する際、生徒の希望する就業地を管轄する安定所職員の派遣を要請し保護者を交えた職業相談を行う。</p>
<h2>この取組による効果</h2>
<p>生徒の希望する就業地を管轄する安定所職員との職業相談を行う機会を設け、顔の見える関係作りの一助とし、更に、より具体的な管内状況の説明などを行い、より的確な職業斡旋を実施できる。</p>
<h2>地域連携機関</h2>
<p>滝川公共職業安定所</p>
<h2>実施ハローワーク</h2>
<p>職業相談部門</p>
