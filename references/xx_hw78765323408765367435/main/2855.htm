<h1 align="center">求人情報の提供</h1>
<h2>概要（ポイント）</h2>
<p>知的障害授産施設との連携の中で就職希望者のニーズを把握しておき、求人が出た際に情報提供することで職場実習先の開拓や雇用先の確保に役立てている。</p>
<h2>この取組による効果</h2>
<p>求人が出されているタイムリーな時期に実習生の要請を行うことで障害者の受入れをしやすい状況が作れる。</p>
<h2>地域連携機関</h2>
<p>授産施設　あらかしの園</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク臼杵</p>
