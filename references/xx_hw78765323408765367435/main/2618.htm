<h1 align="center">福祉施設との連携のきっかけつくり</h1>
<h2>概要（ポイント）</h2>
<p>　障害者雇用連絡会議を開催し、管内すべての福祉施設の参加を求めた。
　障害者面接会参加希望者を施設より募り、登録し、チーム支援の対象者とした。</p>
<h2>この取組による効果</h2>
<p>　安定所のチーム支援について説明し、該当する求職者の登録をすすめた。</p>
<h2>地域連携機関</h2>
<p></p>
<h2>実施ハローワーク</h2>
<p>常陸大宮公共職業安定所</p>
