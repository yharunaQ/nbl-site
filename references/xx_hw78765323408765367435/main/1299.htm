<h1 align="center">一般求人への応募の際、各種援助措置について説明</h1>
<h2>概要（ポイント）</h2>
<p>障害者専用求人以外の求人へ障害者の方を紹介する際に、障害の状況及び配慮願いたい点についての説明に加え、障害者雇用に関する各種援助措置、特に障害者トライアル雇用事業、特定求職者雇用開発助成金制度を中心に説明し雇用機会の促進を図る。</p>
<h2>この取組による効果</h2>
<p>事業主の各種支援制度への理解が促進され、面接率が高まっていると思われる。</p>
<h2>実施ハローワーク</h2>
<p>和歌山労働局　ハローワーク串本出張所 和歌山労働局職業対策課</p>
