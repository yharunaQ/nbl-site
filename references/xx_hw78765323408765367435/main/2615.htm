<h1 align="center">個人情報の共有</h1>
<h2>概要（ポイント）</h2>
<p>障害者本人の同意の下、上記機関　キャリアカウンセラーと情報共有し、一体的な指導、助言を実施している。</p>
<h2>この取組による効果</h2>
<p>各機関の特色を生かし、ハローワークが求人開拓、地区センターが面接の練習、職務経歴書の指導等を実施。また、両機関が面接に同行したうえで、職場定着指導を連携して行うなど、障害者のみならず事業所からも信頼を得ている。</p>
<h2>地域連携機関</h2>
<p>いばらき就職支援センター　日立地区センター</p>
<h2>実施ハローワーク</h2>
<p>日立公共職業安定所</p>
