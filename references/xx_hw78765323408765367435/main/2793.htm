<h1 align="center">特別支援学校における職場実習報告会、学校ケース会議</h1>
<h2>概要（ポイント）</h2>
<p>特別支援学校における職場実習報告会に年２回、学校ケース会議に年３回出席している。</p>
<h2>この取組による効果</h2>
<p>障害者就業・生活支援センターや区役所等、各関係機関が集まり、在校生の就職へ向けての連携が計られている。
就職希望の生徒について、１年生の時から段階を踏んで話し合い問題を解決していくことで、個別の援助方針が立てやすい。</p>
<h2>地域連携機関</h2>
<p>小池特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>若松公共職業安定所</p>
