<h1 align="center">求人開拓時における事業所見学による情報収集</h1>
<h2>概要（ポイント）</h2>
<p>求人開拓のための職員が事業所を訪問し、職場見学を実施している。</p>
<h2>この取組による効果</h2>
<p>　職場を見学する機会があるので、障害者の就労可能職種を助言でき、求人開拓に結び付いている。
また、求職者を紹介する場合に、職種（職務内容）の説明がより詳細にでき、就職に結び付くことが増える。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク茂原 茂原所求人・特別援助部門</p>
