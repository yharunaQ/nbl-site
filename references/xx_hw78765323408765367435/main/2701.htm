<h1 align="center">「障害者職業訓練」の利用</h1>
<h2>概要（ポイント）</h2>
<p>施設利用している障害者（知的）が初めて就労を考えている際に、受け入れる事業所及び障害者本人の不安を和らげる意味で愛媛県が実施している「障害者委託訓練」を実施。
その際、愛媛県側だけでなく施設側スタッフが、随時障害者本人に付き添い業務のサポートを行った。</p>
<h2>この取組による効果</h2>
<p>施設のバックアップがあることにより、事業所側だけでなく障害者本人にとっても、当初考えていた就労に伴う不安感を解消できたと思われる。</p>
<h2>地域連携機関</h2>
<p>新居浜市社会福祉協議会（心身障害者作業所）</p>
<h2>実施ハローワーク</h2>
<p>新居浜公共職業安定所</p>
