<h1 align="center">障害者雇用企業のミニ見学会</h1>
<h2>概要（ポイント）</h2>
<p>管内の特例子会社に協力していただき、未達成企業担当者と職員で見学。企業に尻込みされないように、大げさな周知はせずに「ハローワークの職員も勉強しに行くのでご一緒しませんか」と電話や窓口で参加を勧めた。</p>
<h2>この取組による効果</h2>
<p>未達成企業２社・職員４名参加。
障害者雇用経験のなかった担当者が、知的・精神障害者に理解を示し、職域を拡げて求人を出してくれた。
職員も実際の雇用企業の苦労や工夫を知ることが出来た。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク藤沢 藤沢公共職業安定所　雇用指導官</p>
