<h1 align="center">求職者情報（総シス）をエクセルのフィルタ機能で検索機能を向上させ、マッチング等に活用</h1>
<h2>概要（ポイント）</h2>
<p>・ 所内のみ利用である。
・ 求職情報をエクセルのフィルタ機能などを使い、マッチング作業の効率化を図った。</p>
<h2>この取組による効果</h2>
<p>・ マッチングの絞込みにあたっては　作業効率がＵＰしている。
・ 登録情報が最新の現状となっているかどうかの情報の質が課題。アンケートなど状況調査方法を検討したい。</p>
<h2>実施ハローワーク</h2>
<p>佐賀労働局　ハローワーク佐賀 佐賀公共職業安定所</p>
