<h1 align="center">高齢・障害者雇用支援機構による障害者雇用事例リファレンスサービスの活用</h1>
<h2>概要（ポイント）</h2>
<p>求人開拓等に訪問する企業の業種に合わせた、リファレンスサービスの提供及び求職者情報の提供。</p>
<h2>この取組による効果</h2>
<p>同じ業種で障害者を雇用している企業があることを知ってもらうことにより、求職者情報にも興味を示し、具体的にアピールできる。</p>
<h2>実施ハローワーク</h2>
<p>福井労働局　ハローワーク三国 三国公共職業安定所</p>
