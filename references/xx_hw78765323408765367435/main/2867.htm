<h1 align="center">福祉施設等就労支援担当者会議の開催</h1>
<h2>概要（ポイント）</h2>
<p>福祉施設等の就労支援担当者に対して安定所の就労支援の現状・各種助成金制度等を説明、また、障害者就業・生活支援センターの支援状況を説明。
各種福祉施設の現在抱えている問題点等を意見交換もしている。</p>
<h2>この取組による効果</h2>
<p>安定所における就労支援の状況及び、各種助成金制度ｍ障害者就業・生活支援センターの就労支援の状況を理解していただけた。
新体系への移行済みの福祉施設の現在の問題点等を今後新体系へ移行する福祉施設にも情報共有できた。</p>
<h2>地域連携機関</h2>
<p>管内福祉施設
障害者就業・生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>特別援助部門</p>
