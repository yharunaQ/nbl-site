<h1 align="center">ハローワーク体験ツアー</h1>
<h2>概要（ポイント）</h2>
<p>就職希望生徒とその保護者を対象に、安定所の行うサービスや支援についての周知</p>
<h2>この取組による効果</h2>
<p>　求人検索機を使い、希望する求人などを検索させる等をして就職することへの意識付けの機会としている。
　見学終了後に、意見交換の場を設け、安定所への要望や就職における様々な不安や疑問等の把握、解消に努めている。</p>
<h2>地域連携機関</h2>
<p>銚子特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>銚子所求人・特別援助部門</p>
