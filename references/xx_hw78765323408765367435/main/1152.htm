<h1 align="center">障害者求職情報の活用</h1>
<h2>概要（ポイント）</h2>
<p>　雇用指導官の未達成企業の雇用率達成指導に同行し、障害者求職情報を活用して、求人開拓を行っている。
　助成金の活用やジョブコーチ支援等、各種支援制度の説明している。</p>
<h2>この取組による効果</h2>
<p>　事業主の障害者雇用への意識が促進され、障害者雇用に関する安定所への問い合わせが増加した。</p>
<h2>実施ハローワーク</h2>
<p>青森労働局　ハローワーク弘前 専門援助部門</p>
