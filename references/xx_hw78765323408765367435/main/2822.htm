<h1 align="center">養護学校生徒の実習時からの支援機関との連携</h1>
<h2>概要（ポイント）</h2>
<p>養護学校生徒の職場実習開始時から事業所への同行を行う等で地元支援センター（生活支援センター）に関わってもらい就労へ結びつくよう促す。</p>
<h2>この取組による効果</h2>
<p>生活面でも支援があることに事業所も安心感を持ち雇用に前向きとなった。</p>
<h2>地域連携機関</h2>
<p>養護学校、地域生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>立川公共職業安定所</p>
