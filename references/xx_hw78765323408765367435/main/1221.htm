<h1 align="center">求職者情報の作成</h1>
<h2>概要（ポイント）</h2>
<p>求職者本人から聴取した内容を基に月１回求職者情報を作成し、雇用指導官の事業所訪問時に活用している。</p>
<h2>この取組による効果</h2>
<p>以前作成していたものより内容をより詳細なものとしたことにより、事業所から分かりやすくなったとの意見をいただいている。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク若松 若松公共職業安定所</p>
