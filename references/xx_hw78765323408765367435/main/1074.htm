<h1 align="center">相談員による求人検索</h1>
<h2>概要（ポイント）</h2>
<p>障害部位や希望職種等の求職者情報に基づき、相談員が求人検索を実施し、求職者に情報提供を行う。</p>
<h2>この取組による効果</h2>
<p>求職者が来所時に即時に情報提供、紹介が行える。不採用等の場合でも、求職者の情報が蓄積されているため、次回からのより効果的なマッチングが可能となっている。</p>
<h2>実施ハローワーク</h2>
<p>大阪労働局　ハローワーク阿倍野 専門援助第２部門</p>
