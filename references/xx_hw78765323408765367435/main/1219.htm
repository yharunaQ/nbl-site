<h1 align="center">求職者情報の活用</h1>
<h2>概要（ポイント）</h2>
<p>求職者の経験や保持する資格、求職条件等を簡潔にまとめ、障害部位毎に編集した求職者情報を作成し、障害者求人開拓や雇用率達成指導等に活用している。</p>
<h2>この取組による効果</h2>
<p>障害者の雇用を検討している事業主に対して、求職者の情報を具体的に提供でき、マッチングに役立っている。
また、求職者情報を作成する際、あらかじめ見本を作成し求職者本人に確認させることによって、求職条件を再確認できる。さらに、求職者情報掲載の同意を得るとき、求職者の緊要度も量ることができる。</p>
<h2>実施ハローワーク</h2>
<p>福岡労働局　ハローワーク小倉 小倉公共職業安定所</p>
