<h1 align="center">企業訪問記録の共有化</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用相談、求人開拓実施状況等、事業所訪問の情報をデジタルデータで共有化。</p>
<h2>この取組による効果</h2>
<p>雇用指導官の雇用率未達成指導に当該情報を役立てることができる。
定期訪問による求職者情報の提供や過去の相談状況の確認により、効果的な相談ができる。
障害者専門支援員以外の訪問についても同一の記録票に追記しているため、重複した訪問が避けられる。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク成田 事業所援助部門</p>
