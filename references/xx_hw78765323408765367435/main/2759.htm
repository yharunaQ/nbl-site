<h1 align="center">支援学校で実施する職場実習について</h1>
<h2>概要（ポイント）</h2>
<p>実習先の情報提供はもとより、企業への実習依頼を先生と同行し訪問（必要に応じて企業への情報提供など）する。また、年３回ある実習では、先生と同行し生徒の状況確認・事業主との連携を密にしている。</p>
<h2>この取組による効果</h2>
<p>支援学校との連携がより深くなり、情報を共有でき問題が起これば早期に対応できるようになった。
　事業主にも当初からハローワークが関わっていることを認識してもらい、雇用後の定着指導にも効果的である。</p>
<h2>地域連携機関</h2>
<p>特別支援学校との連携</p>
<h2>実施ハローワーク</h2>
<p>木曽福島所</p>
