<h1 align="center">岐阜障害者職業センターとの連携強化</h1>
<h2>概要（ポイント）</h2>
<p>障害者求人開拓における職域開発事業所訪問から、個別ケース会議、職務試行法、雇用前ジョブコーチ支援の活用説明、同行面接なろ各種支援ツールを有効に活用するための定期的な情報交換の実施。
（ポイント）
各種支援ツール活用の両者の感覚的ズレを解消する。</p>
<h2>この取組による効果</h2>
<p>個々の情報の共有化が図られミスマッチが少なくなり、定着率・障害者、事業主の評価もよくなっている。</p>
<h2>実施ハローワーク</h2>
<p>岐阜労働局　ハローワーク美濃加茂 美濃加茂公共職業安定所</p>
