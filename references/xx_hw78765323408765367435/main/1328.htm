<h1 align="center">職場見学会の開催</h1>
<h2>概要（ポイント）</h2>
<p>知的障害者を対象とした雇用率算定企業への職場見学会を開催</p>
<h2>この取組による効果</h2>
<p>他安定所からの個別求人開拓要請をきっかけとして計画。せっかくの機会を生かすため福祉施設、障害者就業・支援センター利用者など幅広に対象者を募り実施。障害者自身も企業訪問の機会も少ないことから一般就労への啓蒙、社会勉強に生かされた。また、福祉施設職員は見学先企業とのその後の顔つなぎとなった。なお、見学会後、個別選考を経て1名採用に結びついた。</p>
<h2>実施ハローワーク</h2>
<p>新潟労働局　ハローワーク妙高 妙高所　職業紹介部門</p>
