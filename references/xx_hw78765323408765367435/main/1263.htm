<h1 align="center">職業相談を行う際のチェックリストの作成（精神、知的（一般・学卒））</h1>
<h2>概要（ポイント）</h2>
<p>別紙チェックリストを適宜活用し、本人及び支援者が同行の場合は支援者にも記入していただき、職業相談・紹介の際の参考としている。
（ポイント）
就労への意識だけでなく、生活面の状況も把握できる。</p>
<h2>この取組による効果</h2>
<p>あいさつ等最低限就労の際必要な生活面の状況も把握でき、そこも含めた職業指導ができる。
また、職業紹介時においても基本的な労働習慣面を把握していることにより、自信を持って事業主に紹介できる。</p>
