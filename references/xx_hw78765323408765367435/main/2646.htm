<h1 align="center">施設を訪問しての求職者の把握と職業相談の実施</h1>
<h2>概要（ポイント）</h2>
<p>福祉施設との連携の強化と潜在的な求職者の掘り起こしを図るため、施設を訪問し職業相談を実施している。</p>
<h2>この取組による効果</h2>
<p>ハローワークに求職登録していない求職者や離職後に相談に訪れない求職者の把握による一般就労の促進と、就労移行支援事業者の一般就労に対する不安の払拭と入・通所者の励みに繋がっている。</p>
<h2>地域連携機関</h2>
<p>ユーホップ（就労移行支援事業者）</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク横手</p>
