<h1 align="center">社会適応訓練事業運営協議会に参加</h1>
<h2>概要（ポイント）</h2>
<p>　保健所が運営する社会適応訓練事業の運営協議会に参加し、その中で就労に結びつくケースが生じた場合、ハローワークの制度を使ったフォローを行なう。</p>
<h2>この取組による効果</h2>
<p>　まだ、訓練事業の中で一般就労に結びつくケースは少ないが、今後の訓練の様子を見守る中で、そのような事例が生じた場合、適切に対応したい。</p>
<h2>地域連携機関</h2>
<p>対馬保健所</p>
<h2>実施ハローワーク</h2>
<p>対馬</p>
