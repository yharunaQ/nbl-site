<h1 align="center">求人開拓時の同席</h1>
<h2>概要（ポイント）</h2>
<p>１．業務内容が紹介予定である障害者が可能なものであるか、また、障害者の能力に合わせた条件での求人になるよう条件緩和ができる。</p>
<h2>この取組による効果</h2>
<p>１．生活面でも障害者の状況を把握しているため、就業と両立できる働き方となるようその場で相談が出来る。また、作業所での作業・訓練状況を把握しているので、出来る仕事、出来ない仕事を事業主に伝え条件緩和のお願いが出来る。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活支援センター（よりそい）</p>
<h2>実施ハローワーク</h2>
<p>牟岐公共職業安定所</p>
