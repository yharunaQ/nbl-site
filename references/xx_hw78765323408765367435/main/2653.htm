<h1 align="center">就労支援センターとの連携による就職支援</h1>
<h2>概要（ポイント）</h2>
<p>地域の就労支援センターとの連携により障害者の雇用を検討している事業主に、就労意欲の高い障害者（主に知的障害者）を紹介し、職場見学の実施、職場実習を実施し、常用雇用に結びつくトライアル雇用を斡旋する。</p>
<h2>この取組による効果</h2>
<p>地域の会社事情に精通している就労支援センターとの連携により、より幅広く障害者の就職に結びつく効果がある。</p>
<h2>地域連携機関</h2>
<p>ひらつか生活・就労支援センター</p>
<h2>実施ハローワーク</h2>
<p>平塚公共職業安定所　　専門援助部門</p>
