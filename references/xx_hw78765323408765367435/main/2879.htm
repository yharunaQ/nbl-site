<h1 align="center">一般就労を希望している者と施設相談員と障害者担当者の三者においてケース会議を行い、その後、職業相談の実施しと求人情報の提供等を行っている。</h1>
<h2>概要（ポイント）</h2>
<p>雇用率未達成事業所を中心に求人の確保に努める。</p>
<h2>この取組による効果</h2>
<p>支援ツール等の情報の効果的な提供及び活用を図る。</p>
<h2>地域連携機関</h2>
<p>知的障害者更生施設（通所）　城西の杜</p>
<h2>実施ハローワーク</h2>
<p>野辺地公共職業安定所</p>
