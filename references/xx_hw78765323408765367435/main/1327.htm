<h1 align="center">求人情報の提供について</h1>
<h2>概要（ポイント）</h2>
<p>安定所庁舎内待合室のお持ち帰りコーナーに、当所及び他所からの障害者専用求人、求人情報をコピーし、持ち帰り可能な状態にして提供している。</p>
<h2>この取組による効果</h2>
<p>定期的に来所し、情報を得て帰られる求職者の方がおります。また、窓口にも内容確認をしてくるケースがあります。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク苫小牧 苫小牧公共職業安定所</p>
