<h1 align="center">　福祉施設を訪問し、施設の概要、入所者の能力を把握するとともに、職員との名前・顔をお互い知り緊密な関係を作り、就労に近い入所者を新規に障害者登録し各種就労支援を行い就職に結びつける。

</h1>
<h2>概要（ポイント）</h2>
<p>　施設への訪問により「顔の見える関係」を築き、障害者センターに来所の折にも当安定所に顔を出してもらい、お互いの意見交換を行い、新規求職登録及び職業相談等を行っている。</p>
<h2>この取組による効果</h2>
<p>　多くの施設入所者を新規登録し、就職に結び付けている。</p>
<h2>地域連携機関</h2>
<p>福祉施設（就労移行支援事業者）</p>
<h2>実施ハローワーク</h2>
<p>千葉南所専門援助部門</p>
