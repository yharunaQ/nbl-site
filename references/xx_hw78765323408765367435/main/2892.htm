<h1 align="center">情報共有シートの活用</h1>
<h2>概要（ポイント）</h2>
<p>小樽後志地域障がい者就業・生活支援センターで支援していた障害者で、当所に新規求職登録を行う場合において、本人の了解のもとセンターから情報共有シートなどの提供を受け、職業相談などに活用している。</p>
<h2>この取組による効果</h2>
<p>精神障害者の場合に、職歴、発病の経過、現在の状況などが記載されており、また、発達障害者などで障害者職業センターにおいて検査を受けている場合は評価結果も提供していただき、相談・紹介の際に参考となっている。</p>
<h2>地域連携機関</h2>
<p>小樽後志地域障がい者就業・生活支援センターひろば</p>
<h2>実施ハローワーク</h2>
<p>小樽公共職業安定所</p>
