<h1 align="center">求職者へのDM発送</h1>
<h2>概要（ポイント）</h2>
<p>求職登録している求職者に対し、新規求人票とのマッチング作業を日々行い、広範に求職者にダイレクトメールを発送している。</p>
<h2>この取組による効果</h2>
<p>求職者個人だけではなく、授産施設等にも送付していることから、授産施設側でのマッチングにより面接に結びつくケースがある。

障害をお持ちの求職者においては、来所するだけでも負担になる場合があるので、その軽減にもつながる。</p>
<h2>実施ハローワーク</h2>
<p>山梨労働局　ハローワーク塩山 障害者職業相談担当</p>
