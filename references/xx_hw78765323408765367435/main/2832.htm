<h1 align="center">効果的な同行紹介</h1>
<h2>概要（ポイント）</h2>
<p>・必要に応じて各関係機関と連携し、求職者の現状を把握する。また、関係機関（福祉施設、支援センター等）担当者と面接に同行する。
・特別支援学校の職場実習について、事業所訪問時に協力依頼。</p>
<h2>この取組による効果</h2>
<p>･各関係機関の担当者と面接に同行し、何らかのときはすぐに連携し対応できる体制であることを伝えることで、採用に直結する。
・特別支援学校の進路担当者と連携をとることで、実習成果により、障害者雇用の理解と雇用の機会を創出することができる</p>
<h2>地域連携機関</h2>
<p>伊勢志摩障害者就業・生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>伊勢公共職業安定所</p>
