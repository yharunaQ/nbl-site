<h1 align="center">東広島市発達障害支援連絡調整会議</h1>
<h2>概要（ポイント）</h2>
<p>　発達障害児（者）に対するライフステージに応じた支援のあり方等について検討し、地域における支援体制整備に資することを目的としている。</p>
<h2>この取組による効果</h2>
<p>発達障害にかかる他機関の取組状況や関係情報を得ることができる。</p>
<h2>地域連携機関</h2>
<p>社会福祉法人　つつじ</p>
<h2>実施ハローワーク</h2>
<p>広島西条公共職業安定所</p>
