<h1 align="center">面接時に求職者と同行</h1>
<h2>概要（ポイント）</h2>
<p>同行面接により、求職者の障害の態様や、就労可能な職種等を事業主に説明する。</p>
<h2>この取組による効果</h2>
<p>直接説明する事により、障害者への理解が深まり、又、各種助成金制度の説明を併せて説明できる為、雇用に結びつく可能性が高くなる。</p>
<h2>実施ハローワーク</h2>
<p>山口労働局　ハローワーク下関 下関公共職業安定所</p>
