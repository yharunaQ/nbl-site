<h1 align="center">職場実習中のハローワーク職員による事業所訪問</h1>
<h2>概要（ポイント）</h2>
<p>養護学校高等部２，３年生の職場実習の際、学校教諭と共に、安定所職員や就労援助センター職員が同行。実習をしている生徒を激励すると共に、実習先事業主に対し安定所における就職支援について説明する。</p>
<h2>この取組による効果</h2>
<p>雇用後の各種助成金、雇用率の話をハローワーク職員からすることで、事業主の採用意欲が高まった。</p>
<h2>地域連携機関</h2>
<p>県立瀬谷養護学校、県立三ツ境養護学校、県央地域就労援助センター　他</p>
<h2>実施ハローワーク</h2>
<p>大和公共職業安定所　　就職促進指導官</p>
