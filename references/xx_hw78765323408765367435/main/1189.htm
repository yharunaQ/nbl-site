<h1 align="center">求人情報一覧表の提供</h1>
<h2>概要（ポイント）</h2>
<p>障害者専用求人について一覧表として取りまとめ、求職者へ情報を提供している。
また、各就労支援施設に対しても情報を提供することにより、自所で抱えている利用者への情報提供をしていただくことにより掘り起こし等に利用していただいている。</p>
<h2>この取組による効果</h2>
<p>求職者が自宅でもじっくり見て検討することが出来ること。事前に検討してきていただくことにより具体的に相談が出来ること。
　就労支援施設においても、支援員とのやり取りの中でスムーズな紹介が出きること。</p>
<h2>実施ハローワーク</h2>
<p>静岡労働局　ハローワーク浜松 浜松</p>
