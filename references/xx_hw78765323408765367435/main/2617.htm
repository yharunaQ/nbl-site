<h1 align="center">養護学校高等部卒業予定者に対し雇用保険について説明</h1>
<h2>概要（ポイント）</h2>
<p>ハローワーク職場見学時に先生より要請をうけ、生徒に対し雇用保険についての説明を行った。</p>
<h2>この取組による効果</h2>
<p>就職し初めて加入する保険であるが、どのように利用するのか理解されていない面があった。生徒には難しい内容であったが、ハローワーク・仕事探し・雇用保険について印象づけることができたと思える。</p>
<h2>地域連携機関</h2>
<p>茨城県立結城養護学校</p>
<h2>実施ハローワーク</h2>
<p>古河公共職業安定所</p>
