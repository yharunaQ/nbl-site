<h1 align="center">障害者求職情報の作成</h1>
<h2>概要（ポイント）</h2>
<p>障害者求職情報を２ヶ月ごとに作成し、雇用率未達成企業の求人開拓に活用している。

（ポイント）　具体的な求職者情報を事業所に提示することにより、障害者雇用を考えるきっかけにしてもらう。</p>
<h2>この取組による効果</h2>
<p>具体的な求職者情報を見ることにより、どういう求人であれば障害者雇用に結びつきやすいのか考えることができ、障害者求人の条件を実情に即した物にしやすくなる。</p>
<h2>実施ハローワーク</h2>
<p>茨城労働局　ハローワーク龍ヶ崎 龍ヶ崎公共職業安定所</p>
