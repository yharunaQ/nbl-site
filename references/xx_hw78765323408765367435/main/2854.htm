<h1 align="center">ハローワーク、障害者就業・生活支援センターの情報・相談内容等の共有</h1>
<h2>概要（ポイント）</h2>
<p>ハローワーク登録者には障害者就業・生活支援センターの登録を推奨、職業・生活支援センター登録者で一般就労可能な者はハローワークの登録を推奨。本人の同意を得て情報を交換している。</p>
<h2>この取組による効果</h2>
<p>お互い情報を交換することで、相談の際の材料が増え同じことを本人が2つの機関に説明するなどの無駄を省くことができる。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活支援センター「はぎの」</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク日田</p>
