<h1 align="center">障害者求人情報の定期的な提供</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用連絡会議の対象施設に対して、定期的に障害者求人情報を提供している。</p>
<h2>この取組による効果</h2>
<p>求人情報を提供することにより、施設担当者が利用者の中で応募希望者あるいは応募可能者の選定・把握ができ、利用者本人に対しても就労意識を高める効果が期待できる。</p>
<h2>地域連携機関</h2>
<p>福祉施設</p>
<h2>実施ハローワーク</h2>
<p>甲府公共職業安定所</p>
