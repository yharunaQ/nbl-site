<h1 align="center">求職者の現況・希望等を出来るだけ詳細に記録することにより、その人とな
りを部門全体で把握し、良質求人の出た時に管理選考の対象としている。
雇用指導官と求職者の情報を共有し、事業主指導の際に求人開拓につなげる。
</h1>
<h2>概要（ポイント）</h2>
<p>障害者のことを出来るだけ理解していくことが肝要なので、特に工夫しているということではなく、日常の業務の中での一つの作業として努力しているということ。</p>
<h2>この取組による効果</h2>
<p>良質求人の出た時に管理選考が出来ること。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク横浜 横浜公共職業安定所　専門援助部門</p>
</body><html>
