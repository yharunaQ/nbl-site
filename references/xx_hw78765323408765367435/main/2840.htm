<h1 align="center">豊橋障害者就業・生活支援センター拡大ケース会議等への参加</h1>
<h2>概要（ポイント）</h2>
<p>就業・生活支援センターの支援対象者の状況を関係機関が共有し、連携をより強化する為、年に数次、行われる拡大ケース会議への出席、実習・トライアル雇用時に行うケース会議への出席に随時対応している。</p>
<h2>この取組による効果</h2>
<p>情報共有による効果的支援の実施、対応に統一性をもたせることが可能で、個別対応では、迅速に支援の組み立てを行い、タイミングを逃がすことなく問題解決を行える。</p>
<h2>地域連携機関</h2>
<p>豊橋障害者就業・生活支援センター</p>
<h2>実施ハローワーク</h2>
<p>豊橋所　専門援助部門</p>
