<h1 align="center">支援対象者の情報交換</h1>
<h2>概要（ポイント）</h2>
<p>常日頃から連絡を密にし、面談や電話等により、支援対象者を確認し、その状況を把握、共有することとしている。
また、紹介の際も、安定所及び福祉施設の同行紹介を基本としている。</p>
<h2>この取組による効果</h2>
<p>支援対象者を把握することで、求人受理や求人開拓の際、その情報を念頭に置き、マッチングに役立てている。
また、同行紹介することで、それぞれの役割に応じて、支援対象者を求人者に理解してもらえるよう努めている。</p>
<h2>地域連携機関</h2>
<p>春ヶ丘学園、きく通勤寮、優和園、浅野社会復帰センター</p>
<h2>実施ハローワーク</h2>
<p>小倉公共職業安定所</p>
