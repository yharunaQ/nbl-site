<h1 align="center">行政の支援内容等障害者雇用に関する平易な案内書の活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用に関する基本的な知識や情報をはじめ、行政機関の支援メニューが簡単にわかるリーフレット（別添）を作成し、事業所が集まる会議の場や安定所窓口、訪問指導時に広く活用。</p>
<h2>この取組による効果</h2>
<p>　分厚い冊子や細かい資料を手交しても、あまり読んでもらえなかったようだが、平易でわかりやすい内容にしたため手軽に説明ができて、目を通してもらえるようになった。　指導・支援の初期段階では特に有効。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワーク船橋 船橋所雇用・企画部門</p>
