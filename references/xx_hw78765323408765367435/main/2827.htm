<h1 align="center">効果的な事業所訪問の実施</h1>
<h2>概要（ポイント）</h2>
<p>障害者の雇用を考えている事業所を、ハローワークと障害者地域生活センターで同行訪問をし、仕事内容の説明を受け職場見学をして障害者の仕事内容について理解を深めている。</p>
<h2>この取組による効果</h2>
<p>職場見学をすることにより仕事内容の理解が深まり、求人内容についても確認ができ、ハローワークと障害者地域生活センターで話し合い、求職者との的確なマッチングを図ることができる。</p>
<h2>地域連携機関</h2>
<p>十日町公共職業安定所</p>
<h2>実施ハローワーク</h2>
<p>就職相談部門</p>
