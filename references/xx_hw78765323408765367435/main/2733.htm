<h1 align="center">　
職場実習の受け入れ
</h1>
<h2>概要（ポイント）</h2>
<p>　管内特別支援学校（沖縄高等養護学校）から2年生の職場実習の受け入れをした。</p>
<h2>この取組による効果</h2>
<p>　就職の準備段階においての支援を行うとともに、ハローワークにおいて知的障害者採用の為のノウハウの蓄積が図れる。</p>
<h2>地域連携機関</h2>
<p>特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>沖縄所</p>
