<h1 align="center">障害者雇用訪問指導記録兼雇用可能職域調査票の作成について</h1>
<h2>概要（ポイント）</h2>
<p>・雇用可能な職域や事業所の理解度などを同一の項目で聞き取りができ、どの職員が訪問しても、必要なグラフで視覚的にもわかるように工夫している。</p>
<h2>この取組による効果</h2>
<p>・今年度雇用指導官により作成。事業所訪問時に活用を始めたところである。</p>
