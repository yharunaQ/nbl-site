<h1 align="center">重点的に就職支援を行っていく対象者を選定し、相談、求人開拓を集中的に行っていく</h1>
<h2>概要（ポイント）</h2>
<p>毎月4～５名、緊要度等により、重点的に就職支援を行っていく対象者を選定し、相談、求人開拓を集中的に行っていく</p>
<h2>この取組による効果</h2>
<p>集中的に支援を行うことによって一定の効果が上げられる。</p>
<h2>実施ハローワーク</h2>
<p>佐賀労働局　ハローワーク武雄 武雄公共職業安定所</p>
