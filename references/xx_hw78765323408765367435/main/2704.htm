<h1 align="center">養護学校生徒の現場実習のビデオ撮影について</h1>
<h2>概要（ポイント）</h2>
<p>生徒の現場実習について、担当教諭がその様子をビデオ撮影を行い、簡単な解説を付け、現場実習懇談会にて報告して頂いている。</p>
<h2>この取組による効果</h2>
<p>現場実習先が卒業後の就職先となることも多く、就職斡旋を行う安定所としても、生徒の実習の様子を見ることはとても参考になる。</p>
<h2>地域連携機関</h2>
<p>大洲公共職業安定所</p>
<h2>実施ハローワーク</h2>
<p>大洲公共職業安定所</p>
