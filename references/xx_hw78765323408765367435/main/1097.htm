<h1 align="center">A　面接時における同行訪問
B　求職者への求人票送付
C　職場適応支援
</h1>
<h2>概要（ポイント）</h2>
<p>A　障害の部位により、必要に応じて面接へ同行する。（特に聴覚・知的）
B　福祉工場（精神）からの求人に対しては、該当登録者に求人票を送付している。
C　特に、コミュニケーションがとりにくい聴覚障害者に対して、手話協力員との同行で職場適応指導を実施している。</p>
<h2>この取組による効果</h2>
<p>いずれも、それ相応の効果はあると思われる。</p>
<h2>実施ハローワーク</h2>
<p>愛媛労働局　ハローワーク八幡浜 八幡浜公共職業安定所</p>
