<h1 align="center">２　雇用率未達成事業所に対する訪問指導</h1>
<h2>概要（ポイント）</h2>
<p>　障害者雇用状況報告書において雇用率未達成の事業所に対して事業所訪問により障害者雇用を検討していただくように依頼した。
　平成１９年度訪問事業所は２６か所。</p>
<h2>この取組による効果</h2>
<p>　事業所に障害者雇用の意識を持っていただくことで、障害者求人の提出や面接会への参加に結び付いた。</p>
<h2>実施ハローワーク</h2>
<p>鹿児島労働局　ハローワーク国分 国分所</p>
