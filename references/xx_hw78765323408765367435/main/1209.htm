<h1 align="center">求職情報一覧の作成</h1>
<h2>概要（ポイント）</h2>
<p>障害部位、等級、希望条件、動作制限、経験・アピールをまとめた求職者情報を作成し、未達成企業訪問時などの求人開拓等に利用している。</p>
<h2>この取組による効果</h2>
<p>障害者の具体的な能力、特性、経験をご理解頂けるため、障害者採用の具体的検討がお願いできる。</p>
<h2>実施ハローワーク</h2>
<p>滋賀労働局　ハローワーク大津 大津公共職業安定所</p>
