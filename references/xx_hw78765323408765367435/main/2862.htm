<h1 align="center">養護学校との継続的な連携と支援</h1>
<h2>概要（ポイント）</h2>
<p>高等部2年生を対象に事業所見学、高等部3年生を対象に就職希望者の個別相談（模擬面接）障害者職業センター職業評価、障害者訓練校案内、実習先開拓、自行書への助成金等の説明、紹介、定着指導、訓練生、卒業生への相談</p>
<h2>この取組による効果</h2>
<p>高等部2年生時から継続的に支援することにより、生徒の職業意識を徐々に形成することができる、ハローワークの業務についての理解を深めるころにつながると考える。</p>
<h2>地域連携機関</h2>
<p>和歌山県立きのかわ養護学校</p>
<h2>実施ハローワーク</h2>
<p>和歌山県労働局職業対策課</p>
