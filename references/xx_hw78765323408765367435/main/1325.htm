<h1 align="center">求職者情報の積極的な提供について</h1>
<h2>概要（ポイント）</h2>
<p>事業主に求人要請を行う際に、求職者の情報（障害の種類、部位、程度、性別、年齢、居住地等）を積極的に提供している。
また、状況によっては個人が特定されないように配慮しつつ、職歴や本人の希望、また本人の現状を説明し、応募機会の拡大に努めている。</p>
<h2>この取組による効果</h2>
<p>就職件数が大幅に伸びることはないものの、応募機会の拡大には一定の効果があった。</p>
<h2>実施ハローワーク</h2>
<p>北海道労働局　ハローワーク留萌 留萌所</p>
