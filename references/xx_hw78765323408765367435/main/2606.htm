<h1 align="center">特別支援学校との連携</h1>
<h2>概要（ポイント）</h2>
<p>地域の特別支援学校との連携は業務推進のためには不可欠であり、様々な機会を捉えて連携をもっている。
・職場実習生の受け入れ
・生徒・保護者を対象とした四者面談の実施
・職場（ハローワーク）見学会
・養護学校卒業生の就職相談（ケース会議）</p>
<h2>この取組による効果</h2>
<p>福祉的就労から一般雇用への就労移行支援を行うケースでは、良きアドバイザー的存在であり、その他安定所における支援についての理解の促進を図ることができた。</p>
<h2>地域連携機関</h2>
<p>青森県立森田養護学校高等部</p>
<h2>実施ハローワーク</h2>
<p>五所川原公共職業安定所</p>
