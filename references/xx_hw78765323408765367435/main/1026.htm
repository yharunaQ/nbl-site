<h1 align="center">障害者関係事業所訪問指導の際に障害者職業紹介担当が同行</h1>
<h2>概要（ポイント）</h2>
<p>事業主指導担当雇用指導官が事業所を訪問する際に障害者職業紹介担当が同行し、ハローワークに登録している障害者の状況や各種事業所に対する支援の説明を行った。</p>
<h2>この取組による効果</h2>
<p>　障害者雇用への理解が促進し、定着等障害者雇用に関する不安や課題に対するアドバイスを行い、周知できていない各種制度の利用促進を行うことが出来る。
　また、障害者面接会への参加要請や実習先の開拓等も容易に行うことが出来る。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク所沢 ハローワーク所沢</p>
