<h1 align="center">
連携した求人開拓の実施
</h1>
<h2>概要（ポイント）</h2>
<p>就業･生活支援センターや特別支援学校が実習をした企業にセンターや学校職員に同行し、各種支援制度の説明等をし、求人開拓に努めている。</p>
<h2>この取組による効果</h2>
<p>実習を受け入れた事業所は、実習生と顔なじみになっていることから、採用になる可能性が高い。</p>
<h2>地域連携機関</h2>
<p>
群星障害者就業・生活支援センター　との連携
</p>
<h2>実施ハローワーク</h2>
<p>那覇職安</p>
