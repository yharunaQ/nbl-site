<h1 align="center">・　年度始めに各保険センターを訪問</h1>
<h2>概要（ポイント）</h2>
<p>　異動後の担当者と顔合わせを行い、労働サイドの施策等の情報提供をしている。
　併せて、保健センターからは、自立支援法で変わったこと等の情報提供を受けている。</p>
<h2>この取組による効果</h2>
<p>　「顔の見える関係」を作っておくことによって、個別ケースでの連携がスムーズにできる。
　例えば、ある求職者について連携して、社会適応訓練事業所を開拓し、その人の支援は、社適　→　雇用に移行後も連携して行っている。</p>
<h2>地域連携機関</h2>
<p>管内の各保健センターを（東区、南区、安芸区）</p>
<h2>実施ハローワーク</h2>
<p>広島東公共職業安定所</p>
