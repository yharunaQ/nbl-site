<h1 align="center">就業への意識を高める</h1>
<h2>概要（ポイント）</h2>
<p>障害者の就業に対する意識が低い場合、どんなことが一般就労に必要かを箇条書きにしたものを、本人や保護者に渡し考えてもらう。</p>
<h2>この取組による効果</h2>
<p>漠然と就職を考えていた障害者に対し、就労に対して考え直すきっかけとなり、就職を目指す人には努力につながる。</p>
