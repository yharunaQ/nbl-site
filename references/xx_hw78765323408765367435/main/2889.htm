<h1 align="center">就職促進</h1>
<h2>概要（ポイント）</h2>
<p>ハローワークに出ている求人に対して、即就業というかたちをとらず、「すてっぷ」が1週間程度の職場体験をコーディネートして、ハローワークとの連携をとり、求職者の適性をみて、就職にむすびつけている。</p>
<h2>この取組による効果</h2>
<p>事業主に障害者の能力を知ってもらうことによって、理解を深めてもらい就職にむすびつけている。また、本人も仕事に適応しやすくなる。</p>
<h2>地域連携機関</h2>
<p>社会福祉法人侑愛会　函館障がい者就業・生活支援センターすてっぷ</p>
<h2>実施ハローワーク</h2>
<p>ハローワーク函館</p>
