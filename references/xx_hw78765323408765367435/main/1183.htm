<h1 align="center">月１回の関係機関による連絡会議、及び、
必要に応じたケース会議の開催</h1>
<h2>概要（ポイント）</h2>
<p>各機関からの情報を得ることができ、事業主に対し障害者の雇用、職場定着に対応できる。また、求職者については、情報の共有ができ雇用前・後の支援がスムースに対応できる。</p>
<h2>この取組による効果</h2>
<p>問題発生から早期に対応でき、必要な支援を必要な機関につなげることができる。（どの機関に連絡が行っても横のつながりがあり相互に対応できる）</p>
<h2>実施ハローワーク</h2>
<p>長野労働局　ハローワーク木曽福島 木曽福島</p>
