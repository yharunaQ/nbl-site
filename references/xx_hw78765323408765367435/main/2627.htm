<h1 align="center">障害者就労支援計画の活用</h1>
<h2>概要（ポイント）</h2>
<p>求職申込時に、支援計画期間、ハローワークでの支援事項、福祉施設での支援事項を支援計画にとりまとめ、本人より署名のうえ、連携により支援開始。常に連絡を取り合い、協力関係を得ている。</p>
<h2>この取組による効果</h2>
<p>新たな課題が発生した場合、求人や訓練、障害者支援の情報がでた場合、常に連絡を取り合い、その求職者にあう支援を提供することにより、福祉施設、求職者、求人者とのより良い信頼関係を築きつつある。</p>
<h2>地域連携機関</h2>
<p>就労移行支援事業者　ワークス　しんあい</p>
<h2>実施ハローワーク</h2>
<p>川越</p>
