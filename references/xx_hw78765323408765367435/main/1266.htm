<h1 align="center">・同行紹介
・求職者情報リストの活用</h1>
<h2>概要（ポイント）</h2>
<p>･知的・精神障害者の面接には同行している。
・求職者情報リストについては、雇用指導官と情報交換をしながら、雇用率未達成事業所の求人開拓に活用している。</p>
<h2>この取組による効果</h2>
<p>・面接に同行することにより、各種支援（訓練・トライアル雇用・ジョブコーチ・助成金制度）の説明もでき、採用となるケースが多い。
・求人開拓時に、求職者情報リストを活用し、上記同様各種支援の説明をすることで、雇用促進につながる。</p>
<h2>実施ハローワーク</h2>
<p>三重労働局　ハローワーク伊勢 伊勢公共職業安定所</p>
