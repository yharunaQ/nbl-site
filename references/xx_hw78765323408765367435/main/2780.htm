<h1 align="center">関係機関によるＷｅｂサイトを立ちあげ、グループウェアを利用した情報の共有化を図る。</h1>
<h2>概要（ポイント）</h2>
<p>今までは、関係機関とのケース会議などの連絡調整はＦＡＸや電話が中心であった為、関係者全員のスケジュールの把握に時間がかかった。</p>
<h2>この取組による効果</h2>
<p>グループウェアを利用することで、関係者のスケジュールの把握が容易になり、調整がスムーズに行えたり、会議の資料もペーパーレス化が図られた。</p>
<h2>地域連携機関</h2>
<p>甲賀地域各関係機関</p>
<h2>実施ハローワーク</h2>
<p>甲賀公共職業安定所</p>
