<h1 align="center">上記センター支援者に対する継続支援</h1>
<h2>概要（ポイント）</h2>
<p>上記センターにおいて、職業評価や職業準備支援を行った障害者のその後の帰趨状況を定期的に連絡する（ひな型有）</p>
<h2>この取組による効果</h2>
<p>上記センターにおいても、就労支援を行った者に対するその後の帰趨状況を確認し必要な就労支援を検討する必要があり、特に、求職活動に行き詰まった者に対して、改めてケース会議を行う等、継続した支援が期待できる。</p>
<h2>地域連携機関</h2>
<p>地域障害者職業センター</p>
