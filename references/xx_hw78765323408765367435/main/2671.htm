<h1 align="center">一般就労希望者の的確な把握、施設への訪問</h1>
<h2>概要（ポイント）</h2>
<p>福祉施設と連携し、一般就労移行希望者がいる場合、施設へ訪問。</p>
<h2>この取組による効果</h2>
<p>施設へ訪問し、本人と面談することによって、就労へ向けた的確な一連の支援を実施することができる。</p>
<h2>地域連携機関</h2>
<p>（社福)若狭つくし会（就労移行支援事業）
（社福）Cﾈｯﾄふくい（　　　〃　　　　）
</p>
<h2>実施ハローワーク</h2>
<p>小浜公共職業安定所</p>
