<h1 align="center">求職者情報シートの活用</h1>
<h2>概要（ポイント）</h2>
<p>　求職公開を希望する求職者に、職歴、アピールポイント等、求職公開申込書を記入させ、登録。
　求人者より障害者雇用で相談があった場合、求職者情報シートを閲覧させ、事業所からのリクエスト等に対応。</p>
<h2>この取組による効果</h2>
<p>　求人者に対して、ハローワーク登録の障害求職者に対する理解の一助になっているものと思われる。
　求職者に対して、ハローワークのサービスの一環として案内しており、求人者への自己アピールのツールとして、求職活動の一助になっているものと思われる。</p>
<h2>実施ハローワーク</h2>
<p>埼玉労働局　ハローワーク川越 川越</p>
