<h1 align="center">
事業主への支援ツールの効果的な提供
</h1>
<h2>概要（ポイント）</h2>
<p>　障害者を雇用していただく際に活用できる支援内容について、Ａ４サイズ１枚にまとめた「就職支援プログラム」を作成し配布している。</p>
<h2>この取組による効果</h2>
<p>　障害者を採用する際の各種支援策をＡ４サイズ１枚に解りやすくまとめることで、求人開拓や同行紹介での事業所側への説明に役立っている。</p>
<h2>実施ハローワーク</h2>
<p>沖縄労働局　ハローワーク名護 名護所</p>
