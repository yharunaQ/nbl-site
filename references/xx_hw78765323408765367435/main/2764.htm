<h1 align="center">岡谷・諏訪地域障害者雇用連絡会議</h1>
<h2>概要（ポイント）</h2>
<p>ハローワークが中心となり構成機関との連絡会議を行う。</p>
<h2>この取組による効果</h2>
<p>各市町村・医療機関・地方事務所・保健所・福祉事務所・養護学校・障害者職業センター・障害者雇用支援センター・障害者自立支援センター・監督署等の関連機関との質疑・意見交換を行うことにより、現状の把握や支援においての連携を密にできる。</p>
<h2>地域連携機関</h2>
<p>諏訪・岡谷管内関係各機関</p>
<h2>実施ハローワーク</h2>
<p>諏訪公共職業安定所</p>
