<h1 align="center">各関係機関との連携の強化</h1>
<h2>概要（ポイント）</h2>
<p>求職者、求人事業主の各情報を相互に提供しあい、情報の共有化を図っている。
　各関係機関相互の連絡を密にし、即時対応を図っている。
　求職者には各関係機関への個人情報提供の同意を得ている。</p>
<h2>この取組による効果</h2>
<p>各関係機関が情報の共有化をすることにより、共通の認識の基で対応ができるようになった。
　連携を密にすることにより、臨機応変な対応ができるようになった。</p>
<h2>地域連携機関</h2>
<p>たちばな会就業・生活支援センター、各福祉施設等、各特別支援教育機関他</p>
<h2>実施ハローワーク</h2>
<p>伊万里公共職業安定所</p>
