<h1 align="center">一般求人事業所への職場見学</h1>
<h2>概要（ポイント）</h2>
<p>一般求人事業所に電話で障害者だと伝えると面接を断られるケースが多いため、まず、職場見学を依頼し了解を得た場合障害者と同行する。</p>
<h2>この取組による効果</h2>
<p>事業所側の障害者に対する理解の促進、また障害者側には職場見学による求人票には表れない事業所のイメージ、職務内容等を確認することが出来る。</p>
<h2>実施ハローワーク</h2>
<p>青森労働局　ハローワーク三沢 求人・専門援助部門</p>
