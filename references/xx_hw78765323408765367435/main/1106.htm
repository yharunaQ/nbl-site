<h1 align="center">求人者・求職者の双方に対する、パンフレットによる支援メニューの提示</h1>
<h2>概要（ポイント）</h2>
<p>事業主向けのパンフレットにより、求人者・求職者の双方に支援メニューを提示して、双方のニーズを把握し、必要に応じて支援メニューを決定する。</p>
<h2>この取組による効果</h2>
<p>わかりやすく説明するため、求職・求人者に対して事業主向けのパンフレットにより支援メニューを提示する。事業主向けのパンフレットを利用することにより、求職者自身がどういう支援メニューのどれを利用しているかがわかり誤解や偏見をもたない。</p>
<h2>実施ハローワーク</h2>
<p>石川労働局　ハローワーク金沢 ハローワーク金沢</p>
