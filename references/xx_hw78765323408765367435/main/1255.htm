<h1 align="center">障害状況チェックシートの活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者手帳の有効期限等、職業相談を重ねていく中で確認を怠りがちな事項や支援に必要な事項を把握するために独自様式を作成し、予め確認が必要な内容を聴取し＜障害状況チェックシート＞に記入し、「障害者求職登録票」と併せ保管し、職業相談時に活用している。（ひな型有）</p>
<h2>この取組による効果</h2>
<p>担当職員の異動等で途切れがちな根本的な確認情報が継続されることにより、求職者に対する初期理解や各種助成金等の事務処理における必要書類の徴収状況が確認出来る。</p>
