<h1 align="center">個人情報共有についての本人了承様式の作成</h1>
<h2>概要（ポイント）</h2>
<p>安定所での相談の後、障害者職業センターにつなぐ場合（職業評価等）、本人の障害や状況の情報共有を図るため、安定所の保有する情報を障害者職業センターにも伝えることについて本人に了承してもらい、同意書をとって情報提供している。</p>
<h2>この取組による効果</h2>
<p>障害者職業センターが職業評価等を行う際、事前により詳しく本人の障害の特性や状態、経験等を把握することができる。</p>
<h2>地域連携機関</h2>
<p>滋賀障害者職業センター</p>
<h2>実施ハローワーク</h2>
<p>大津公共職業安定所　</p>
