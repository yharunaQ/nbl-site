<h1 align="center">受付の省略</h1>
<h2>概要（ポイント）</h2>
<p>受付を省略し、窓口に直接来てもらうことにより、いつでも相談できるようにした。なお、下肢障害者で歩行が不自由な求職者に対しては、従来どおり受付時から直接障害者担当職員の対応としている。</p>
<h2>この取組による効果</h2>
<p>求職者から、すぐに担当者と相談できることなどの一定の評価がある。</p>
<h2>実施ハローワーク</h2>
<p>秋田労働局　ハローワーク湯沢 企画開発部門</p>
