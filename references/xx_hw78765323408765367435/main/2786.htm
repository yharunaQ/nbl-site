<h1 align="center">地域資源の活用、役割分担で顔の見える体制を作り、情報交換し就職・定着
に結びつけている。
</h1>
<h2>概要（ポイント）</h2>
<p>本人の状況、特性、環境の把握が必要になり、最初の段階からケースワーカー精神保健福祉士を同行させ情報交換を図る。
また、安定所職員による職業講話の実施。</p>
<h2>この取組による効果</h2>
<p>就職までの支援、方向性の取り組みについて、役割分担を行い、問題点を出し合いながら少しづつ改善し雇用へのステップとする。</p>
<h2>地域連携機関</h2>
<p>障害者就業・生活支援センター、医療法人財団友朋会</p>
<h2>実施ハローワーク</h2>
<p>鹿島公共職業安定所</p>
