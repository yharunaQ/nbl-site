<h1 align="center">ろう学校の聴覚障害のある在校生に対する求職相談の際、本人の意向を確認するための補足票を使用する</h1>
<h2>概要（ポイント）</h2>
<p>聴覚障害者に対してはその障害特性から本人の意向が確認しにくい状況があることから補足票（ひな形あり）を使用し的確に把握できるように努めている。</p>
<h2>この取組による効果</h2>
<p>本人希望や状況をより的確に把握でき進路相談に活用できている。</p>
