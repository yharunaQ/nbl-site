<title>

</title>
</head><body>
<h1 align="center">
「宮古地域雇用創出連絡会議」の運営の中で、新規学卒者に対する激励訪問を行い取り組んでいる。

</h1>
<h2>概要（ポイント）</h2>
<p>養護学校の校長先生と進路担当者を同伴し、新規学卒者で管内就職した者へ、記念品を持参し、激励訪問を行っている。</p>
<h2>この取組による効果</h2>
<p>学校を卒業してから、先生方と一緒に事業所を訪問する事により、障害者自身が、自ら行っている業務について説明したり、勤務姿を見てもらう事で、仕事に対する誇りを持ち、生き生きと働き励みになっている。また、次年度の学卒求人に関する情報交換が行える。</p>
<h2>実施ハローワーク</h2>
<p>沖縄労働局　ハローワーク宮古 宮古公共職業安定所</p>
