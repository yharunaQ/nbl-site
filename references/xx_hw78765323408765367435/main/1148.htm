<h1 align="center">障害者雇用に係る事業主への支援体制のフローチャートの活用</h1>
<h2>概要（ポイント）</h2>
<p>雇用率達成指導及び求人開拓等に伴う事業所訪問時に持参し説明を実施。
（ポイント）各事業主に企業・求職者両サイドの状況に応じた雇用プランをを提示し、実習、就労、雇用への意識付けを行っている。</p>
<h2>この取組による効果</h2>
<p>各機関の人的及び経済的な各支援制度を見やすい様式で作成しており、事業主に対して障害者雇用の一層の理解の促進が図れると期待される。また、他機関の支援措置も記載されており、関係機関との連携も一層促進される。</p>
