<h1 align="center">高等部生徒の実習先・面接先の求人開拓の連携</h1>
<h2>概要（ポイント）</h2>
<p>夏休みを利用しての各学校独自（教員自ら）の求人開拓を例年やっているが、ハローワークでの求人開拓を実施した事業所への訪問をして苦情になったケースを受け、お互いの事前情報を共有することにより、無駄を省き効率的な求人開拓を実施。</p>
<h2>この取組による効果</h2>
<p>訪問実施・計画したところの個別情報の共有化を図ることにより、両者の進行状況を把握し、お互いの指導を効果的に活用し求人開拓を促進した。</p>
<h2>地域連携機関</h2>
<p>東濃特別支援学校・中濃特別支援学校</p>
<h2>実施ハローワーク</h2>
<p>美濃加茂公共職業安定所</p>
