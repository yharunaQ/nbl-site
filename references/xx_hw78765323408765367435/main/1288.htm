<h1 align="center">事業所説明用ファイルの活用</h1>
<h2>概要（ポイント）</h2>
<p>障害者雇用促進のため、職場適応訓練、トライアル雇用制度、各種助成金、ジョブコーチ支援制度などの資料を1冊のファイルにまとめ、事業所訪問、同行紹介等に活用している。</p>
<h2>この取組による効果</h2>
<p>各種の説明資料をまとめることで、その障害者に合った支援策を提示することができ、事業主の理解が促進されると思われる。</p>
<h2>実施ハローワーク</h2>
<p>山口労働局　ハローワーク山口 山口公共職業安定所</p>
