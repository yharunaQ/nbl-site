<h1 align="center">各支援制度及び助成金制度の活用</h1>
<h2>概要（ポイント）</h2>
<p>面接時には可能な限り同行し、その際に各事業所に合わせた支援制度、助成金について提案している。</p>
<h2>この取組による効果</h2>
<p>一般的な制度の説明でなく、その対象者に行う支援内容や助成金額等を具体的に示すことで面接効率が高まっていると思われる</p>
<h2>実施ハローワーク</h2>
<p>新潟労働局　ハローワーク糸魚川 糸魚川公共職業安定所</p>
