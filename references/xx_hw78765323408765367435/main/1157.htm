<h1 align="center">求職活動を積極的に行っている者への支援（職場見学、同行紹介等）</h1>
<h2>概要（ポイント）</h2>
<p>　一般求人の中から、希望に近い求人情報を送付し、本人が来所した際に面接の仕方、履歴書の記入についての指導等も行い、応募の際に必要があれば職場見学及び同行紹介を行う。</p>
<h2>この取組による効果</h2>
<p>　本人への手厚い支援により、就職への意識付け及び面接効果が高まる。</p>
<h2>実施ハローワーク</h2>
<p>千葉労働局　ハローワークいすみ いすみ出張所</p>
