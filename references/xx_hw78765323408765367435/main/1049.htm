<h1 align="center">発達障害を理解するために、事例検討を活用した職員研修の実施</h1>
<h2>概要（ポイント）</h2>
<p></p>
<h2>この取組による効果</h2>
<p>ハローワークでの職業相談時において、窓口担当者が就職不調の背景にコミュニケーション能力や対人関係に困難を抱えている等の障害があることに対する「気づき」が促進され、専門支援を受ける窓口（専門援助部門・個別支援コーナー・臨床心理士）への誘導がスムーズになったと思われる。
　また、職員研修を実施したことにより、何よりも職業相談窓口職員の意識向上につながっている。</p>
<h2>実施ハローワーク</h2>
<p>神奈川労働局　ハローワーク戸塚 戸塚公共職業安定所　雇用指導官</p>
